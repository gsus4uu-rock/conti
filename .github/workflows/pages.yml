# 엘드리아 게임을 GitHub Pages 로 배포합니다.
# configure-pages 의 enablement 옵션이 Pages 를 자동으로 켜 줍니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/dot-game-choice-rpg-sw8jb1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
