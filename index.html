/* ── 자동 백업 ───────────────────────────────────
   담임목사가 앱을 열 때, 마지막 백업이 7일보다 오래됐으면 조용히 하나 만들어 둡니다. */
function backupPayload(){
  return {
    만든날: new Date().toISOString(),
    설명: '맛있는교회 찬양 콘티 앱 백업. 악보 그림은 들어있지 않습니다.',
    인도자: ALL_LEADERS, 예배: DATA.services, 곡: DATA.songs, 콘티: DATA.setlists,
  };
}

async function listBackups(){
  const { data, error } = await sb.storage.from('sheets').list('backups', {
    limit: 60, sortBy: { column: 'name', order: 'desc' },
  });
  if(error) return [];
  return (data || []).filter(f => f.name.endsWith('.json'));
}

async function makeBackup(quiet){
  const name = `backup_${TODAY}.json`;
  const blob = new Blob([JSON.stringify(backupPayload())], { type: 'application/json' });
  const { error } = await sb.storage.from('sheets')
    .upload('backups/' + name, blob, { contentType: 'application/json', upsert: true });
  if(error){ if(!quiet) say('백업하지 못했습니다.\n' + friendlyError(error)); return false; }
  if(!quiet){ BACKUPS = await listBackups(); render(); say(`백업을 생성했습니다 — ${name}`); }
  return true;
}

let BACKUPS = null;
async function refreshBackups(){
  BACKUPS = await listBackups();
  render();
  say(BACKUPS.length ? `백업이 ${BACKUPS.length}개 있습니다.` : '아직 백업이 없습니다.');
}
async function downloadStoredBackup(name){
  const url = await getSheetUrl('backups/' + name);
  if(!url){ say('백업을 불러오지 못했습니다.'); return; }
  const a = document.createElement('a');
  a.href = url; a.download = name; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}

/** 앱을 열 때 조용히 확인 — 담임목사만, 7일에 한 번 */
async function autoBackupIfDue(){
  if(!isAdmin()) return;
  try {
    const list = await listBackups();
    if(list.length){
      const newest = list.map(f => f.name).sort().reverse()[0];
      const m = /backup_(\d{4}-\d{2}-\d{2})\.json/.exec(newest);
      if(m && daysBetween(m[1], TODAY) < 7) return;
    }
    const ok = await makeBackup(true);
    if(ok) say('이번 주 자동 백업이 생성되었습니다.');
  } catch(e){ /* 백업 실패가 앱 사용을 막지 않게 조용히 넘어간다 */ }
}


/* ══════════════════════════════════════════════════════════════════
   3단계 — 이미지 붙여넣기(Ctrl+V) · 한 장에 여러 곡인 콘티 악보 처리
   ══════════════════════════════════════════════════════════════════ */

/* ── 곡 제목 줄 해석 ─────────────────────────────
   실제 콘티 악보 머리글에 쓰이는 여러 형태를 모두 받아들인다.
     1. ( F ) 꽃들도      /  1.(F) 꽃들도
     (G) 내 영혼이 은총 입어
     날 향한 계획 (G)     /  날 향한 계획  G
     주님 마음 내게 주소서            ← 조성 없이도 가능 */
const KEY_RE = '(?:[A-Ga-g](?:#|b|♭|♯)?)';
/** 조성 표기를 정리한다. 소문자로 적어도(c, bb) 받아들인다. */
function tidyKey(k){
  if(!k) return '';
  let s = String(k).replace(/♭/g, 'b').replace(/♯/g, '#');
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}
function parseSongLine(raw){
  let t = (raw || '').trim();
  if(!t) return null;
  t = t.replace(/^\s*\d+\s*[.)\-]\s*/, '');            // 앞 번호 제거
  let key = '';

  // 제목 앞의 (F) 형태
  let m = t.match(new RegExp('^[（(\\[]\\s*(' + KEY_RE + ')\\s*[)）\\]]\\s*(.+)$'));
  if(m){ key = m[1]; t = m[2]; }
  if(!key){
    // 제목 뒤의 (F) 형태
    m = t.match(new RegExp('^(.+?)\\s*[（(\\[]\\s*(' + KEY_RE + ')\\s*[)）\\]키]*\\s*$'));
    if(m){ t = m[1]; key = m[2]; }
  }
  if(!key){
    // 제목 뒤에 공백으로 떨어진 조성
    m = t.match(new RegExp('^(.+?)\\s+(' + KEY_RE + ')\\s*키?$'));
    if(m && m[1].trim().length >= 2){ t = m[1]; key = m[2]; }
  }
  key = tidyKey(key);
  t = t.replace(/\s{2,}/g, ' ').trim();
  return t ? { title: t, key } : null;
}

/* ══════════════════════════════════════════════════════════════════
   한 장에 여러 곡이 있는 악보를 곡별로 잘라내기
   ------------------------------------------------------------------
   콘티 악보는 대개 곡과 곡 사이에 넓은 여백(빈 세로줄·가로줄)이 있다.
   그 여백을 찾아 곡 수만큼 잘라 낸다. 잘라 두면 곡마다 자기 악보를
   갖게 되어, 곡 상세 화면과 A3 3단 콘티가 제대로 나온다.
   ══════════════════════════════════════════════════════════════════ */

const SPLIT_MAX_PX = 3400;      // 분석·저장에 쓸 최대 변 길이

function loadImageEl(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다')); };
    img.src = url;
  });
}

/** 흑백 잉크 지도를 만든다. ink[p]=1 이면 글자·음표가 있는 점 */
function buildInkMap(cv){
  const w = cv.width, h = cv.height;
  const d = cv.getContext('2d').getImageData(0, 0, w, h).data;
  const n = w * h;
  const lum = new Uint8Array(n);
  const hist = new Uint32Array(256);
  for(let p = 0, i = 0; p < n; p++, i += 4){
    const v = (d[i] * 299 + d[i+1] * 587 + d[i+2] * 114) / 1000 | 0;
    lum[p] = v; hist[v]++;
  }
  // 종이 바탕색을 상위 10% 지점으로 잡고, 그보다 확실히 어두우면 잉크로 본다
  let acc = 0, paper = 255;
  const need = n * 0.90;
  for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= need){ paper = v; break; } }
  let th = paper - 55;
  if(th < 70) th = 70;
  if(th > 215) th = 215;
  const ink = new Uint8Array(n);
  for(let p = 0; p < n; p++) ink[p] = lum[p] < th ? 1 : 0;
  return { ink, w, h };
}

/** 상자 안에서 세로줄·가로줄별 잉크 비율을 낸다 */
function inkProfiles(M, box){
  const col = new Float32Array(box.w), row = new Float32Array(box.h);
  for(let y = 0; y < box.h; y++){
    const base = (box.y + y) * M.w + box.x;
    let rc = 0;
    for(let x = 0; x < box.w; x++){ if(M.ink[base + x]){ col[x]++; rc++; } }
    row[y] = rc / box.w;
  }
  for(let x = 0; x < box.w; x++) col[x] /= box.h;
  return { col, row };
}

const INK_MIN = 0.004;   // 이 정도 비율이면 내용이 있는 줄로 본다

function trimRange(prof){
  let a = 0, b = prof.length - 1;
  while(a < prof.length && prof[a] <= INK_MIN) a++;
  while(b > a && prof[b] <= INK_MIN) b--;
  return [a, b];
}

/** 빈 구간을 찾아 n등분 자리를 고른다. 못 찾으면 null
    ------------------------------------------------------------------
    악보는 오선 사이에도 여백이 있어서, 「빈 줄이 있다」는 것만으로는
    곡 경계라고 볼 수 없다. 곡과 곡 사이의 여백은 그 밖의 여백보다
    뚜렷하게 넓다는 점을 기준으로 삼는다. 애매하면 나누지 않는다. */
function findCutPoints(prof, n, minRatio, minWidthPct){
  const [a, b] = trimRange(prof);
  const span = b - a + 1;
  if(span < prof.length * 0.3) return null;
  const minGap = Math.max(5, span * 0.008);

  const gaps = [];
  let s = -1;
  for(let i = a; i <= b; i++){
    if(prof[i] <= INK_MIN){ if(s < 0) s = i; }
    else { if(s >= 0 && i - s >= minGap) gaps.push({ c: (s + i - 1) / 2, w: i - s }); s = -1; }
  }
  if(s >= 0 && b - s + 1 >= minGap) gaps.push({ c: (s + b) / 2, w: b - s + 1 });
  if(gaps.length < n - 1) return null;

  const minSig = Math.max(minGap, span * minWidthPct);
  const chosen = [], cuts = [];
  for(let i = 1; i < n; i++){
    const target = a + span * i / n;
    const tol = (span / n) * 0.42;
    let best = null;
    for(const g of gaps){
      if(Math.abs(g.c - target) > tol || g.w < minSig) continue;
      if(!best || g.w > best.w) best = g;
    }
    if(!best) return null;
    if(cuts.length && best.c <= cuts[cuts.length - 1] + minGap) return null;
    chosen.push(best);
    cuts.push(Math.round(best.c));
  }
  // 고르지 않은 여백 중 가장 넓은 것보다 확실히 넓어야 곡 경계로 인정한다
  const rest = gaps.filter(g => chosen.indexOf(g) < 0);
  if(rest.length){
    let maxRest = 0;
    for(const g of rest) if(g.w > maxRest) maxRest = g.w;
    let minSel = Infinity;
    for(const g of chosen) if(g.w < minSel) minSel = g.w;
    if(minSel < maxRest * minRatio) return null;
  }
  return { start: a, end: b, cuts };
}

/** 콘티 악보 맨 위·아래에 걸쳐 있는 머리글(날짜·예배명·쪽번호)을 떼어 낸다.
    이 띠가 남아 있으면 곡 사이 여백이 글자로 막혀 세로로 나눌 수 없다. */
function dropBanners(M, box){
  const { row } = inkProfiles(M, box);
  const [a, b] = trimRange(row);
  if(b <= a) return box;
  const minBlank = Math.max(4, box.h * 0.012);
  const blocks = [];
  let s = -1;
  for(let i = a; i <= b + 1; i++){
    const blank = i > b || row[i] <= INK_MIN;
    if(!blank){ if(s < 0) s = i; }
    else if(s >= 0){
      let j = i;
      while(j <= b && row[j] <= INK_MIN) j++;
      if(j - i >= minBlank || i > b){ blocks.push([s, i - 1]); s = -1; }
    }
  }
  if(blocks.length < 2) return { ...box, y: box.y + a, h: b - a + 1 };
  let lo = blocks[0][0], hi = blocks[blocks.length - 1][1];
  const cap = box.h * 0.09;
  if(blocks.length > 2 && blocks[0][1] - blocks[0][0] + 1 <= cap) lo = blocks[1][0];
  const last = blocks[blocks.length - 1];
  if(blocks.length > 2 && last[1] - last[0] + 1 <= cap) hi = blocks[blocks.length - 2][1];
  if(hi - lo < box.h * 0.3) return { ...box, y: box.y + a, h: b - a + 1 };
  return { ...box, y: box.y + lo, h: hi - lo + 1 };
}

/** 상자를 세로(v) 또는 가로(h)로 n등분한다.
    그대로 나눠 보고, 안 되면 위아래 머리글 띠를 떼고 한 번 더 시도한다.
    (곡 제목까지 잘려 나가지 않도록, 떼는 것은 어디까지나 차선책이다) */
function splitBox(M, box, n, axis){
  let out = splitBoxAt(M, box, n, axis);
  if(!out && axis === 'v'){
    const b2 = dropBanners(M, box);
    if(b2.y !== box.y || b2.h !== box.h) out = splitBoxAt(M, b2, n, axis);
  }
  return out;
}

function splitBoxAt(M, box, n, axis){
  const { col, row } = inkProfiles(M, box);
  const prof  = axis === 'v' ? col : row;
  const other = axis === 'v' ? row : col;
  // 가로로 나눌 때는 오선 사이 여백에 속기 쉬우므로 더 엄격하게 본다
  const c = axis === 'v'
    ? findCutPoints(prof, n, 1.5, 0.010)
    : findCutPoints(prof, n, 1.9, 0.020);
  if(!c) return null;
  const [oa, ob] = trimRange(other);
  const edges = [c.start, ...c.cuts, c.end];
  const out = [];
  for(let i = 0; i < n; i++){
    const s = edges[i], e = edges[i + 1];
    if(e - s < 20) return null;
    out.push(axis === 'v'
      ? { x: box.x + s,  y: box.y + oa, w: e - s,        h: ob - oa + 1 }
      : { x: box.x + oa, y: box.y + s,  w: ob - oa + 1,  h: e - s });
  }
  return out;
}

/** 곡 수 n에 맞는 자르기 방식을 찾는다 (세로 → 가로 → 바둑판) */
function planSplit(M, n){
  if(n < 2) return null;
  const full = { x: 0, y: 0, w: M.w, h: M.h };
  let boxes = splitBox(M, full, n, 'v');            // 나란히 놓인 세로 단 — 가장 흔하다
  if(boxes) return boxes;
  boxes = splitBox(M, full, n, 'h');                // 위아래로 쌓인 형태
  if(boxes) return boxes;
  if(n >= 4 && n % 2 === 0){                        // 바둑판 형태 (왼→오, 위→아래)
    const rows = splitBox(M, full, 2, 'h');
    if(rows){
      const out = [];
      let ok = true;
      for(const r of rows){
        const cols = splitBox(M, r, n / 2, 'v');
        if(!cols){ ok = false; break; }
        out.push(...cols);
      }
      if(ok) return out;
    }
    const cols = splitBox(M, full, 2, 'v');
    if(cols){
      const out = [];
      let ok = true;
      for(const c of cols){
        const rws = splitBox(M, c, n / 2, 'h');
        if(!rws){ ok = false; break; }
        out.push(...rws);
      }
      if(ok) return out;
    }
  }
  return null;
}

/** 잘라낸 한 조각을 그림 파일로 만든다 */
function cropCanvas(cv, box, maxPx, quality, asDataUrl, padRatio){
  const pad = Math.round(Math.min(box.w, box.h) * (padRatio == null ? 0.02 : padRatio));
  const x = Math.max(0, box.x - pad), y = Math.max(0, box.y - pad);
  const w = Math.min(cv.width - x,  box.w + pad * 2);
  const h = Math.min(cv.height - y, box.h + pad * 2);
  const s = Math.min(1, maxPx / Math.max(w, h));
  const t = document.createElement('canvas');
  t.width = Math.max(1, Math.round(w * s));
  t.height = Math.max(1, Math.round(h * s));
  const ctx = t.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, t.width, t.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(cv, x, y, w, h, 0, 0, t.width, t.height);
  if(asDataUrl) return Promise.resolve(t.toDataURL('image/jpeg', Math.max(.45,Math.min(.92,Number(quality)||.62))));
  return new Promise(r => t.toBlob(b => r(b), 'image/jpeg', quality));
}

/** 파일 하나를 n조각으로 나눈 결과를 돌려준다 */
async function analyzeSplit(file, n){
  return analyzeSplitImage(await loadImageEl(file), n);
}

/** 이미 서버에 올라가 있는 악보를 주소로 불러와 나눈다 */
function analyzeSplitFromUrl(url, n){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { try { resolve(analyzeSplitImage(img, n)); } catch(e){ reject(e); } };
    img.onerror = () => reject(new Error('악보 그림을 불러오지 못했습니다'));
    img.src = url;
  });
}

async function analyzeSplitImage(img, n){
  const scale = Math.min(1, SPLIT_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas');
  cv.width  = Math.max(1, Math.round(img.naturalWidth  * scale));
  cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);

  const proposal = window.safeScoreRegionDetector?.detectFromCanvas
    ? window.safeScoreRegionDetector.detectFromCanvas(cv)
    : null;
  const hypotheses = (proposal?.layout_hypotheses || [])
    .filter(item => Number(item.count_estimate) === n && Array.isArray(item.boxes) && item.boxes.length === n)
    .sort((a,b) => declaredLayoutPriority(b,n)-declaredLayoutPriority(a,n)
      || Number(b.rank_score ?? b.visual_score ?? 0) - Number(a.rank_score ?? a.visual_score ?? 0));
  const fallbackNormalized = declaredCountFallbackBoxes(n);
  const chosen = hypotheses[0];
  const normalized = chosen
    ? chosen.boxes.map(item => item.bbox || item)
    : fallbackNormalized;
  const boxes = normalized.map(box => normalizedBoxToPixels(box, cv));
  const previews = [];
  for(const b of boxes) previews.push(await cropCanvas(cv, b, 420, 0.62, true));
  return {
    canvas: cv, boxes, previews, proposal,
    hypotheses: hypotheses.length ? hypotheses : [{id:'declared_count_fallback',count_estimate:n,boxes:fallbackNormalized.map(bbox=>({bbox})),visual_score:0}],
    hypothesisIndex: 0,
  };
}

function declaredLayoutPriority(item,n){
  const id=String(item?.id||'');
  if(id==='visual_chosen'||id==='mixed_grid')return 8;
  if(n===2&&id==='two_column')return 7;
  if(n===3&&(id==='three_column'||id==='three_columns_fixed'))return 7;
  if(n===4&&(id==='four_2x2'||id.startsWith('four_3col_')))return 7;
  return 1;
}

function normalizedBoxToPixels(box, canvas){
  const x0=Math.max(0,Math.min(1,Number(box?.[0])||0)),y0=Math.max(0,Math.min(1,Number(box?.[1])||0));
  const x1=Math.max(x0+.001,Math.min(1,Number(box?.[2])||1)),y1=Math.max(y0+.001,Math.min(1,Number(box?.[3])||1));
  const x=Math.round(x0*canvas.width),y=Math.round(y0*canvas.height);
  return {x,y,w:Math.max(1,Math.round((x1-x0)*canvas.width)),h:Math.max(1,Math.round((y1-y0)*canvas.height))};
}

/** 사용자가 곡 수를 알려 줬다면 실패 화면 대신 언제나 그 수만큼 안전한 초안을 보여 준다. */
function declaredCountFallbackBoxes(n){
  n=Math.max(1,Math.min(20,Math.floor(Number(n)||1)));
  if(n===1)return [[0,0,1,1]];
  if(n===2)return [[0,0,.5,1],[.5,0,1,1]];
  if(n===3)return [[0,0,1/3,1],[1/3,0,2/3,1],[2/3,0,1,1]];
  if(n===4)return [[0,0,.5,.5],[.5,0,1,.5],[0,.5,.5,1],[.5,.5,1,1]];
  if(n===5)return [[0,0,1/3,.5],[1/3,0,2/3,.5],[2/3,0,1,.5],[0,.5,.5,1],[.5,.5,1,1]];
  const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),out=[];
  for(let i=0;i<n;i++){const row=Math.floor(i/cols),col=i%cols;out.push([col/cols,row/rows,(col+1)/cols,(row+1)/rows]);}
  return out;
}

function scoreMagnifyMove(event){
  const host=event?.currentTarget,img=host?.querySelector?.('img'),lens=host?.querySelector?.('.score-magnifier');
  if(!host||!img||!lens||!img.naturalWidth)return false;
  const rect=img.getBoundingClientRect(),hostRect=host.getBoundingClientRect();
  const x=(event.clientX-rect.left)/Math.max(1,rect.width),y=(event.clientY-rect.top)/Math.max(1,rect.height);
  if(x<0||x>1||y<0||y>1){scoreMagnifyHideAll();return false;}
  const lensWidth=lens.offsetWidth||180,lensHeight=lens.offsetHeight||128;
  const zoom=Math.max(2.8,Math.min(5,img.naturalWidth/Math.max(1,rect.width)*.8));
  const localX=event.clientX-hostRect.left,localY=event.clientY-hostRect.top;
  const left=Math.max(0,Math.min(Math.max(0,hostRect.width-lensWidth),localX-lensWidth/2));
  const top=Math.max(0,Math.min(Math.max(0,hostRect.height-lensHeight),localY-lensHeight/2));
  lens.style.left=`${left}px`;lens.style.top=`${top}px`;
  lens.style.backgroundImage=`url(${JSON.stringify(img.currentSrc||img.src)})`;
  lens.style.backgroundSize=`${rect.width*zoom}px ${rect.height*zoom}px`;
  lens.style.backgroundPosition=`${lensWidth/2-x*rect.width*zoom}px ${lensHeight/2-y*rect.height*zoom}px`;
  lens.dataset.x=String(Number(x.toFixed(4)));lens.dataset.y=String(Number(y.toFixed(4)));
  scoreMagnifyHideAll(lens);
  lens.classList.add('on');return true;
}

          const blob=await cropCanvas(sp.canvas,sp.boxes[page.order[i]],1800,0.85,false);
          const p=`${contiPrefix}/${stamp}_${pageIndex+1}_${i+1}.jpg`;
          const {error}=await sb.storage.from('sheets').upload(p,blob,{contentType:'image/jpeg',upsert:false});
          if(error)throw error;uploaded.push(p);
          entryUnits.push({...rows[i],title:String(rows[i].title||'').trim(),storagePath:p,cut:true,pageIndex,rowIndex:i,pageSize:rows.length});
        }
      }else{
        const blob=await shrinkImage(page.file,1800,0.85),p=`${contiPrefix}/${stamp}_${pageIndex+1}_${rows.length}songs.jpg`;
        const {error}=await sb.storage.from('sheets').upload(p,blob,{contentType:'image/jpeg',upsert:false});
        if(error)throw error;uploaded.push(p);
        rows.forEach((row,i)=>entryUnits.push({...row,title:String(row.title||'').trim(),storagePath:p,cut:false,pageIndex,rowIndex:i,pageSize:rows.length}));
      }
    }

    // 2) 올리기가 끝난 뒤에야 곡을 확보한다 (없으면 새로 등록)
    const songIds = [];
    for(const e of entryUnits){
      let id = e.songId;
      if(!id){ id = await createSong(e.title, { key: e.key }); }
      else if(e.key && S[id] && !S[id].key){ await updateSongQuiet(id, { origin_key: e.key }); }
      if(id) songIds.push({ id, key:e.key,storagePath:e.storagePath,cut:e.cut,pageIndex:e.pageIndex,rowIndex:e.rowIndex,pageSize:e.pageSize });
    }
    if(!songIds.length) throw new Error('곡을 만들지 못했습니다');

    // 3) 곡마다 악보를 연결한다
    const sheetRows = songIds.map((s, i) => ({
      song_id: s.id, sheet_key: s.key || null,
      is_origin: !(S[s.id] && S[s.id].sheets.length),
      storage_path:s.storagePath, file_type: 'image',
      note:s.cut?null:(s.pageSize>1?`여러 곡이 함께 있는 악보 (${s.rowIndex+1}/${s.pageSize})`:null),
      sort_order: 1, uploaded_by: AUTH_USER.id,
    }));
    const { error: shErr } = await sb.from('sheets').insert(sheetRows);
    if(shErr) throw shErr;
    sheetsDone = true;

    // 4) 요청하면 콘티까지 만든다
    let newSetlistId = null;
    if(pasteState.makeSetlist){
      const { data, error } = await sb.from('setlists').insert({
        service_date: pasteState.date, service_id: pasteState.serviceId,
        leader_id: pasteState.leaderId, created_by: ME ? ME.id : null,
      }).select('id').single();
      if(error) throw error;
      newSetlistId = data.id;
      const items = songIds.map((s, i) => ({
        setlist_id: newSetlistId, song_id: s.id, position: i + 1, sung_key: s.key || null,
      }));
      const { error: itErr } = await sb.from('setlist_items').insert(items);
      if(itErr) throw itErr;
    }

    const n = songIds.length,pageCount=pages.length,allCut=songIds.every(song=>song.cut);
    closePaste();
    await loadAll();
    if(newSetlistId){ go('setlist/' + newSetlistId); }
    else { render(); }
    const done = pageCount>1
      ? `콘티 ${pageCount}장, ${n}곡의 악보를 모두 연결했습니다.`
      : allCut?`악보를 곡별로 잘라 ${n}곡에 각각 연결했습니다.`:`곡 ${n}개에 악보를 연결했습니다.`;
    say(newSetlistId ? done + '\n콘티도 함께 만들었습니다.' : done);
  } catch(e){
    // 악보 연결 전에 실패했다면, 올려 둔 파일이 떠돌지 않도록 되돌린다
    if(uploaded.length && !sheetsDone){ try { await sb.storage.from('sheets').remove(uploaded); } catch(_){} }
    if(pasteState) pasteState.busy = false;
    await loadAll();
    render();
    say('등록하지 못했습니다.\n' + friendlyError(e)
      + '\n\n이미 처리된 부분이 있으면 다시 시도해도 중복되지 않습니다.');
  }
}

/* ── 곡 담기 ─────────────────────────────────────
   곡 도서관·곡 상세·검색 어디서든 곡을 담아두고,
   콘티 입력 화면에서 그대로 콘티로 만든다. */
function inCart(songId){
  return inputState && inputState.picked.some(p => p.songId === songId);
}
function cartCount(){ return inputState ? inputState.picked.length : 0; }

function addToCart(songId, ev){
  if(ev) ev.stopPropagation();
  const s = S[songId];
  if(!s) return;
  if(inCart(songId)){ say(`「${esc(s.title)}」은 이미 담겨 있습니다.`); return; }
  inputState.picked.push({ songId, key: s.key || '', note: '' });
  render();
  say(`「${esc(s.title)}」을 담았습니다. 담은 곡 ${inputState.picked.length}개.`);
}
function removeFromCart(songId, ev){
  if(ev) ev.stopPropagation();
  const i = inputState.picked.findIndex(p => p.songId === songId);
  if(i < 0) return;
  const s = S[songId];
  inputState.picked.splice(i, 1);

  say(`「${esc(s ? s.title : '')}」을 뺐습니다.`);
}
function cartButton(songId){

  return `<button class="btn sm ${has?'':'pri'}"

}

/** 상단에 담은 곡 개수를 띄운다 */

/* ── 악보 크게 보기 ──────────────────────────────
   모든 악보 화면에서 공통으로 사용합니다.
   화면 맞춤(100%)을 기준으로 축소·확대하며, 빠른 미리보기는 악보를 다시 누르면 닫힙니다. */
let bigSheet = null;   // { path, type, zoom, list, i, quick }
const BIG_ZOOM = [.4, .55, .7, .85, 1, 1.25, 1.7, 2.6, 4];
const BIG_ZOOM_FIT = BIG_ZOOM.indexOf(1);

/** 지금 화면에 있는 악보들을 순서대로 모은다 (콘티 악보를 넘겨 볼 수 있게) */
function bigSheetList(){
  return [...document.querySelectorAll('.sheet-view[data-sheet]')].map(el => {
    const blk = el.closest('.sheet');
    const ti = blk ? blk.querySelector('.sheet-h .ti') : null;
    return { path: el.getAttribute('data-sheet'),
             type: el.getAttribute('data-type') || 'image',
             title: ti ? ti.textContent.trim() : '' };
  });
}

function openBigSheet(path, type, options){
  const quick = !!(options && options.quick);
  const list = bigSheetList();
  let i = list.findIndex(x => x.path === path);
  if(i < 0){ list.length = 0; i = 0; list.push({ path, type: type || 'image', title: '' }); }
  bigSheet = { path, type: type || 'image', zoom: BIG_ZOOM_FIT, list, i, quick };
  document.body.style.overflow = 'hidden';
  paintBigSheet();
}

/** 앞뒤 곡의 악보로 넘긴다 */
function stepBigSheet(d, ev){
  if(ev) ev.stopPropagation();
  if(!bigSheet) return;
  const j = bigSheet.i + d;
  if(j < 0 || j >= bigSheet.list.length) return;
  const x = bigSheet.list[j];
  bigSheet = { ...bigSheet, path: x.path, type: x.type, i: j, zoom: BIG_ZOOM_FIT };
  paintBigSheet();
}
function closeBigSheet(){
  bigSheet = null;
  document.body.style.overflow = '';
  const el = document.getElementById('bigSheet');
  if(el) el.remove();
}
function setBigSheetZoom(next, ev){
  if(ev) ev.stopPropagation();
  if(!bigSheet) return;
  bigSheet.zoom = Math.max(0, Math.min(BIG_ZOOM.length - 1, next));
  const media = document.querySelector('#bigSheet .bs-media');
  if(media) media.style.width = (BIG_ZOOM[bigSheet.zoom] * 100) + '%';
  const lb = document.getElementById('bigZoomLb');
  if(lb) lb.textContent = Math.round(BIG_ZOOM[bigSheet.zoom] * 100) + '%';
  const smaller = document.getElementById('bigZoomOut');
  const larger = document.getElementById('bigZoomIn');
  if(smaller) smaller.disabled = bigSheet.zoom === 0;
  if(larger) larger.disabled = bigSheet.zoom === BIG_ZOOM.length - 1;
}
function zoomBigSheet(d, ev){
  if(!bigSheet) return;
  setBigSheetZoom(bigSheet.zoom + d, ev);
}
function fitBigSheet(ev){
  setBigSheetZoom(BIG_ZOOM_FIT, ev);
}
function bigSheetImageClick(ev){
  if(ev) ev.stopPropagation();
  if(!bigSheet) return;
  if(bigSheet.quick) closeBigSheet();
  else zoomBigSheet(1, ev);
}
async function paintBigSheet(){
  if(!bigSheet) return;
  let el = document.getElementById('bigSheet');
  if(!el){
    el = document.createElement('div');
    el.id = 'bigSheet';
    el.className = 'bigsheet';
    document.body.appendChild(el);
  }
  const L = bigSheet.list || [], i = bigSheet.i || 0;
  const cur = L[i] || {};
  el.onclick = ev => { if(bigSheet && bigSheet.quick && ev.target === el) closeBigSheet(); };
  el.innerHTML = `<div class="bs-bar">
      <button class="btn sm" onclick="closeBigSheet()">✕ 닫기</button>
      ${L.length > 1 ? `<button class="btn sm" ${i === 0 ? 'disabled' : ''}
        onclick="stepBigSheet(-1, event)">◀</button>
      <button class="btn sm" ${i >= L.length - 1 ? 'disabled' : ''}
        onclick="stepBigSheet(1, event)">▶</button>` : ''}
      <div class="bs-ti">${esc(cur.title || '')}${
        L.length > 1 ? `<span class="sub"> ${i + 1}/${L.length}</span>` : ''}</div>
      <div class="bs-zoom">
        <button class="btn sm" id="bigZoomOut" onclick="zoomBigSheet(-1,event)" title="악보를 작게">− 작게</button>
        <span class="sub" id="bigZoomLb">100%</span>
        <button class="btn sm pri" id="bigZoomIn" onclick="zoomBigSheet(1,event)" title="악보를 크게">＋ 크게</button>
        <button class="btn sm" onclick="fitBigSheet(event)" title="화면 너비에 맞춤">맞춤</button>
      </div>
    </div>
    <div class="bs-body"><div class="sub" style="padding:40px;text-align:center;color:#fff">
      악보를 불러오는 중…</div></div>`;
  const url = await getSheetUrl(bigSheet.path);
  const body = el.querySelector('.bs-body');
  if(!body) return;
  body.innerHTML = !url ? `<div class="sub" style="padding:40px;color:#fff">악보를 불러오지 못했습니다</div>`
    : bigSheet.type === 'pdf'
      ? `<div class="bs-canvas"><iframe class="bs-media" src="${url}#toolbar=1"
           style="width:100%;height:calc(100vh - 86px);border:none;background:#fff"></iframe></div>`
      : `<div class="bs-canvas"><img class="bs-media" src="${url}" style="width:100%" alt="악보"
           onclick="bigSheetImageClick(event)"></div>`;
  setBigSheetZoom(bigSheet.zoom);
}

document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && bigSheet) closeBigSheet();
  if(bigSheet && (ev.key === '+' || ev.key === '=')) zoomBigSheet(1, ev);
  if(bigSheet && ev.key === '-') zoomBigSheet(-1, ev);
  if(bigSheet && ev.key === '0') fitBigSheet(ev);
});

/* ── A3 3단 콘티 악보 만들기 ─────────────────────
   실제 예배에서 쓰는 콘티 악보는 A3 한 장을 세로로 3등분해
   곡을 나란히 배치한 형태다. 그 형태를 그대로 만들어 준다. */
let contiSheetId = null;

function vContiSheet(id){

  }).filter(Boolean);

  const shared = {};

  const hasShared = Object.values(shared).some(n => n > 1);

  const pages = [];
  for(let i = 0; i < picks.length; i += 3) pages.push(picks.slice(i, i + 3));

  return `

       · 인도 ${esc(leaderName(st.leaderId))} · A3 가로 · 세로 3등분</p>
  </div>

  <div class="card no-print" style="margin-bottom:18px"><div class="card-b">
    <div class="row">
      <div class="info" style="flex:1;margin:0">
        <b>인쇄 설정</b> — 인쇄 창에서 <b>용지 A3 · 가로 방향 · 배율 100%</b> 로 맞춰 주세요.
        「대상」을 <b>PDF로 저장</b>으로 두면 파일로 받을 수 있습니다.
        ${pages.length > 1 ? `<br>곡이 ${picks.length}개라 <b>${pages.length}장</b>으로 나옵니다.` : ''}
      </div>
      <button class="btn pri" onclick="window.print()">인쇄 · PDF로 저장</button>
    </div>
    <div class="hint mob-only" style="margin-top:12px">
      이 화면은 <b>A3 한 장에 3단</b>으로 인쇄하기 위한 모양입니다.
      폰에서는 작게 보이는 것이 정상입니다 — 컴퓨터에서 인쇄하거나,
      폰에서 <b>공유 → 프린트 → PDF로 저장</b> 하셔도 됩니다.</div>
    ${noSheet.length ? `<div class="hint" style="margin-top:12px">
      악보가 등록되지 않은 곡이 ${noSheet.length}개 있습니다 —
      ${noSheet.map(p=>esc(p.song.title)).join(' · ')}<br>
      해당 칸은 제목만 인쇄됩니다. 곡 상세 화면에서 악보를 등록하면 함께 인쇄됩니다.</div>` : ''}
    ${hasShared ? `<div class="hint" style="margin-top:12px">
      <b>여러 곡이 같은 악보 한 장을 함께 쓰고 있습니다.</b>
      그 악보는 이미 여러 곡이 인쇄된 한 장이므로, 3단으로 나누면 같은 그림이 반복됩니다.<br>
      곡별 악보를 따로 등록하면 제대로 3단으로 조판됩니다.</div>` : ''}
  </div></div>

  <div class="a3-wrap">
    ${pages.map(page => `
      <div class="a3-page">
        ${page.map(p => `
          <div class="a3-col">
            <div class="a3-head">
              <span class="a3-no">${p.it.order}.</span>
              <span class="a3-key">( ${esc(p.it.key || p.song.key || '')} )</span>
              <span class="a3-title">${esc(p.song.title)}</span>

            ${p.sheet
              ? `<div class="a3-img" data-sheet="${esc(p.sheet.path)}" data-type="${esc(p.sheet.fileType)}">
                   <div class="sub" style="padding:30px;text-align:center">불러오는 중…</div></div>`
              : `<div class="a3-empty">악보 없음</div>`}
          </div>`).join('')}
        ${page.length < 3 ? Array(3 - page.length).fill('<div class="a3-col"></div>').join('') : ''}
      </div>`).join('')}
  </div>`;
}

/** 콘티 상세에서 이 화면으로 들어가는 단추 */

/* ── 악보 교체 확인 창 ───────────────────────────

        같은 날짜·예배의 콘티가 이미 있으면 <b>건너뜁니다.</b>
        중간에 멈춰도 다시 실행하면 이어서 등록됩니다.</div>
      <label class="btn pri" style="cursor:pointer">꾸러미 파일 고르기

      ${st && st.man ? `<span class="sub" style="margin-left:12px">${esc(st.file.name)}

    </div></div>

    ${st && st.man ? `<div class="card"><div class="card-b">
      <div class="row" style="margin-bottom:12px">
        <b>꾸러미 내용</b><div class="spacer"></div>
        <span class="sub">곡 <b>${st.man.곡.length}</b>개 ·
          콘티 <b>${st.man.콘티.length}</b>개 · 악보 <b>${st.sheetCount}</b>장</span>

      <div class="t-scroll" style="max-height:260px"><table>
        <thead><tr><th>날짜</th><th>예배</th><th>인도자</th><th>찬양</th></tr></thead>
        <tbody>${st.man.콘티.slice(0, 200).map(c => `<tr>
          <td class="mono sub">${esc(c.date)}</td><td>${esc(c.service)}</td>
          <td>${esc(c.leader || '—')}</td>
          <td class="sub">${c.items.map(i => esc(i.title)).join(' → ')}</td></tr>`).join('')}
        </tbody></table></div>
      <div class="row" style="margin-top:14px">
        <div class="info" style="flex:1;margin:0">악보 ${st.sheetCount}장을 올려야 하므로
          <b>몇 분 걸립니다.</b> 창을 닫지 말고 기다려 주세요.</div>
        ${st.busy
          ? `<button class="btn" onclick="impState.stop=true">중단</button>`
          : `<button class="btn pri" onclick="runImport()">가져오기 시작</button>`}
      </div>
    </div></div>` : ''}

    ${st && st.log.length ? `<div class="card"><div class="card-b">
      <div class="row" style="margin-bottom:8px"><b>진행 상황</b>

      <div class="bar" style="height:8px;margin-bottom:12px"><i style="width:${
        st.total ? Math.round(st.done / st.total * 100) : 0}%"></i></div>
      <div class="imp-log">${st.log.slice(-160).map(l => `<div>${esc(l)}</div>`).join('')}</div>
    </div></div>` : ''}

}

function impLog(msg){
  if(!impState) return;
  impState.log.push(msg);
  const el = document.getElementById('impLog');
  if(el){ el.innerHTML = impState.log.slice(-160).map(l => `<div>${esc(l)}</div>`).join('');
          el.scrollTop = el.scrollHeight; }
  else render();
}
function impTick(){
  if(!impState) return;
  const el = document.querySelector('.bar i');
  if(el) el.style.width = (impState.total ? impState.done / impState.total * 100 : 0) + '%';
}

/** JSZip 을 필요할 때만 불러온다 */
function loadJsZip(){
  if(window.JSZip) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = new URL('./vendor/jszip/v3.10.1/jszip.min.js', document.baseURI).href;
    s.onload = () => window.JSZip ? resolve() : reject(new Error('압축 해제 도구를 확인하지 못했습니다'));
    s.onerror = () => reject(new Error('내장 압축 해제 도구를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
}

async function onImportPick(ev){
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if(!f) return;
  impState = { file: f, zip: null, man: null, log: [], done: 0, total: 0,
               busy: false, stop: false, sheetCount: 0 };
  render();
  say('꾸러미를 여는 중입니다…');
  try {
    await loadJsZip();
    const zip = await JSZip.loadAsync(f);
    const mf = zip.file('manifest.json');
    if(!mf) throw new Error('꾸러미 안에 manifest.json 이 없습니다');
    const man = JSON.parse(await mf.async('string'));
    if(!man.곡 || !man.콘티) throw new Error('꾸러미 형식이 맞지 않습니다');
    impState.zip = zip;
    impState.man = man;
    impState.sheetCount = new Set(man.곡.flatMap(s => s.sheets || [])).size;
    render();
    say(`곡 ${man.곡.length}개 · 콘티 ${man.콘티.length}개를 읽었습니다.`);
  } catch(e){
    impState = null; render();
    say('꾸러미를 열지 못했습니다.\n' + (e.message || e));
  }
}

async function runImport(){
  const st = impState;
  if(!st || !st.man || st.busy) return;
  st.busy = true; st.stop = false; st.log = []; st.done = 0;
  const man = st.man;
  st.total = man.곡.length + st.sheetCount + man.콘티.length;
  render();

  try {
    // 0) 예배·인도자 이름을 실제 id 로 바꾼다
    let svcId = {}, ldrId = {};
    const wanted = [...new Set((man.예배 || []).concat(man.콘티.map(c => c.service)))].filter(Boolean);
    for(const nm of wanted){
      if(DATA.services.some(v => norm(v.name) === norm(nm))) continue;
      const { error } = await sb.from('services')
        .insert({ name: nm, sort_order: DATA.services.length + 1 });
      if(!error) impLog(`예배 추가 — ${nm}`);
    }
    await loadAll();
    DATA.services.forEach(v => svcId[norm(v.name)] = v.id);
    ALL_LEADERS.forEach(l => ldrId[norm(l.name)] = l.id);

    // 1) 곡 등록
    const songId = {};
    for(const s of man.곡){
      if(st.stop) throw new Error('중단했습니다');
      const n = norm(s.title);
      let id = NORM_INDEX[n];
      if(!id){
        const { data, error } = await sb.from('songs')
          .insert({ title: s.title, origin_key: s.key || null }).select('id').single();
        if(error) throw error;
        id = data.id;
        NORM_INDEX[n] = id;
        impLog(`곡 등록 — ${s.title}`);
      }
      songId[n] = id;
      st.done++; impTick();
    }
    await loadAll();

    // 2) 악보 올리기 — 파일 이름이 그림 내용으로 정해져 있어 두 번 올려도 겹치지 않는다
    let up = 0, skip = 0;
    for(const s of man.곡){
      const n = norm(s.title);
      const id = songId[n] || NORM_INDEX[n];
      const song = S[id];
      const files = s.sheets || [];
      for(let i = 0; i < files.length; i++){
        if(st.stop) throw new Error('중단했습니다');
        const path = `import/${files[i]}`;
        if(song && song.sheets.some(sh => sh.path === path)){ skip++; st.done++; impTick(); continue; }
        const zf = st.zip.file('img/' + files[i]);
        if(!zf){ st.done++; continue; }
        const blob = await zf.async('blob');
        const { error: upErr } = await sb.storage.from('sheets')
          .upload(path, blob, { contentType: 'image/jpeg', upsert: true });
        if(upErr) throw upErr;
        const { error } = await sb.from('sheets').insert({
          song_id: id, sheet_key: s.key || null, is_origin: i === 0,
          storage_path: path, file_type: 'image', sort_order: i + 1,
        });
        if(error) throw error;
        up++;
        if(up % 10 === 0) impLog(`악보 ${up}장 등록…`);
        st.done++; impTick();
      }
    }
    impLog(`악보 ${up}장 등록 · ${skip}장은 이미 있어 건너뜀`);
    await loadAll();

    // 3) 콘티 등록
    const have = {};
    DATA.setlists.forEach(x => { have[x.date + '|' + x.serviceId] = x; });
    let made = 0, dup = 0, fixed = 0, redone = 0;
    for(const c of man.콘티){
      if(st.stop) throw new Error('중단했습니다');
      const sid = svcId[norm(c.service)] || (DATA.services[0] || {}).id;
      const lid = ldrId[norm(c.leader)] || null;
      if(!sid){ st.done++; continue; }
      const old = have[c.date + '|' + sid];
      if(old){
        // 곡 목록을 통째로 바로잡으라고 표시된 콘티는 항목을 새로 깐다
        if(c.replace){
          const rows = c.items.map((it, i) => ({
            setlist_id: old.id, song_id: NORM_INDEX[norm(it.title)],
            position: i + 1, sung_key: it.key || null,
          })).filter(x => x.song_id);
          if(rows.length){
            const { error: e0 } = await sb.from('setlist_items').delete().eq('setlist_id', old.id);
            if(e0) throw e0;
            const { error: e1 } = await sb.from('setlist_items').insert(rows);
            if(e1) throw e1;
            redone++;
            if(redone % 10 === 0) impLog(`콘티 ${redone}개 곡 목록 복구…`);
          }
        }
        // 이미 있는 콘티 — 인도자만 최신 정보로 고친다
        if(lid && old.leaderId !== lid){
          const { error } = await sb.from('setlists').update({ leader_id: lid }).eq('id', old.id);
          if(!error){ fixed++; old.leaderId = lid;
            if(fixed % 10 === 0) impLog(`인도자 ${fixed}건 수정…`); }
        } else if(!c.replace) dup++;
        st.done++; impTick(); continue;
      }
      const { data, error } = await sb.from('setlists').insert({
        service_date: c.date, service_id: sid, leader_id: lid,
        created_by: ME ? ME.id : null,
        memo: c.src ? `원본 ${c.src}` : null,
      }).select('id').single();
      if(error) throw error;
      const items = c.items.map((it, i) => ({
        setlist_id: data.id, song_id: NORM_INDEX[norm(it.title)],
        position: i + 1, sung_key: it.key || null,
      })).filter(x => x.song_id);
      if(items.length){
        const { error: e2 } = await sb.from('setlist_items').insert(items);
        if(e2) throw e2;
      }
      have[c.date + '|' + sid] = { id: data.id, date: c.date, serviceId: sid, leaderId: lid };
      made++;
      if(made % 10 === 0) impLog(`콘티 ${made}개 등록…`);
      st.done++; impTick();
    }
    impLog(`콘티 ${made}개 등록 · 곡 목록 복구 ${redone}개 · 인도자 ${fixed}건 수정 · ${dup}개는 그대로`);

    st.busy = false;
    await loadAll();
    render();
    say(`가져오기를 마쳤습니다.\n악보 ${up}장 · 콘티 ${made}개 등록`
        + (redone ? ` · 곡 목록 복구 ${redone}개` : '')
        + (fixed ? ` · 인도자 ${fixed}건 수정` : '') + '.');
  } catch(e){
    st.busy = false;
    impLog('■ 멈춤 — ' + friendlyError(e));
    await loadAll();
    render();
    say('가져오기를 마치지 못했습니다.\n' + friendlyError(e)
        + '\n\n다시 실행하면 이미 등록된 부분은 건너뛰고 이어서 진행합니다.');
  }
}

let reqQuery = '';

/** 「소원 (F)」처럼 쓴 신청곡을 제목과 조성으로 나눈다. */
function parseRequestSongInput(raw){
  const text = String(raw || '').trim();
  const m = text.match(/[（(]\s*([A-Ga-g](?:#|b|♭)?)\s*[)）]\s*$/);
  if(!m) return {title:text, key:''};
  let key = m[1].replace('♭','b');
  key = key.charAt(0).toUpperCase() + key.slice(1);
  const sharp = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
  key = sharp[key] || key;
  return {title:text.slice(0, m.index).trim(), key:KEYS.includes(key) ? key : ''};
}

function recommendationSongMatch(item){
  const wanted = norm(item.title);
  const candidates = DATA.songs.filter(song =>
    [song.title, ...(song.aliases || [])].some(value => norm(value) === wanted));
  if(!candidates.length) return null;
  if(item.key){
    const sameKey = candidates.find(song => String(song.key || '').toLowerCase() === item.key.toLowerCase());
    if(sameKey) return sameKey;
  }
  return candidates[0];
}
function curatedRecommendationIds(){
  return new Set(PASTOR_CHURCH_RECOMMENDATIONS.map(recommendationSongMatch).filter(Boolean).map(song => song.id));
}
function requestedSongs(){
  const curated = PASTOR_CHURCH_RECOMMENDATIONS.map((item, index) => {
    const song = recommendationSongMatch(item);
    if(song && (song.manualTags || []).includes(REQ_EXCLUDE_TAG)) return null;
    return song
      ? {...song, title:item.title, key:item.key || song.key || '', recommendationOrder:index, recommendationVirtual:false}
      : {id:`recommendation:${index}`, title:item.title, key:item.key || '', aliases:[], manualTags:[], sheets:[],
          recommendationOrder:index, recommendationVirtual:true};
  }).filter(Boolean);
  const curatedIds = curatedRecommendationIds();
  const added = DATA.songs.filter(song => !curatedIds.has(song.id)
    && (song.manualTags || []).includes(REQ_TAG)
    && !(song.manualTags || []).includes(REQ_EXCLUDE_TAG));
  return [...curated, ...added];
}
function isRequested(id){
  const song = S[id];
  if(!song || (song.manualTags || []).includes(REQ_EXCLUDE_TAG)) return false;
  return curatedRecommendationIds().has(id) || (song.manualTags || []).includes(REQ_TAG);
}

async function toggleRequest(id, ev){
  if(ev) ev.stopPropagation();
  const s = S[id];
  if(!s) return false;
  if(!isAdmin()){ say('담임목사만 추천찬양을 정할 수 있습니다.'); return false; }
  const tags = (s.manualTags || []).filter(t => t !== REQ_TAG && t !== REQ_EXCLUDE_TAG);
  const on = !isRequested(id);
  const curated = curatedRecommendationIds().has(id);
  if(on && !curated) tags.push(REQ_TAG);
  if(!on && curated) tags.push(REQ_EXCLUDE_TAG);
  const { error } = await sb.from('songs').update({ manual_tags: tags }).eq('id', id);
  if(error){ say('저장하지 못했습니다.\n' + friendlyError(error)); return false; }
  reqQuery = '';
  await loadAll(); render();
  say(on ? `「${esc(s.title)}」을 목사님 우리교회 추천 찬양에 넣었습니다.`
         : `「${esc(s.title)}」을 목사님 우리교회 추천 찬양에서 뺐습니다.`);
  return true;
}

function reqButton(id){
  if(!isAdmin()) return '';
  const on = isRequested(id);
  return `<button class="btn sm ${on ? 'gold' : ''}" onclick="toggleRequest('${id}', event)"
    title="${on ? '추천찬양에서 빼기' : '목사님 우리교회 추천 찬양으로 지정'}">${on ? '추천곡 ✓' : '＋ 추천곡'}</button>`;
}

function reqHitsHtml(hits){

  const candidates = hits.length ? `<div class="sub" style="margin-bottom:6px">같은 곡인지 먼저 확인해 주세요.</div>
    <div class="stack" style="gap:6px">${hits.map(s => `
    <div style="background:var(--surface-2);padding:7px 11px;border-radius:8px">
      <div class="row">
        <span class="rw-title">${peekTitle(s.id, 'reqq')}</span>

        <button class="btn sm pri" onclick="toggleRequest('${s.id}', event)">추천찬양에 넣기</button>

    </div>`).join('')}</div>` : `<div class="sub nomatch">등록된 곡에서 찾지 못했습니다.</div>`;

      <span class="sub">${hits.length?'다른 곡이라면':'새 곡으로'}</span>
      <button class="btn sm ${hits.length?'':'pri'}" ${parsed.title?'':'disabled'}
        onclick="createRequestedSong()">「${esc(parsed.title || reqQuery)}」${esc(keyText)} 추천찬양으로 등록</button>

/** 없는 곡을 만든 뒤 곧바로 담임목사 신청곡으로 지정한다. 실패하면 입력값을 보존한다. */
async function createRequestedSong(){
  if(reqBusy) return;
  if(!isAdmin()){ say('담임목사만 추천찬양을 정할 수 있습니다.'); return; }
  const parsed = parseRequestSongInput(reqQuery);
  if(!parsed.title){ say('곡 제목을 입력해 주세요.'); return; }
  const exact = matchTitle(parsed.title);
  if(exact && exact.songId){
    if(isRequested(exact.songId)){ say('이미 추천찬양에 들어 있습니다.'); return; }
    await toggleRequest(exact.songId);
    return;
  }
  reqBusy = true;
  reqError = '';
  renderReqHits();
  const input = document.getElementById('reqQ');
  if(input) input.disabled = true;
  try {
    const id = await createSong(parsed.title, {key:parsed.key});
    if(!id) throw new Error('곡을 만들지 못했습니다. 입력한 내용은 그대로 두었습니다.');
    reqBusy = false;
    const saved = await toggleRequest(id);
    if(!saved) throw new Error('곡은 만들었지만 추천찬양으로 지정하지 못했습니다. 다시 눌러 주세요.');
  } catch(e){
    reqBusy = false;
    reqError = friendlyError(e);
    const current = document.getElementById('reqQ');
    if(current) current.disabled = false;
    renderReqHits();
  }
}

/* ══════════════════════════════════════════════════════════════════
   새찬양 — 담임목사가 직접 지정하고 네 번 부를 때까지 홈에 둔다.
   인도자와 횟수는 별도 입력하지 않고 실제 콘티 이력에서만 계산한다.
   네 번을 채운 뒤에도 지정 태그는 남겨 과거의 책임 기록을 보존한다.
   ══════════════════════════════════════════════════════════════════ */

const NEW_SONG_TAG = '새찬양';
const NEW_SONG_GOAL = 4;
const NEW_SONG_HOME_LIMIT = 10;
/* 담임목사가 최초 책임 인도자를 직접 확정한 예외만 기록한다. */
const NEW_SONG_LEADER_OVERRIDES = new Map([
  [norm('예수 우리들의 밝은 빛'), '박은우'],
  [norm('거룩 영원히'), '박은우'],
  [norm('끝 없는 사랑'), '김성락'],
]);
/* 담임목사가 기존 운영 횟수를 직접 확정한 경우. 기준일 이후 콘티부터 추가로 센다. */
const NEW_SONG_BASELINES = new Map([
  [norm('거룩 영원히'), { count:3, asOf:'2026-06-19' }],
  [norm('끝 없는 사랑'), { count:3, asOf:'2026-08-25' }],
]);
let newSongQuery = '';

function isNewSong(id){
  const song = S[id];
  return !!(song && (song.manualTags || []).includes(NEW_SONG_TAG));
}

function newSongProgress(id, serviceIds = null){
  const song = S[id];
  const seen = new Set();
  const history = statisticalAppearances([...(appear[id] || [])]
    .filter(row => !serviceIds || serviceIds.includes(row.serviceId))
    .sort((a, b) => a.date.localeCompare(b.date)
      || Number(SV[a.serviceId]?.order || 999) - Number(SV[b.serviceId]?.order || 999)
      || String(a.setlistId).localeCompare(String(b.setlistId))))
    .filter(row => {
      if(seen.has(row.setlistId)) return false;
      seen.add(row.setlistId);
      return true;
    });
  const first = history[0] || null;
  const baseline = NEW_SONG_BASELINES.get(norm(song?.title || '')) || null;
  const historyAfterBaseline = baseline ? history.filter(row => row.date > baseline.asOf) : history;
  const count = baseline ? baseline.count + historyAfterBaseline.length : history.length;
  const completionIndex = baseline ? NEW_SONG_GOAL - baseline.count - 1 : NEW_SONG_GOAL - 1;
  const completedAt = count >= NEW_SONG_GOAL
    ? (baseline && baseline.count >= NEW_SONG_GOAL
      ? baseline.asOf
      : (historyAfterBaseline[completionIndex]?.date || null))
    : null;
  return {
    count,
    goal: NEW_SONG_GOAL,
    complete: count >= NEW_SONG_GOAL,
    completedAt,
    first,
    firstLeader: NEW_SONG_LEADER_OVERRIDES.get(norm(song?.title || ''))
      || (first && L[first.leaderId] ? L[first.leaderId].name : null),
  };
}

function recentlyLearnedNewSongs(serviceIds = null){
  return DATA.songs
    .filter(song => isNewSong(song.id) && !obviousPlaceholderTitle(song.title))
    .map(song => ({ song, progress:newSongProgress(song.id, serviceIds) }))
    .filter(row => row.progress.complete && row.progress.completedAt)
    .sort((a, b) => String(b.progress.completedAt).localeCompare(String(a.progress.completedAt))
      || b.progress.count - a.progress.count
      || a.song.title.localeCompare(b.song.title, 'ko'));
}

function activeNewSongs(serviceIds = null){
  return DATA.songs
    .filter(song => isNewSong(song.id) && !obviousPlaceholderTitle(song.title))
    .map(song => ({ song, progress: newSongProgress(song.id, serviceIds) }))
    .filter(row => !row.progress.complete)
    .sort((a, b) => b.progress.count - a.progress.count
      || String(b.progress.first?.date || '').localeCompare(String(a.progress.first?.date || ''))
      || a.song.title.localeCompare(b.song.title, 'ko'));
}

async function toggleNewSong(id, ev){
  if(ev) ev.stopPropagation();
  const song = S[id];
  if(!song) return;
  if(!isAdmin()){ say('담임목사만 새찬양을 지정할 수 있습니다.'); return; }
  if(obviousPlaceholderTitle(song.title)){
    say('한 글자 임시 입력은 새찬양으로 지정할 수 없습니다.');
    return;
  }
  const on = !isNewSong(id);
  const tags = (song.manualTags || []).filter(tag => tag !== NEW_SONG_TAG);
  if(on) tags.push(NEW_SONG_TAG);
  const { error } = await sb.from('songs').update({ manual_tags: tags }).eq('id', id);
  if(error){ say('새찬양 표시를 저장하지 못했습니다.\n' + friendlyError(error)); return; }
  newSongQuery = '';
  await loadAll();
  render();
  const progress = newSongProgress(id);
  if(!on) say(`「${song.title}」의 새찬양 지정을 해제했습니다.`);
  else if(progress.complete) say(`「${song.title}」은 이미 ${progress.count}회 불러 홈 새찬양 목록에는 나오지 않습니다.`);
  else say(`「${song.title}」을 새찬양으로 지정했습니다.\n현재 ${progress.count} / ${NEW_SONG_GOAL}회입니다.`);
}

function newSongButton(id){
  if(!isAdmin()) return '';
  const on = isNewSong(id);
  const progress = newSongProgress(id);
  const label = on
    ? (progress.complete ? '새찬양 완료 ✓' : `새찬양 ${progress.count}/${NEW_SONG_GOAL}회 ✓`)
    : '새찬양으로 지정';
  return `<button class="btn sm ${on ? 'gold' : ''}" onclick="toggleNewSong('${id}', event)"
    title="${on ? '새찬양 지정 해제' : '담임목사가 새찬양으로 지정'}">${label}</button>`;
}

function newSongFirstText(progress){
  if(!progress.first) return '처음 시작 · 아직 콘티에 없음';
  return `처음 시작 ${esc(progress.firstLeader || '확인 필요')} · ${fmtShort(progress.first.date)}`;
}

          <td style="width:30px" class="num sub no-stk">${index + 1}</td>
          <td class="hd"><span class="mob-only">${index + 1}. </span>
            ${peekTitle(song.id, 'new', song.key ? ' ' + keyBadge(song.key) : '')}</td>
          <td data-l="진행" style="white-space:nowrap"><b>${progress.count} / ${progress.goal}회</b></td>
          <td class="sub" data-l="처음 시작">${newSongFirstText(progress)}</td>
          <td class="act" style="white-space:nowrap">
            <button class="btn sm" onclick="go('song/${song.id}')">곡 화면</button>

      </tbody></table></div>` : `<div class="empty" style="padding:22px">지금 진행 중인 새찬양이 없습니다</div>`}
      ${admin ? `<div style="padding:14px 18px;border-top:1px solid var(--line)">

function newSongHitsHtml(hits){
  if(!newSongQuery.trim()) return '';
  if(!hits.length) return `<div class="sub">찾는 곡이 없습니다</div>`;
  return `<div class="stack" style="gap:6px">${hits.map(song => {

  }).join('')}</div>`;

function renderNewSongHits(){

/* ══════════════════════════════════════════════════════════════════
   순위에서 빼기 — 봉헌·축도처럼 매주 같은 자리에 들어가는 곡
   「예배자입니다」처럼 순서상 늘 부르는 곡이 순위를 덮어쓰지 않게 합니다.
   부른 횟수 자체는 그대로 남고, 「가장 많이 부른 찬양」에서만 빠집니다.
   ══════════════════════════════════════════════════════════════════ */

const SKIP_TAG = '순위 제외';
let skipQuery = '';

function rankSkipSongs(){
  return DATA.songs.filter(s => (s.manualTags || []).includes(SKIP_TAG))
    .sort((a, b) => countSong(b.id) - countSong(a.id));
}
function isRankSkip(id){ const s = S[id]; return !!(s && (s.manualTags||[]).includes(SKIP_TAG)); }

async function toggleRankSkip(id, ev){
  if(ev) ev.stopPropagation();
  const s = S[id];
  if(!s) return;
  if(!isAdmin()){ say('담임목사만 순위에서 뺄 수 있습니다.'); return; }
  const tags = (s.manualTags || []).filter(t => t !== SKIP_TAG);
  const on = !isRankSkip(id);
  if(on) tags.push(SKIP_TAG);
  const { error } = await sb.from('songs').update({ manual_tags: tags }).eq('id', id);
  if(error){ say('저장하지 못했습니다.\n' + friendlyError(error)); return; }
  skipQuery = '';
  await loadAll(); render();
  say(on ? `「${esc(s.title)}」을 순위에서 뺐습니다.\n부른 횟수 ${countSong(id)}회는 그대로 남습니다.`
         : `「${esc(s.title)}」을 다시 순위에 넣었습니다.`);
}

function skipButton(id){
  if(!isAdmin()) return '';
  const on = isRankSkip(id);
  return `<button class="btn sm ${on ? 'gold' : ''}" onclick="toggleRankSkip('${id}', event)"
    title="${on ? '다시 순위에 넣기' : '봉헌·축도처럼 늘 부르는 곡이면 순위에서 뺍니다'}"
    >${on ? '순위 제외 ✓' : '순위에서 빼기'}</button>`;
}

/* ── 다시 꺼내볼 찬양에서 빼기 (담임목사 전용) ─────
   홈의 「다시 꺼내볼 만한 찬양」은 오래 안 부른 곡을 알려 주는 자리입니다.
   다시 부를 생각이 없는 곡이 매번 올라오면 도움이 안 되므로 빼 둡니다.
   부른 횟수·콘티 기록은 그대로 남고, 그 추천 목록에서만 빠집니다. */

const FORGET_TAG = '추천 제외';

function isForgetSkip(id){
  const s = S[id];
  return !!(s && (s.manualTags || []).includes(FORGET_TAG));
}

function forgetSkipSongs(){
  return DATA.songs.filter(s => (s.manualTags || []).includes(FORGET_TAG))
    .sort((a, b) => a.title.localeCompare(b.title, 'ko'));
}

async function toggleForgetSkip(id, ev){
  if(ev) ev.stopPropagation();
  const s = S[id];
  if(!s) return;
  if(!isAdmin()){ say('담임목사만 추천 목록에서 뺄 수 있습니다.'); return; }
  const tags = (s.manualTags || []).filter(t => t !== FORGET_TAG);
  const on = !isForgetSkip(id);
  if(on) tags.push(FORGET_TAG);
  const { error } = await sb.from('songs').update({ manual_tags: tags }).eq('id', id);
  if(error){ say('저장하지 못했습니다.\n' + friendlyError(error)); return; }

  say(on ? `「${s.title}」을 다시 꺼내볼 찬양에서 뺐습니다.\n부른 기록은 그대로 남습니다.`
         : `「${s.title}」을 다시 추천 목록에 넣었습니다.`);
}

function forgetButton(id){
  if(!isAdmin()) return '';
  const on = isForgetSkip(id);
  return `<button class="btn sm ${on ? 'gold' : ''}" onclick="toggleForgetSkip('${id}', event)"
    title="${on ? '다시 추천 목록에 넣기' : '이 곡은 다시 꺼내볼 찬양으로 추천하지 않습니다'}"
    >${on ? '추천 제외 ✓' : '추천에서 빼기'}</button>`;

/** 순위 카드 아래에 붙는 한 줄 안내 */
function skipNote(){

}

/** 늘 마지막 자리에 놓이는 곡 = 봉헌·축도 찬양일 가능성이 높다 */
function skipCandidates(){
  const out = [];
  DATA.songs.forEach(s => {
    if(isRankSkip(s.id)) return;
    const a = statisticalAppearances(appear[s.id] || []);
    if(a.length < 8) return;
    const tail = a.filter(x => !x.next).length / a.length;
    if(tail >= 0.6) out.push({ s, n: a.length, tail: Math.round(tail * 100) });
  });
  return out.sort((a, b) => b.n - a.n).slice(0, 6);
}

/* ══════════════════════════════════════════════════════════════════
   잘못 등록된 곡 정리
   사진에서 글자를 읽어 곡을 만들 때, 곡 제목이 아닌 것이
   제목으로 들어간 경우가 있습니다. 그것을 찾아 한 번에 손봅니다.

   처리 방법은 네 가지입니다.
     합치기       — 「나의 하나님 피아노 악보」처럼 군더더기만 떼면 되는 것.
                    같은 곡이 이미 있으면 그리로 합칩니다.
     제목 수정     — 깨진 이름 속에 진짜 곡 이름이 들어 있는 것.
     악보만 살리기 — 이름은 못 살리지만 악보 사진은 쓸 만한 것.
                    그 콘티에서 악보가 없던 곡에게 사진을 넘기고 제목만 지웁니다.
     지우기       — 건질 것이 없는 것
   ══════════════════════════════════════════════════════════════════ */

/** 곡 제목으로 볼 수 없는 이유를 돌려준다. 정상이면 빈 글자. */
function junkReason(t){
  const s = String(t || '').trim();
  if(!s) return '빈 제목';
  const han = (s.match(/[가-힣]/g) || []).length;
  const lat = (s.match(/[A-Za-z]/g) || []).length;
  const dig = (s.match(/[0-9]/g) || []).length;
  const len = s.length;
  const tok = s.split(/\s+/).filter(Boolean);

  if(/worship|RE\s*;?\s*AL/i.test(s))                      return '주보 머리글';
  if(/경배와\s*찬양|찬양팀|찬양단|찬양콘티|콘티/.test(s))     return '주보 머리글';
  if(/악보|주보|싱어|베이스|드럼|건반|코드표/.test(s))        return '악보 안내 글';
  if(/(19|20)\d{2}/.test(s))                                return '날짜가 섞임';
  if(/찬송가\s*\d+\s*장/.test(s))                            return '찬송가 번호';
  if(/^\s*\d/.test(s))                                      return '번호로 시작';
  if(/^(입례|봉헌|헌금|설교후|특송|축도)\s*찬양/.test(s))      return '순서 이름';
  if(/지난주와|최종\s*버전|^최종$|^마지막$|^동일$/.test(s))    return '메모';
  if(dig >= 1 && len >= 8)                                  return '숫자가 섞임';
  if(dig >= 2)                                              return '숫자가 섞임';
  if(len >= 22)                                             return '너무 긺';
  if(lat >= 3)                                              return '영문이 섞임';
  if(han && lat && len >= 12)                               return '글자가 깨짐';
  if(len >= 12 && han / len < 0.6)                          return '글자가 깨짐';
  if(han < 2 && lat < 3)                                    return '너무 짧음';
  if(tok.length >= 2 && tok.every(w => w.length === 1))     return '글자가 흩어짐';
  return '';
}

/** 군더더기를 떼어 제대로 된 제목을 만들 수 있으면 돌려준다 */
function cleanTitle(t){
  let s = String(t || '').trim();
  s = s.replace(/\s*[\-–—,·]?\s*(?:(?:피아노|베이스\s*기타|베이스|일렉|어쿠스틱|기타|드럼|건반|싱어|코드)\s*(?:용)?\s*[,·、]?\s*)+악보\s*$/, '');
  s = s.replace(/\s*[\-–—]?\s*(?:인도자용|싱어용|연습용)?\s*악보\s*$/, '');
  s = s.replace(/^(?:입례|봉헌|헌금|설교후|특송|축도)\s*찬양[\s.:·]*/, '');
  s = s.replace(/\s{2,}/g, ' ').trim();
  if(!s || s === String(t).trim()) return '';
  return junkReason(s) ? '' : s;
}

let junkState = null;
let junkTimer = null;
// { list, busy, log, done, total, emptyToo, confirm }
// list 의 각 줄: { id, title, reason, n, sheets, fix, act }

/* ── 깨진 제목 속에 묻힌 진짜 곡 찾아내기 ─────────
   「1 예수의 이름으로 6 2 십자가의 보혈 6 0」 같은 제목은
   글자만 걷어내면 진짜 곡 제목 두 개가 그대로 들어 있습니다.
   그 곡들에게 악보 사진을 붙여 주면 사진을 살릴 수 있습니다. */
function jnorm(t){ return String(t || '').toLowerCase().replace(/[^가-힣a-z0-9]/g, ''); }
let junkIdx = null;
function junkIndex(){
  junkIdx = [];
  DATA.songs.forEach(s => {
    if(junkReason(s.title)) return;
    const k = jnorm(s.title);
    if(k.length >= 5) junkIdx.push([k, s.id]);
  });
  junkIdx.sort((a, b) => b[0].length - a[0].length);
  return junkIdx;
}
function junkFinds(title){
  const s = jnorm(title), out = [];
  (junkIdx || junkIndex()).forEach(([k, id]) => {
    const i = s.indexOf(k);
    if(i < 0) return;
    if(out.some(o => i >= o.at && i < o.at + o.len)) return;
    out.push({ at: i, len: k.length, id });
  });
  return out.sort((a, b) => a.at - b.at).map(o => o.id);
}

/** 이 곡이 들어 있는 콘티에서, 악보가 없는 다른 곡들 */
function junkSiblings(songId){
  const out = [];
  DATA.setlists.forEach(st => {
    if(!st.items.some(i => i.songId === songId)) return;
    st.items.forEach(i => {
      const s = S[i.songId];
      if(s && s.id !== songId && !(s.sheets || []).length && !junkReason(s.title)) out.push(s.id);
    });
  });
  return [...new Set(out)];
}

const JUNK_ORDER = { fix: 0, give: 1, hand: 2, del: 3, keep: 4 };
function junkPick(x){
  if(x.fix) return 'fix';
  if(x.sheets.length && x.give.length) return 'give';
  if(x.sheets.length && x.sib) return 'hand';
  return 'del';
}

function scanJunk(){
  junkIndex();
  const list = [];
  DATA.songs.forEach(s => {
    const r = junkReason(s.title);
    if(!r) return;
    const sheets = (s.sheets || []).slice();
    const row = { id: s.id, title: s.title, reason: r, n: countSong(s.id), sheets,
                  fix: cleanTitle(s.title),
                  give: sheets.length ? junkFinds(s.title) : [],
                  sib: sheets.length ? junkSiblings(s.id).length : 0 };
    row.act = junkPick(row);
    list.push(row);
  });
  list.sort((a, b) => JUNK_ORDER[a.act] - JUNK_ORDER[b.act]
                    || b.sheets.length - a.sheets.length
                    || a.title.localeCompare(b.title, 'ko'));
  junkState = { list, busy: false, log: [], done: 0, total: 0, emptyToo: true, confirm: false };
  render();
  const c = junkTally();
  say(list.length
    ? `곡 제목으로 보기 어려운 ${list.length}개를 찾았습니다.\n`
      + `합치기 ${c.fix} · 제목 수정 ${c.give} · 악보만 살리기 ${c.hand} · 지우기 ${c.del}\n`
      + `제목을 누르면 악보를 보고 이름도 바로 고칠 수 있습니다.`
    : '제목이 이상한 곡을 찾지 못했습니다. 깨끗합니다.');
}

function junkTally(){
  const c = { fix: 0, give: 0, hand: 0, del: 0, keep: 0 };
  if(junkState) junkState.list.forEach(x => c[x.act]++);
  return c;
}
function junkSet(id, act){
  if(!junkState) return;
  const row = junkState.list.find(x => x.id === id);
  if(row) row.act = act;
  junkCount();
}
function junkAll(act){
  if(!junkState) return;
  junkState.list.forEach(x => { x.act = act === 'auto' ? junkPick(x) : act; });
  document.querySelectorAll('select[data-junk]').forEach(el => {
    const row = junkState.list.find(x => x.id === el.getAttribute('data-junk'));
    if(row) el.value = row.act;
  });
  junkCount();
}
function junkCount(){
  const c = junkTally();
  const el = document.getElementById('junkCount');
  if(el) el.innerHTML = `합치기 <b>${c.fix}</b> · 제목 수정 <b>${c.give}</b>
    · 악보만 살리기 <b>${c.hand}</b> · 지우기 <b>${c.del}</b> · 그대로 <b>${c.keep}</b>`;
  const b = document.getElementById('junkGo');
  if(b){
    if(junkState) junkState.confirm = false;
    clearTimeout(junkTimer);
    b.disabled = !(c.fix + c.give + c.hand + c.del);
    b.className = 'btn pri';
    b.textContent = '선택한 대로 정리하기';
  }
}

/** 제목을 누르면 그 곡에 붙은 악보를 펼쳐 보여준다 */
function junkPeek(id){
  if(!junkState) return;
  const row = junkState.list.find(x => x.id === id);
  // 악보와 함께 「이름 고치기」·「곡별로 자르기」도 함께 펼쳐 준다
  peekToggle('jp_' + id, row ? row.sheets : [], '이 곡에는 악보가 없습니다',
    peekEditHtml(id, 'junk') + junkCutHtml(row));
}

/** 콘티가 통째로 한 장에 들어 있는 악보를 곡별로 자르는 단추 */
function junkCutHtml(row){
  if(!row || !isAdmin() || !row.sheets.length) return '';
  const titles = (row.give || []).map(id => S[id] && S[id].title).filter(Boolean);
  const n = Math.max(2, titles.length);
  return `<div class="info" style="margin:0 0 9px">
    이 악보는 구형 방식으로 바로 자르지 않습니다. 원본을 다시 선택한 뒤
    <b>원본 전체·모든 조각·기존 곡·키를 확인</b>해야만 안전 저장할 수 있습니다.
    <div class="row" style="margin-top:9px">
      ${row.sheets.map((sh, i) => `<button class="btn sm pri"
        onclick="safeReviewOpenSettings()"
        >${row.sheets.length > 1 ? (i + 1) + '번째 ' : ''}안전 검수 열기</button>`).join('')}
    </div>
  </div>`;
}

/** 이름을 고쳐서 더 손볼 것이 없어진 줄을 목록에서 치운다 */
function junkForget(id, newTitle){
  if(!junkState || !junkState.list) return;
  const i = junkState.list.findIndex(x => x.id === id);
  if(i < 0) return;
  if(newTitle == null || !junkReason(newTitle)) junkState.list.splice(i, 1);
  else { junkState.list[i].title = newTitle; junkState.list[i].reason = junkReason(newTitle); }
}

function junkLog(msg){
  if(!junkState) return;
  junkState.log.push(msg);
  const el = document.getElementById('junkLog');
  if(el){ el.innerHTML = junkState.log.slice(-140).map(l => `<div>${esc(l)}</div>`).join('');
          el.scrollTop = el.scrollHeight; }
}
function junkBar(){
  const el = document.querySelector('#junkBar i');
  if(el && junkState && junkState.total)
    el.style.width = Math.round(junkState.done / junkState.total * 100) + '%';
}

const junkChunk = (a, n) => { const o = []; for(let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };

/* ── 한 줄만 지금 처리하기 ─────────────────────────
   목록이 스무 개가 넘으면 전부 확인하기 전에는 아무것도 못 하는 셈이 됩니다.
   확인한 줄부터 하나씩 끝낼 수 있게, 그 줄만 떼어 내 같은 처리를 돌립니다.
   (처리 방법은 「선택한 대로 정리하기」와 똑같습니다 — doJunkRun 을 그대로 씁니다) */
async function junkRunOne(id, ev){
  if(ev) ev.stopPropagation();
  const st = junkState;
  if(!st || st.busy) return;
  const row = st.list.find(x => x.id === id);
  if(!row){ say('이미 처리된 줄입니다.'); return; }
  if(row.act === 'keep'){ say('「그대로 두기」로 되어 있습니다.\n먼저 어떻게 할지 골라 주세요.'); return; }

  const 나머지 = st.list.filter(x => x.id !== id);
  const 남길것 = { emptyToo: st.emptyToo, log: st.log };
  st.list = [row];
  st.confirm = true;                 // 한 줄짜리는 한 번 더 묻지 않는다
  await doJunkRun();
  // 다 되면 doJunkRun 이 junkState 를 비운다. 나머지 줄을 다시 세워 준다.
  if(!junkState){
    junkState = { list: 나머지, busy: false, log: 남길것.log, done: 0, total: 0,
                  emptyToo: 남길것.emptyToo, confirm: false };
  } else {
    const 아직 = junkState.list.some(x => x.id === id);
    junkState.list = 아직 ? [row, ...나머지] : 나머지;
    junkState.confirm = false;
  }
  render();
}

async function doJunkRun(){
  const st = junkState;
  if(!st || st.busy) return;
  if(!isAdmin()){ say('곡 정리는 담임목사만 할 수 있습니다.'); return; }
  const c = junkTally();
  if(!(c.fix + c.give + c.hand + c.del)) return;

  if(!st.confirm){
    st.confirm = true; render();
    say(`합치기 ${c.fix}개 · 제목 수정 ${c.give}개 · 악보만 살리기 ${c.hand}개 · 지우기 ${c.del}개를 진행합니다.\n`
      + (st.emptyToo ? '곡이 하나도 남지 않는 콘티는 휴지통으로 옮깁니다.\n' : '')
      + '되돌릴 수 없습니다. 맞으면 한 번 더 눌러 주세요.');
    clearTimeout(junkTimer);
    junkTimer = setTimeout(() => { if(junkState){ junkState.confirm = false; render(); } }, 15000);
    return;
  }
  clearTimeout(junkTimer);
  st.confirm = false;
  st.busy = true; st.log = []; st.done = 0;
  st.total = c.fix + c.give + c.hand + c.del;
  render();

  let nFix = 0, nMerge = 0, nHand = 0, nGive = 0, nBack = 0, nDel = 0, nFile = 0, nEmpty = 0;
  const orphan = [];        // 아무도 안 쓰게 된 악보 파일

  try {
    /* 1) 합치기 — 군더더기를 떼고, 같은 곡이 이미 있으면 그리로 합친다 */
    for(const row of st.list.filter(x => x.act === 'fix')){
      const keep = NORM_INDEX[norm(row.fix)];
      if(keep && keep !== row.id){
        let r = await sb.from('setlist_items').update({ song_id: keep }).eq('song_id', row.id);
        if(r.error) throw r.error;
        r = await sb.from('sheets').update({ song_id: keep }).eq('song_id', row.id);
        if(r.error) throw r.error;
        r = await sb.from('songs').delete().eq('id', row.id);
        if(r.error) throw r.error;
        nMerge++;
        junkLog(`합침 — ${row.title} → ${row.fix}`);
      } else {
        const r = await sb.from('songs').update({ title: row.fix }).eq('id', row.id);
        if(r.error) throw r.error;
        nFix++;
        junkLog(`제목 고침 — ${row.title} → ${row.fix}`);
      }
      st.done++; junkBar();
    }

    if(nFix + nMerge) await loadAll();

    /* 2) 제목 수정 — 깨진 제목 속에서 찾아낸 진짜 곡에게 사진을 붙인다 */
    const gaveIds = [];
    for(const row of st.list.filter(x => x.act === 'give')){
      const found = junkFinds(row.title).filter(id => S[id]);
      const sh = row.sheets[0];
      const rows = found
        .filter(id => !(S[id].sheets || []).some(x => x.path === sh.path))
        .map(id => ({
          song_id: id, sheet_key: sh.key || null, is_origin: !(S[id].sheets || []).length,
          storage_path: sh.path, file_type: sh.fileType || 'image',
          note: '콘티 사진 — 여러 곡이 함께 있습니다', sort_order: 1,
        }));
      if(rows.length){
        const r = await sb.from('sheets').insert(rows);
        if(r.error) throw r.error;
        nBack += rows.length;
        junkLog(`제목 수정 — ${found.map(id => S[id].title).join(' · ')}`);
        row.sheets.slice(1).forEach(x => orphan.push(x.path));
      } else {
        row.sheets.forEach(x => orphan.push(x.path));
      }
      gaveIds.push(row.id);
      st.done++; junkBar();
    }

    /* 3) 악보만 살리기 — 그 콘티에서 악보가 없던 곡에게 사진을 물려주고 제목은 지운다 */
    const filled = new Set();
    const handIds = [];
    for(const row of st.list.filter(x => x.act === 'hand')){
      const targets = junkSiblings(row.id).filter(id => !filled.has(id)).slice(0, 4);
      if(targets.length && row.sheets.length){
        const sh = row.sheets[0];
        const rows = targets.map((id, i) => ({
          song_id: id, sheet_key: sh.key || null, is_origin: true,
          storage_path: sh.path, file_type: sh.fileType || 'image',
          note: '콘티 사진 — 여러 곡이 함께 있습니다', sort_order: 1,
        }));
        const r = await sb.from('sheets').insert(rows);
        if(r.error) throw r.error;
        targets.forEach(id => filled.add(id));
        nGive += targets.length;
        nHand++;
        junkLog(`악보만 살림 — ${targets.length}곡에게 (${row.title.slice(0, 24)}…)`);
        // 남은 악보는 주인이 없으니 파일만 남기고 정리 대상에 넣지 않는다
        row.sheets.slice(1).forEach(x => orphan.push(x.path));
      } else {
        row.sheets.forEach(x => orphan.push(x.path));
      }
      handIds.push(row.id);
      st.done++; junkBar();
    }

    /* 4) 지우기 */
    const delIds = st.list.filter(x => x.act === 'del').map(x => x.id);
    st.list.filter(x => x.act === 'del').forEach(x => x.sheets.forEach(sh => orphan.push(sh.path)));
    const gone = gaveIds.concat(handIds, delIds);
    for(const part of junkChunk(gone, 40)){
      let r = await sb.from('setlist_items').delete().in('song_id', part);
      if(r.error) throw r.error;
      r = await sb.from('sheets').delete().in('song_id', part);
      if(r.error) throw r.error;
      r = await sb.from('songs').delete().in('id', part);
      if(r.error) throw r.error;
      nDel += part.length;
      junkLog(`${nDel} / ${gone.length} 곡 정리…`);
      st.done = Math.min(st.total, st.done);
    }
    st.done = st.total; junkBar();

    /* 5) 아무도 쓰지 않게 된 악보 파일만 저장소에서 지운다 */
    for(const part of junkChunk([...new Set(orphan)], 60)){
      const { data: still } = await sb.from('sheets').select('storage_path').in('storage_path', part);
      const used = new Set((still || []).map(x => x.storage_path));
      const kill = part.filter(p => !used.has(p));
      if(kill.length){
        await sb.storage.from('sheets').remove(kill);
        kill.forEach(p => delete sheetUrlCache[p]);
        nFile += kill.length;
      }
    }

    /* 6) 곡이 하나도 남지 않은 콘티는 휴지통으로 */
    await loadAll();
    if(st.emptyToo){
      const dead = DATA.setlists.filter(x => !x.items.length).map(x => x.id);
      for(const part of junkChunk(dead, 40)){
        const { error } = await sb.from('setlists')
          .update({ deleted_at: new Date().toISOString() }).in('id', part);
        if(!error) nEmpty += part.length;
      }
      if(nEmpty) junkLog(`빈 콘티 ${nEmpty}개를 휴지통으로`);
    }

    junkState = null;
    await loadAll(); render();
    say(`정리를 마쳤습니다.\n`
      + `제목 바로잡음 ${nFix} · 같은 곡에 합침 ${nMerge} · 진짜 곡 ${nBack}곳에 악보 붙임`
      + ` · 악보 없던 ${nGive}곡에 악보 넘김 · 가짜 제목 ${gone.length}개 지움`
      + (nFile ? `\n쓸모없어진 악보 파일 ${nFile}개 정리` : '')
      + (nEmpty ? `\n비어 버린 콘티 ${nEmpty}개는 휴지통에 있습니다` : '')
      + `\n\n순위와 통계가 다시 계산되었습니다.`);
  } catch(e){
    if(junkState) junkState.busy = false;
    junkLog('■ 멈춤 — ' + friendlyError(e));
    await loadAll(); render();
    say('정리를 마치지 못했습니다.\n' + friendlyError(e)
      + '\n\n다시 「찾아보기」를 누르면 남은 것부터 이어서 진행합니다.');
  }
}

/* ══════════════════════════════════════════════════════════════════
   앱을 인터넷 주소로 올리기 (담임목사 전용)
   검증된 배포 꾸러미 전체를 공개 보관함에 올려두면, 인도자들이 각자
   집 PC·휴대폰에서 그 주소로 들어와 쓸 수 있습니다.
   앱을 새로 고쳤을 때도 여기서 다시 올리면 모두가 최신본을 봅니다.
   ══════════════════════════════════════════════════════════════════ */

const APP_URL = SUPA_URL + '/storage/v1/object/public/app/index.html';
let pubState = { busy: false, msg: '', ok: false, at: '' };

async function checkAppPublished(){
  try {
    const r = await fetch(APP_URL + '?v=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) return { up: false };
    return { up: true, type: r.headers.get('content-type') || '',
             size: +(r.headers.get('content-length') || 0) };
  } catch(_){ return { up: false }; }
}

async function onPublishPick(ev){
  const picked = Array.from(ev.target.files || []);
  ev.target.value = '';
  if(!picked.length) return;
  if(!isAdmin()){ say('담임목사만 올릴 수 있습니다.'); return; }
  pubState = { busy: true, msg: '배포 꾸러미를 확인하는 중입니다…', ok: false, at: '' };
  render();
  try {
    const files = await verifyDeploymentFolder(picked);
    // 실행 화면(index.html)은 마지막에 올린다. 모든 모델·프로그램 파일이
    // 준비되기 전에는 인도자 화면이 새 버전으로 바뀌지 않게 하기 위해서다.
    const ordered = files.filter(item => item.path !== 'index.html')
      .concat(files.filter(item => item.path === 'index.html'));
    for(let i=0;i<ordered.length;i++){
      const item = ordered[i];
      pubState.msg = `올리는 중입니다… ${i+1}/${ordered.length}`;
      render();
      const { error } = await sb.storage.from('app').upload(item.path, item.file, {
        contentType: deploymentContentType(item.path), upsert: true,
      });
      if(error) throw error;
    }
    const chk = await checkAppPublished();
    pubState = { busy: false, ok: true,
                 at: new Date().toLocaleString('ko-KR'),
                 msg: `올렸습니다. (${ordered.length}개 파일 · ${chk.type || '확인 중'})` };
    render();
    say('앱을 인터넷에 올렸습니다.\n인도자들이 주소로 들어오면 이 최신본을 봅니다.');
  } catch(e){
    pubState = { busy: false, ok: false, at: '',
                 msg: '올리지 못했습니다 — ' + friendlyError(e) };
    render();
    say('올리지 못했습니다.\n' + friendlyError(e));
  }
}

function deploymentContentType(path){
  if(/\.html$/i.test(path)) return 'text/html; charset=utf-8';
  if(/\.m?js$/i.test(path)) return 'text/javascript; charset=utf-8';
  if(/\.json$/i.test(path)) return 'application/json; charset=utf-8';
  if(/\.wasm$/i.test(path)) return 'application/wasm';
  if(/\.onnx$/i.test(path)) return 'application/octet-stream';
  if(/\.traineddata(?:\.gz)?$/i.test(path)) return 'application/octet-stream';
  return 'application/octet-stream';
}
async function deploymentSha256(file){
  const digest = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
  return Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2,'0')).join('');
}
async function verifyDeploymentFolder(picked){
  const manifestFile = picked.find(file => /(?:^|\/)asset-manifest\.json$/i.test((file.webkitRelativePath || file.name).replaceAll('\\','/')));
  if(!manifestFile) throw new Error('「asset-manifest.json」이 든 배포 꾸러미 폴더를 골라 주세요.');
  const manifestPath = (manifestFile.webkitRelativePath || manifestFile.name).replaceAll('\\','/');
  const prefix = manifestPath.slice(0, manifestPath.length - 'asset-manifest.json'.length);
  const manifest = JSON.parse(await manifestFile.text());
  if(manifest.format !== 'conti-deployment-package-v1' || !Array.isArray(manifest.assets) || !manifest.assets.length) throw new Error('배포 꾸러미 확인표가 올바르지 않습니다.');
  const byPath = new Map(picked.map(file => {
    const full=(file.webkitRelativePath || file.name).replaceAll('\\','/');
    return [full.startsWith(prefix) ? full.slice(prefix.length) : full, file];
  }));
  const verified=[];
  for(const asset of manifest.assets){
    const path=String(asset.path||'');
    if(!path || path.startsWith('/') || path.includes('..') || path.includes('\\')) throw new Error('배포 경로가 안전하지 않습니다.');
    const file=byPath.get(path);
    if(!file) throw new Error(`배포 파일이 빠졌습니다: ${path}`);
    if(file.size!==asset.bytes || await deploymentSha256(file)!==asset.sha256) throw new Error(`배포 파일이 바뀌었습니다: ${path}`);
    verified.push({path,file});
  }
  if(!verified.some(item=>item.path==='index.html')) throw new Error('배포 화면 파일이 없습니다.');
  return verified;
}

function copyAppUrl(){
  const done = () => say('주소를 복사했습니다.\n인도자 단톡방에 붙여넣어 주세요.');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(APP_URL).then(done, () => fallback());
  } else fallback();
  function fallback(){
    const t = document.createElement('textarea');
    t.value = APP_URL; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); done(); } catch(_){ say('주소를 직접 복사해 주세요.'); }
    t.remove();
  }
}

          <input type="file" webkitdirectory multiple style="display:none"
            ${st.busy ? 'disabled' : ''} onchange="onPublishPick(event)"></label>
      </div>

      ${st.msg ? `<div class="hint" style="margin-top:12px;${st.ok ? '' : 'color:var(--danger)'}">
        ${esc(st.msg)}${st.at ? ` · ${esc(st.at)}` : ''}</div>` : ''}

      <hr class="sep">
      <div class="sub">
        <b>인도자들에게 이렇게 안내하세요.</b><br>
        ① 위 주소로 들어간다 → ② 「처음이신가요? 비밀번호 정하기」를 누른다 →
        ③ <b>명단에 등록된 전화번호</b>와 쓸 숫자 여섯 자리를 넣는다 → ④ 끝.<br>
        휴대폰이면 브라우저 공유 단추 → <b>홈 화면에 추가</b> 를 하면 앱처럼 아이콘이 생깁니다.
      </div>
    </div>
  </div>`;
}


/* ══════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════ */

let mergeInto = { songId: null, q: '', pick: null };

function openMergeInto(songId){

function mergeIntoHits(){
  const q = mergeInto.q.trim();
  if(!q) return [];
  return searchSongs(q).filter(s => s.id !== mergeInto.songId).slice(0, 8);
}
function renderMergeHits(){
  const el = document.getElementById('miHits');
  if(el) el.innerHTML = mergeIntoHitsHtml();
}
function pickMergeTarget(id){
  mergeInto.pick = mergeInto.pick === id ? null : id;
  render();
}

function mergeIntoHitsHtml(){
  const hits = mergeIntoHits();
  if(!mergeInto.q.trim()) return '';
  if(!hits.length) return `<div class="sub">찾는 곡이 없습니다</div>`;
  return `<div class="stack" style="gap:6px">${hits.map(s => `
    <div style="background:${mergeInto.pick === s.id ? 'var(--gold-bg)' : 'var(--surface-2)'};

        mergeInto.pick === s.id ? '#EBD4B0' : 'transparent'}">
      <div class="row">

        <span class="sub">${countSong(s.id)}회 · 악보 ${(s.sheets||[]).length}장</span>
        <button class="btn sm ${mergeInto.pick === s.id ? 'gold' : 'pri'}"
          onclick="pickMergeTarget('${s.id}')">${

      </div>${peekHtml('pk_mi_' + s.id)}
    </div>`).join('')}</div>`;
}

async function doMergeInto(){
  const from = S[mergeInto.songId], to = S[mergeInto.pick];
  if(!from || !to) return;
  if(!isAdmin()){ say('곡 합치기는 담임목사만 할 수 있습니다.'); return; }

        제목만 고칠 거라면 위 「곡 정보」의 <b>제목</b> 칸을 고치면 됩니다.
      </div>
