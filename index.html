<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="찬양콘티">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="https://vsxukdgfxcacjykopwuu.supabase.co/storage/v1/object/public/app/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="https://vsxukdgfxcacjykopwuu.supabase.co/storage/v1/object/public/app/assets/app-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://vsxukdgfxcacjykopwuu.supabase.co/storage/v1/object/public/app/assets/apple-touch-icon.png">
<title>맛있는교회 찬양 콘티</title>
<style>
/* ═══════════════════════════════════════════════════════════
   브랜드 (제안) — 디자인팀장 초안
   주색 남색 #2C3E63 : 신뢰·차분함
   강조색 황금 #C8873C : 찬양의 따뜻함  (작은 글씨는 #8F5E1E로 대비 확보)
   배경 #FBF9F6 : 따뜻한 흰색
   ═══════════════════════════════════════════════════════════ */
:root{
  --navy:#2C3E63; --navy-d:#1E2C49; --navy-l:#4A5F8A;
  --gold:#C8873C; --gold-t:#8F5E1E; --gold-bg:#FDF4E7;
  --bg:#FBF9F6; --surface:#FFFFFF; --surface-2:#F5F2ED;
  --ink:#1E2433; --ink-2:#5A6273; --ink-3:#8A91A0;
  --line:#E5E1DA; --line-2:#D5D0C7;
  --ok:#2F6B4F; --warn:#9C6520; --danger:#9B3B36;
  --r:10px; --sh:0 1px 2px rgba(30,36,51,.06), 0 4px 12px rgba(30,36,51,.05);
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,
    'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.6; letter-spacing:-.01em;
}
a{color:inherit; text-decoration:none}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}

/* ── 시안 안내 띠 ───────────────────────────────── */
.demo-bar{
  background:var(--navy-d); color:#E8EDF7; padding:7px 16px;
  font-size:12.5px; text-align:center; letter-spacing:0;
}
.demo-bar b{color:#F0C98A; font-weight:600}

/* ── 상단 ──────────────────────────────────────── */
header{
  background:var(--navy); color:#fff; position:sticky; top:0; z-index:50;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}
.hd-in{max-width:1180px; margin:0 auto; padding:0 16px;
  display:flex; align-items:center; gap:20px; min-height:56px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:9px; padding:8px 0; flex-shrink:0}
.brand .mk{font-size:17px; font-weight:700; letter-spacing:-.02em}
.brand .sb{font-size:11.5px; color:#A9B8D6; letter-spacing:.02em}
nav{display:flex; gap:2px; flex-wrap:wrap; flex:1}
nav a{
  padding:7px 12px; border-radius:7px; font-size:14px; color:#C6D2E8;
  font-weight:500; white-space:nowrap;
}
nav a:hover{background:rgba(255,255,255,.10); color:#fff}
nav a.on{background:#fff; color:var(--navy); font-weight:600}
.whoami{font-size:12.5px; color:#A9B8D6; white-space:nowrap}
.whoami b{color:#fff; font-weight:600}
.admin-preview-toggle{margin-left:8px;padding:5px 8px;border:1px solid rgba(255,255,255,.3);
  border-radius:7px;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.admin-preview-toggle:hover{background:rgba(255,255,255,.18)}
.preview-short{display:none}

/* ── 레이아웃 ──────────────────────────────────── */
main{max-width:1180px; margin:0 auto; padding:24px 16px 72px}
.page-h{margin-bottom:20px}
.page-h h1{font-size:23px; font-weight:700; letter-spacing:-.03em; line-height:1.3}
.page-h p{color:var(--ink-2); font-size:13.5px; margin-top:5px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.card-h{padding:14px 18px; border-bottom:1px solid var(--line); display:flex;
  align-items:center; gap:10px; flex-wrap:wrap}
.card-h h2{font-size:15.5px; font-weight:650; letter-spacing:-.02em}
.card-h .note{font-size:12.5px; color:var(--ink-3); font-weight:400}
.card-b{padding:18px}
.card-b.tight{padding:0}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.spacer{flex:1}

/* ── 버튼 ──────────────────────────────────────── */
.btn{padding:8px 15px; border-radius:8px; border:1px solid var(--line-2);
  background:var(--surface); font-size:14px; font-weight:550; transition:.12s; white-space:nowrap}
.btn:hover{background:var(--surface-2); border-color:var(--ink-3)}
.btn.pri{background:var(--navy); color:#fff; border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-d)}
.btn.sm{padding:5px 11px; font-size:13px; border-radius:7px}
.btn.gold{background:var(--gold); color:#fff; border-color:var(--gold)}
.btn.warn{background:#B03A1A; color:#fff; border-color:#B03A1A}
.btn.warn:hover{filter:brightness(.92)}
.btn.gold:hover{filter:brightness(.94)}

/* ── 폼 ────────────────────────────────────────── */
label.fl{display:block; font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
.inp,select.inp,textarea.inp{
  width:100%; padding:9px 12px; border:1px solid var(--line-2); border-radius:8px;
  background:var(--surface); outline:none; transition:.12s;
}
.inp:focus{border-color:var(--navy-l); box-shadow:0 0 0 3px rgba(74,95,138,.13)}
textarea.inp{resize:vertical; line-height:1.7}

/* ── 여섯 자리 비밀번호 칸 ─────────────────────────
   통합 행정 앱과 같은 모양. 네모 여섯 개를 보여 주고 그 위에 투명한 진짜
   입력칸을 덮는다. 휴대폰에서 숫자 자판이 뜨고 붙여넣기도 그대로 된다. */
.pinwrap{position:relative}
.pinrow{display:grid; grid-template-columns:repeat(6,1fr); gap:8px}
.pincell{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line-2); border-radius:12px; background:var(--surface);
  font-size:22px; font-weight:700; color:var(--ink); transition:.12s;
}
.pincell.on{border-color:var(--navy-l); box-shadow:0 0 0 3px rgba(74,95,138,.13)}
.pinreal{
  position:absolute; inset:0; width:100%; height:100%;
  opacity:0; cursor:pointer; border:0; padding:0; font-size:16px;
}
.seg{display:inline-flex; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; background:var(--surface)}
.seg button{padding:6px 13px; font-size:13px; font-weight:550; color:var(--ink-2); border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy); color:#fff}

/* ── 배지 ──────────────────────────────────────── */
.tag{display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); white-space:nowrap}
.tag.auto{background:var(--gold-bg); color:var(--gold-t); border-color:#EBD4B0}
.tag.man{background:#EAF0F9; color:var(--navy); border-color:#CBD8EC}
.tag.warn{background:#FCECE7; color:#B03A1A; border-color:#F2C9BB; font-weight:650}
.key{display:inline-block; min-width:30px; text-align:center; padding:2px 7px; border-radius:6px;
  font-size:12.5px; font-weight:700; background:var(--navy); color:#fff; letter-spacing:.02em}
.key.alt{background:var(--gold)}
.cat{display:inline-block; padding:1px 8px; border-radius:5px; font-size:11.5px; font-weight:600;
  background:var(--surface-2); color:var(--ink-2)}
/* 예배 6종 구분색 — 색만으로 구분하지 않고 이름을 늘 함께 적는다 */
.pill{display:inline-block; padding:2px 9px; border-radius:6px; font-size:12px; font-weight:600;
  white-space:nowrap}
.pill.s1{background:#E8F0EA; color:#2F6B4F}   /* 주일 1부 */
.pill.s2{background:#EAEFF9; color:#33508C}   /* 주일 2부 */
.pill.s3{background:#F6EDE1; color:#8F5E1E}   /* 금요기도회 */
.pill.s4{background:#E3F0F0; color:#2A6467}   /* 청년부예배 */
.pill.s5{background:#EEEAF6; color:#52418C}   /* 청소년부예배 */
.pill.s6{background:#EEECE8; color:#5A6273}   /* 기타예배 */

/* ── 표 ────────────────────────────────────────── */
table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:12px; font-weight:650; color:var(--ink-3);
  padding:9px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  text-transform:none; letter-spacing:.01em}
td{padding:10px 14px; border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--surface-2)}
td.num{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-2)}
/* 곡을 눌렀을 때 아래에 펼쳐지는 줄 — 접혀 있을 땐 아무 자리도 차지하지 않는다 */
tr.pk-row>td{padding:0; border-bottom:none}
tr.pk-row>td>.peek{margin:0 0 12px !important; padding:12px 14px;
  background:var(--surface-2); border-left:3px solid var(--gold)}
tbody tr:has(+tr.pk-row:last-child)>td{border-bottom:none}
.pk-edit>.inp{flex:1 1 240px; min-width:0; font-weight:700}
/* 유튜브 연습 영상 자리 — 화면 너비에 맞춰 16:9 로 */
.yt-frame{width:100%; max-width:720px; margin-top:11px; border-radius:10px; overflow:hidden;
  background:#000}
.yt-frame:empty{display:none}
.yt-frame iframe, .yt-frame>div{width:100%; aspect-ratio:16/9; display:block; border:0}
/* 곡 흐름 — 구간 한 줄. 폰에서 두 줄로 접혀도 어디까지가 한 구간인지 보이게 테두리를 준다 */
.form-row{margin-top:6px; padding:7px 9px; border:1px solid var(--line); border-radius:9px}
.t-scroll{overflow-x:auto}

/* ── 순위 막대 ─────────────────────────────────── */
.rank{display:flex; flex-direction:column}
.rank-row{display:grid; grid-template-columns:26px 1fr auto; gap:11px; align-items:center;
  padding:8px 18px; border-bottom:1px solid var(--line); cursor:pointer}
.rank-row:last-child{border-bottom:none}
.rank-row:hover{background:var(--surface-2)}
.rank-no{font-size:13px; font-weight:700; color:var(--ink-3); text-align:center;
  font-variant-numeric:tabular-nums}
.rank-row:nth-child(1) .rank-no{color:var(--gold-t)}
.rank-bd{min-width:0}
.rank-nm{font-size:14px; font-weight:550; display:flex; align-items:center; gap:5px;
  flex-wrap:wrap; min-width:0; margin-bottom:4px}
.rank-title{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stats-song-meta{display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap}
.stats-meta-keys{display:inline-flex; gap:3px; flex-wrap:wrap}
.stats-song-meta .key{font-size:10px; min-width:23px; padding:1px 5px; line-height:1.45}
.stats-topic{display:inline-flex; align-items:center; min-height:19px; padding:1px 7px;
  border-radius:999px; background:#eef3fb; color:#405779; font-size:10.5px; font-weight:650}
.stats-summary-song{display:flex; align-items:center; gap:5px; flex-wrap:wrap; font-size:13.5px;
  padding:2px 0; min-width:0}
.stats-summary-song>.sub:last-child{margin-left:auto; white-space:nowrap}
.bar{height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden}
.bar>i{display:block; height:100%; background:var(--navy-l); border-radius:3px}
.rank-row:nth-child(1) .bar>i,.rank-row:nth-child(2) .bar>i,.rank-row:nth-child(3) .bar>i{background:var(--gold)}
.rank-ct{font-size:13px; font-weight:650; color:var(--ink-2); font-variant-numeric:tabular-nums;
  white-space:nowrap}

/* ── 통계 타일 ─────────────────────────────────── */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px;
  position:relative; transition:.13s}
/* 눌러서 바로 이동하는 타일 */
.tile.go{cursor:pointer}
.tile.go:hover{border-color:var(--navy-l); box-shadow:0 2px 4px rgba(30,36,51,.07), 0 8px 18px rgba(30,36,51,.08);
  transform:translateY(-1px)}
.tile.go::after{content:'›'; position:absolute; top:11px; right:13px; font-size:17px;
  color:var(--line-2); line-height:1; transition:.13s}
.tile.go:hover::after{color:var(--navy-l)}
.tile .lb{font-size:12px; color:var(--ink-3); font-weight:550; margin-bottom:4px; padding-right:14px}
/* 타일을 눌러 도착한 카드를 잠깐 강조 */
@keyframes flash{0%,100%{box-shadow:var(--sh)} 22%,55%{box-shadow:0 0 0 3px rgba(200,135,60,.45), var(--sh)}}
.flash{animation:flash 1.5s ease-in-out 1}
.tile .vl{font-size:24px; font-weight:700; letter-spacing:-.03em; line-height:1.15;
  font-variant-numeric:tabular-nums}
.tile .vl small{font-size:13px; font-weight:600; color:var(--ink-2); margin-left:2px}
.tile .sb{font-size:11.5px; color:var(--ink-3); margin-top:3px}

/* ── 홈: 우리 교회 찬양 흐름 상황판 ─────────────── */
.home-title{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.home-title>div{flex:1;min-width:240px}
.home-service-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.home-service-tab{position:relative;min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line-2);
  border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;transition:.12s}
.home-service-tab:hover{border-color:var(--navy-l);background:#FBFCFE}
.home-service-tab.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:var(--sh)}
.home-service-tab b{font-size:14px;letter-spacing:-.02em}
.home-service-tab span{font-size:11.5px;color:var(--ink-3)}
.home-service-tab.on span{color:#DCE6F6}
.home-service-tab em{position:absolute;right:10px;top:10px;font-style:normal;font-size:10.5px;font-weight:700;
  background:#F7E9D4;color:#8B5318;border-radius:20px;padding:3px 7px}
.home-service-tab.missing{border-style:dashed;opacity:.65}
.home-service-board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden}
.home-service-board-h{padding:17px 20px 14px;border-bottom:1px solid var(--line);background:#FBFAF7}
.home-service-board-h h2{font-size:19px;letter-spacing:-.03em}
.home-service-board-h p{margin-top:3px;font-size:12.5px;color:var(--ink-3)}
.home-snapshot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.home-snapshot-block{min-width:0;padding:17px 20px;border-bottom:1px solid var(--line)}
.home-snapshot-block:nth-child(odd){border-right:1px solid var(--line)}
.home-snapshot-block:last-child:nth-child(odd){grid-column:1/-1;border-right:0}
.home-snapshot-block h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 7px;font-size:17px;font-weight:800;
  color:var(--ink);margin-bottom:12px;padding:10px 12px;border-left:5px solid var(--navy);border-radius:8px;background:#EDF2F9}
.home-snapshot-block h3 small{font-size:11.5px;color:inherit;opacity:.7;font-weight:600;margin-left:0}
.home-block-popular h3{background:#EAF0FA;border-left-color:#314B78;color:#183058}
.home-block-fresh h3{background:#FFF0D7;border-left-color:#D9912B;color:#6B3D09}
.home-block-learned h3{background:#E9F3FF;border-left-color:#4E78B8;color:#244B7B}
.home-block-forgotten h3{background:#F1EDF8;border-left-color:#7460A4;color:#473773}
.home-block-sermon h3{background:#E8F4F1;border-left-color:#2E8074;color:#185B53}
.home-snapshot-list{list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:home-flow}
.home-snapshot-list li{counter-increment:home-flow;display:grid;grid-template-columns:20px minmax(0,1fr) auto;
  align-items:center;gap:6px;font-size:13.5px;min-height:22px}
.home-snapshot-list li::before{content:counter(home-flow);font-size:11px;color:var(--ink-3);text-align:center}
.home-snapshot-list li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-snapshot-list li b{font-size:11.5px;color:var(--ink-3);font-weight:600;font-variant-numeric:tabular-nums}
.home-snapshot-block.wide-list-block{grid-column:1/-1;border-right:0}
.home-snapshot-list.home-two-row-list{display:block;columns:2;column-gap:32px;overflow:visible;
  padding-bottom:4px;counter-reset:home-flow}
.home-snapshot-list.home-two-column-list{display:block;columns:2;column-gap:42px;overflow:visible;
  padding-bottom:4px;counter-reset:home-flow}
.home-snapshot-list.home-two-row-list li,.home-snapshot-list.home-two-column-list li{
  width:100%;min-width:0;margin-bottom:6px;break-inside:avoid}
.home-snapshot-empty{font-size:13px;color:var(--ink-3);padding:8px 0 10px}
.home-request-strip{padding:16px 20px}
.home-request-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;
  padding:10px 12px;border-left:5px solid #314B78;border-radius:8px;background:#EAF0FA;color:#183058}
.home-request-head b{font-size:16px;line-height:1.35;font-weight:800}
.home-request-head span{font-size:12px;color:var(--ink-3);white-space:nowrap}
.home-request-groups{display:grid;gap:9px}
.home-request-group{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;box-shadow:0 3px 10px rgba(24,48,88,.1)}
.home-request-group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;
  min-height:48px;padding:11px 14px;font-size:13.5px;font-weight:800;transition:filter .12s,transform .12s}
.home-request-group summary::-webkit-details-marker{display:none}
.home-request-group summary::before{content:'▶';font-size:10px;transition:transform .12s}
.home-request-group summary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.home-request-group[open] summary{border-bottom:1px solid rgba(255,255,255,.35)}
.home-request-group[open] summary::before{transform:rotate(90deg)}
.home-request-group summary span{flex:1;min-width:0}
.home-request-group summary b{font-size:11.5px;font-weight:800;white-space:nowrap;border-radius:20px;padding:3px 8px}
.home-request-group.sung summary{background:#D9912B;color:#251708}
.home-request-group.sung summary::before{color:#251708}
.home-request-group.sung summary b{background:rgba(255,255,255,.58);color:#5B350B}
.home-request-group.new summary{background:var(--navy);color:#fff}
.home-request-group.new summary::before{color:#F8D59A}
.home-request-group.new summary b{background:rgba(255,255,255,.16);color:#fff}
.home-request-group .home-request-songs{padding:12px}
.home-request-songs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px}
.home-request-songs>span{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;font-size:12.5px;line-height:1.35;background:#F7E9D4;color:#684015;border-radius:8px;padding:7px 9px;overflow-wrap:anywhere}
.home-request-songs>span i{font-style:normal;font-weight:700;flex:none}
.home-request-songs>span i.missing{color:var(--ink-3);font-size:11px;font-weight:500}

.audit-periods{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px 14px;margin-top:10px;border:1px solid #cbd8ec;border-radius:10px;background:#f5f8fd}
.audit-periods b{margin-right:5px}.audit-shell{display:grid;gap:14px}.audit-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.audit-progress{flex:1 1 260px;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}.audit-progress>i{display:block;height:100%;background:var(--gold);border-radius:999px}.audit-work{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.8fr);gap:16px;align-items:start}.audit-score{min-height:580px;max-height:72vh;overflow:auto;border:1px solid var(--line-2);border-radius:12px;background:#fff}.audit-score .sheet-view{min-height:580px}.audit-score .sheet-img{width:100%;height:auto}.audit-score-empty{min-height:580px;display:grid;place-content:center;gap:7px;text-align:center;color:var(--ink-3);background:repeating-linear-gradient(180deg,#fff 0 34px,#faf8f4 34px 35px)}.audit-panel{display:grid;gap:13px;position:sticky;top:76px}.audit-fields{display:grid;gap:10px}.audit-key-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}.audit-key-grid button{min-width:0;padding:8px 2px}.audit-sheet-tabs{display:flex;gap:5px;flex-wrap:wrap}.audit-drop{display:grid;gap:5px;padding:13px;border:1px dashed #9fb1cc;border-radius:10px;background:#f7f9fc;text-align:center;color:var(--ink-2)}.audit-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:8px}.audit-actions .pri{min-height:46px}.audit-saved-note{font-size:12.5px;color:var(--ok);font-weight:700}

.quick-conti-shell{max-width:760px;display:grid;gap:14px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--sh)}
.quick-date{display:block;width:100%;max-width:230px;min-width:0}.quick-pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-picker,.quick-key-picker{position:relative;border:1px solid var(--line-2);border-radius:10px;background:#fff}
.quick-picker summary,.quick-key-picker summary{list-style:none;cursor:pointer}.quick-picker summary::-webkit-details-marker,.quick-key-picker summary::-webkit-details-marker{display:none}
.quick-picker summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px}.quick-picker summary span{color:var(--ink-3);font-size:12.5px}.quick-picker summary b{font-size:15px}

/* 합치기 창의 악보 미리보기 */
.mg-imgs{display:grid; grid-template-columns:1fr 1fr; gap:6px}

/* 악보 직접 나누기 — 테두리와 분할선을 끌어서 조정 */
.cutman{position:relative; user-select:none; touch-action:none; background:#fff;

<script>
/* ══════════════════════════════════════════════════════════════════

/* 이 두 값은 공개돼도 안전합니다. 데이터를 지키는 건 이 열쇠가 아니라
   데이터베이스에 걸어둔 RLS(행 단위 보안)입니다. */
const SUPA_URL = 'https://vsxukdgfxcacjykopwuu.supabase.co';
const SUPA_KEY = 'sb_publishable_TrkZecX0Pg4GYiFIlmuyfA_EjVQg3_x';
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
const READ_ONLY_PREVIEW = !!window.__READ_ONLY_PREVIEW__;

let DATA = { leaders: [], services: [], songs: [], setlists: [] };
let ALL_LEADERS = [];          // 담임목사까지 포함 (이름 찾을 때 씀)
const S = {}, L = {}, SV = {}, SVC_CLASS = {};
let TODAY = '';
let AUTH_USER = null;          // 로그인한 계정

let LOADING = false;
let PHONE_OK = false;          // 명단에 전화번호 칸이 만들어져 있는가

/* ── 전화번호 로그인 ─────────────────────────────
   통합 행정 앱(목회비서)과 **똑같은 규칙**을 씁니다. 인도자들이 두 앱을
   같은 방식으로 들어가게 하려는 것이고, 나중에 두 앱을 합칠 때도 어긋나지 않습니다.

     화면에 치는 것   010-1234-5678
     저장소에 넣는 것 +821012345678        (leaders.phone)
     인증 서버 주소   p821012345678@phone.invalid   ← 화면에 절대 안 보임

   옛 번호(010 뒤 7자리)도 받습니다. 목회비서가 그렇게 열어 두었습니다. */
function phoneDigits(v){
  const d = String(v || '').replace(/\D/g, '');
  if(d.startsWith('82') && (d.length === 11 || d.length === 12)) return '0' + d.slice(2);
  return d;
}
function phoneE164(v){
  const m = phoneDigits(v);
  return /^010\d{7,8}$/.test(m) ? '+82' + m.slice(1) : null;
}
function phonePretty(v){
  const m = phoneDigits(v).slice(0, 11);
  if(m.length <= 3) return m;
  if(m.length <= 7) return m.slice(0,3) + '-' + m.slice(3);
  if(m.length === 10) return m.slice(0,3) + '-' + m.slice(3,6) + '-' + m.slice(6);
  return m.slice(0,3) + '-' + m.slice(3,7) + '-' + m.slice(7);
}
/* 저장소에 든 +8210… 을 화면용 010-…-… 으로 */
function phoneShow(e164){ return e164 ? phonePretty('0' + String(e164).replace(/^\+82/, '')) : ''; }
/* 인증 서버에만 쓰는 내부 주소 — 사람에게 보여 주지 않는다 */
function phoneAuthEmail(v){
  const e = phoneE164(v);
  return e ? 'p' + e.replace(/\D/g, '') + '@phone.invalid' : null;
}
const isSixDigits = v => /^\d{6}$/.test(String(v || ''));

/* ── 여섯 자리 비밀번호 칸 ───────────────────────
   통합 행정 앱과 같은 모양입니다. 네모 여섯 개를 그리고 그 위에 투명한 진짜
   입력칸을 덮습니다. 자판·붙여넣기·자동완성이 다 보통 입력칸처럼 돕니다.

   ⚠ 여기서 `render()` 를 부르면 안 됩니다 — 한 자 칠 때마다 화면을 새로 그리면
      커서가 사라집니다(이미 밟은 지뢰). 네모 줄만 `pinPaint()` 로 다시 그립니다. */
function pinCells(v){
  const d = String(v || '').replace(/\D/g, '').slice(0, 6);
  let h = '';
  for(let i = 0; i < 6; i++){
    const 찼나 = i < d.length;
    const 지금 = i === d.length && d.length < 6;
    // 방금 친 한 자리만 보여 주고 앞자리는 가린다
    const 글 = 찼나 ? ((i < d.length - 1 || d.length === 6) ? '*' : d[i]) : '';
    h += `<div class="pincell${지금 ? ' on' : ''}">${글}</div>`;
  }
  return h;
}
function pinHtml(id, val, ac){
  return `<div class="pinwrap" onclick="var e=document.getElementById('${id}');if(e)e.focus()">
    <div class="pinrow" id="${id}row">${pinCells(val)}</div>
    <input class="pinreal" id="${id}" type="text" inputmode="numeric" pattern="[0-9]*"
      maxlength="6" autocomplete="${ac}" value="${esc(val)}"
      onkeydown="if(event.key.length===1&&!/[0-9]/.test(event.key))event.preventDefault()"
      oninput="pinInput('${id}', this)"></div>`;
}
function pinPaint(id){
  const row = document.getElementById(id + 'row');
  if(row) row.innerHTML = pinCells(id === 'pin2' ? authState.pin2 : authState.pin);
}
function pinInput(id, el){
  const d = el.value.replace(/\D/g, '').slice(0, 6);
  el.value = d;
  if(id === 'pin2') authState.pin2 = d; else authState.pin = d;
  pinPaint(id);
  if(d.length !== 6) return;
  // 여섯 자리가 찼다 — 「정하기」면 다음 칸으로, 「로그인」이면 바로 들어간다.
  // 번호가 열한 자리로 다 채워졌을 때만 저절로 보낸다. 고치는 도중에 보내지면
  // 헛 실패가 쌓이기 때문이다(통합 행정 앱에서 이미 겪은 일).
  if(id === 'pin' && authState.mode === 'up'){
    const n = document.getElementById('pin2'); if(n) n.focus();
    return;
  }
  if(/^010\d{8}$/.test(phoneDigits(authState.phone))) doAuth();
}

const isAdmin = () => !READ_ONLY_PREVIEW && !!(ME && ME.role === '관리자');
// 인도자는 누가 처음 입력했는지가 아니라 실제 자기 이름으로 배정된 콘티를 고친다.
// 삭제는 기존처럼 작성자와 관리자만 가능하게 분리한다.
const canEditSetlist = st => !READ_ONLY_PREVIEW && (isAdmin() || (ME && st.leaderId === ME.id));
const canDeleteSetlist = st => !READ_ONLY_PREVIEW && (isAdmin() || (ME && st.createdBy === ME.id));

function todayStr(){
  const t = new Date();
  return `${t.getFullYear()}-${d2(t.getMonth()+1)}-${d2(t.getDate())}`;
}

/* ── 데이터 불러오기 ─────────────────────────────
   콘티는 몇 백 개 수준이라 한 번에 다 받아 브라우저에서 계산합니다.
   그래야 검색·순위·통계가 기다림 없이 즉시 나옵니다. */
async function loadAll(){
  LOADING = true;
  const [lead, svc, songs, sheets, sets] = await Promise.all([
    sb.from('leaders').select('*').order('sort_order'),
    sb.from('services').select('*').order('sort_order'),
    sb.from('songs').select('*').order('title'),
    sb.from('sheets').select('*').order('sort_order'),
    sb.from('setlists').select('*, setlist_items(*)').is('deleted_at', null)
      .order('service_date', { ascending: false }),
  ]);
  LOADING = false;
  const bad = [lead, svc, songs, sheets, sets].find(r => r.error);
  if(bad) throw bad.error;

  const bySong = {};
  (sheets.data || []).forEach(sh => {
    (bySong[sh.song_id] = bySong[sh.song_id] || []).push({
      id: sh.id, key: sh.sheet_key || '', origin: !!sh.is_origin,
      path: sh.storage_path, fileType: sh.file_type || '', note: sh.note || '',
      createdAt: sh.created_at || '', uploadedBy: sh.uploaded_by || '',
    });
  });

  ALL_LEADERS = (lead.data || []).map(l => ({
    id: l.id, name: l.name, email: l.email || '', role: l.role,
    order: l.sort_order, active: l.is_active, isLeader: l.is_leader,
    authUserId: l.auth_user_id, phone: l.phone || '',
  }));

  // 전화번호 로그인 칸(`5_전화번호_로그인_켜기.sql`)이 만들어져 있는지 본다.
  // 없어도 앱은 죽지 않고, 설정 화면에 전화번호 칸만 안 보인다.
  PHONE_OK = !!(lead.data && lead.data[0] && ('phone' in lead.data[0]));

  // 저장소에 연습 칸(유튜브·빠르기)이 만들어져 있는지 확인한다
  PRACTICE_OK = !!(songs.data && songs.data[0] && ('youtube_url' in songs.data[0]));
  // 곡 흐름(인트로·1절·후렴 자리) 칸은 나중에 만든 것이라 따로 본다
  FORM_OK = !!(songs.data && songs.data[0] && ('song_form' in songs.data[0]));

  DATA = {
    leaders: ALL_LEADERS.filter(l => l.isLeader),
    services: (svc.data || []).map(v => ({ id: v.id, name: v.name, order: v.sort_order })),
    songs: (songs.data || []).map(s => ({
      id: s.id, title: s.title, aliases: s.aliases || [], artist: s.artist || '',
      key: s.origin_key || '', category: s.category || '', lyrics: s.lyrics || '',
      autoTags: s.auto_tags || [], manualTags: s.manual_tags || [],
      youtube: s.youtube_url || '', bpm: s.bpm || null,
      form: Array.isArray(s.song_form) ? s.song_form : [],
      sheets: bySong[s.id] || [], createdAt: s.created_at || '',
    })),
    setlists: (sets.data || []).map(st => ({
      id: st.id, date: st.service_date, serviceId: st.service_id,
      leaderId: st.leader_id, memo: st.memo || '', createdBy: st.created_by,
      items: (st.setlist_items || []).sort((a, b) => a.position - b.position)
        .map(i => ({ id: i.id, songId: i.song_id, order: i.position,
                     key: i.sung_key || '', note: i.note || '' })),
    })),
  };
  applyKnownSongAliases();
  applyCuratedSongTopics();
  reindexAll();
}

function reindexAll(){
  [S, L, SV, SVC_CLASS].forEach(o => Object.keys(o).forEach(k => delete o[k]));
  DATA.songs.forEach(s => S[s.id] = s);
  ALL_LEADERS.forEach(l => L[l.id] = l);
  DATA.services.forEach((v, i) => { SV[v.id] = v; SVC_CLASS[v.id] = 's' + ((i % 6) + 1); });
  buildAppearIndex();
  buildNormIndex();
}

/* ── 저장 (콘티) ────────────────────────────────── */
async function saveSetlist(){
  if(!inputState.picked.length){ say('찬양을 한 곡 이상 담아 주세요.'); return; }
  if(!inputState.serviceId || !inputState.leaderId){ say('예배와 인도자를 선택해 주세요.'); return; }
  const dup = DATA.setlists.find(st => st.date === inputState.date
    && st.serviceId === inputState.serviceId && st.id !== inputState.editingId);
  if(dup && !inputState.dupOk){
    inputState.dupOk = true; render();
    say(`${fmtShort(dup.date)} ${SV[dup.serviceId].name} 콘티가 이미 등록되어 있습니다.\n한 번 더 누르면 별도의 콘티로 추가됩니다. 기존 콘티를 수정하려면 「콘티 보기」에서 여세요.`);
    return;
  }
  const btnLock = '저장 중…';
  try {
    let setlistId = inputState.editingId;
    if(setlistId){
      const { error } = await sb.from('setlists').update({
        service_date: inputState.date, service_id: inputState.serviceId,
        leader_id: inputState.leaderId, memo: inputState.memo || null,
      }).eq('id', setlistId);
      if(error) throw error;
      const { error: e2 } = await sb.from('setlist_items').delete().eq('setlist_id', setlistId);
      if(e2) throw e2;
    } else {
      const { data, error } = await sb.from('setlists').insert({
        service_date: inputState.date, service_id: inputState.serviceId,
        leader_id: inputState.leaderId, memo: inputState.memo || null,
        created_by: ME ? ME.id : null,
      }).select('id').single();
      if(error) throw error;
      setlistId = data.id;
    }
    const rows = inputState.picked.map((p, i) => ({
      setlist_id: setlistId, song_id: p.songId, position: i + 1,
      sung_key: p.key || null, note: p.note || null,
    }));
    const { error: e3 } = await sb.from('setlist_items').insert(rows);
    if(e3) throw e3;

    await loadAll();
    const wasEdit = !!inputState.editingId;
    inputState = newInputState();
    go('setlist/' + setlistId);
    say(wasEdit ? '콘티를 고쳤습니다.' : '콘티를 저장했습니다.');
  } catch(e){
    say('저장하지 못했습니다.\n' + friendlyError(e));
  }
}

/* 인도자용 간단 입력: 악보·별칭·합치기 없이 제목과 부른 코드만 통계 원장에 남긴다. */
async function saveLeaderQuickSetlist(){
  if(!leaderInterface()){ await saveSetlist(); return; }
  ensureLeaderQuickRows();
  const rows = inputState.quickRows.map(row=>({title:String(row.title||'').trim(),key:row.key||''}))
    .filter(row=>row.title);
  if(!rows.length){ say('곡명을 한 곡 이상 적어 주세요.'); return; }
  const placeholder = rows.find(row => obviousPlaceholderTitle(row.title));
  if(placeholder){ say(`「${placeholder.title}」은 곡 제목으로 저장할 수 없습니다.\n두 글자 이상 입력해 주세요.`); return; }
  if(!inputState.date || !inputState.serviceId || !inputState.leaderId){
    say('날짜와 예배, 인도자를 선택해 주세요.'); return;
  }
  const dup = DATA.setlists.find(st=>st.date===inputState.date
    && st.serviceId===inputState.serviceId && st.id!==inputState.editingId);
  if(dup && !inputState.dupOk){
    inputState.dupOk=true; render();
    say(`${fmtShort(dup.date)} ${SV[dup.serviceId].name} 콘티가 이미 있습니다.\n별도 콘티가 맞으면 저장을 한 번 더 눌러 주세요.`);
    return;
  }
  inputState.quickBusy=true; render();
  try {
    const picked=[];
    for(const row of rows){
      let songId=NORM_INDEX[norm(row.title)] || null;
      if(!songId) songId=await createSong(row.title,{key:row.key});
      if(!songId) throw new Error(`「${row.title}」을 저장하지 못했습니다.`);
      picked.push({songId,key:row.key || S[songId]?.key || '',note:''});
    }
    inputState.picked=picked;
    inputState.quickBusy=false;
    await saveSetlist();
  } catch(e){
    inputState.quickBusy=false; render();
    say('저장하지 못했습니다.\n'+friendlyError(e));
  }
}

async function deleteSetlist(id){
  const st = DATA.setlists.find(x => x.id === id);
  if(!st) return;
  if(!canDeleteSetlist(st)){ say('다른 인도자가 작성한 콘티는 삭제할 수 없습니다.'); return; }
  if(confirmState.pending !== id){
    confirmState.pending = id; render();
    say('한 번 더 누르면 휴지통으로 이동합니다. 30일 이내에 복구할 수 있습니다.');
    setTimeout(() => { if(confirmState.pending === id){ confirmState.pending = null; render(); } }, 6000);
    return;
  }
  confirmState.pending = null;
  const { error } = await sb.from('setlists')
    .update({ deleted_at: new Date().toISOString() }).eq('id', id);
  if(error){ say('지우지 못했습니다.\n' + friendlyError(error)); return; }
  await loadAll(); go('setlists');
  say('휴지통으로 이동했습니다.');
}

function editSetlist(id){
  const st = DATA.setlists.find(x => x.id === id);
  if(!st) return;
  if(!canEditSetlist(st)){ say('다른 인도자가 작성한 콘티는 수정할 수 없습니다. 열람만 가능합니다.'); return; }
  inputState = {
    editingId: st.id, date: st.date, serviceId: st.serviceId, leaderId: st.leaderId,
    memo: st.memo, pasted: '', dupOk: false,
    picked: st.items.map(i => ({ songId: i.songId, key: i.key, note: i.note })),
    quickRows: st.items.map(i => ({ title:S[i.songId]?.title || '', key:i.key || '' })),
  };
  go('new');
}

/* ── 저장 (곡) ──────────────────────────────────── */
async function createSong(title, extra = {}){
  const t = (title || '').trim();
  if(!t) return null;
  if(obviousPlaceholderTitle(t)){
    say(`「${t}」은 곡 제목으로 저장할 수 없습니다.\n두 글자 이상 입력해 주세요.`);
    return null;
  }
  const { data, error } = await sb.from('songs').insert({
    title: t, artist: extra.artist || null, origin_key: extra.key || null,
    category: extra.category || null, aliases: extra.aliases || [],
    created_by: ME ? ME.id : null,
  }).select('id').single();
  if(error){ say('곡을 만들지 못했습니다.\n' + friendlyError(error)); return null; }
  await loadAll();
  return data.id;
}

async function updateSong(id, patch){
  const map = { title:'title', artist:'artist', key:'origin_key', category:'category',
                lyrics:'lyrics', aliases:'aliases', manualTags:'manual_tags' };
  const row = {};
  Object.entries(patch).forEach(([k, v]) => { if(map[k]) row[map[k]] = v === '' ? null : v; });
  if(!Object.keys(row).length) return;
  const { error } = await sb.from('songs').update(row).eq('id', id);
  if(error){ say('고치지 못했습니다.\n' + friendlyError(error)); return; }
  await loadAll(); render();
}

/** 곡 상세에서 여러 항목을 고친 뒤 저장 여부를 명확히 확인하는 단일 저장 버튼. */
async function saveSongInfo(id){
  const title = document.getElementById('songInfoTitle');
  const artist = document.getElementById('songInfoArtist');
  const key = document.getElementById('songInfoKey');
  const category = document.getElementById('songInfoCategory');
  const aliases = document.getElementById('songInfoAliases');
  if(!title || !title.value.trim()){ say('곡 제목을 입력해 주세요.'); return; }
  const row = {
    title: title.value.trim(),
    artist: artist ? artist.value.trim() || null : null,
    origin_key: key ? key.value || null : null,
    category: category ? category.value || null : null,
    aliases: aliases ? aliases.value.split(',').map(v=>v.trim()).filter(Boolean) : [],
  };
  const { error } = await sb.from('songs').update(row).eq('id', id);
  if(error){ say('곡 정보를 저장하지 못했습니다.\n' + friendlyError(error)); return; }
  await loadAll(); render();
  say('곡 정보를 저장했습니다.');
}

/** 같은 곡이 두 개로 갈렸을 때 하나로 합친다. 콘티 기록까지 옮긴다. */
async function mergeSongs(keepId, dropId){
  if(!isAdmin()){ say('곡 합치기는 관리자만 사용할 수 있습니다.'); return; }
  const keep = S[keepId], drop = S[dropId];
  if(!keep || !drop) return;
  try {
    const { error: e1 } = await sb.from('setlist_items').update({ song_id: keepId }).eq('song_id', dropId);
    if(e1) throw e1;
    const { error: e2 } = await sb.from('sheets').update({ song_id: keepId }).eq('song_id', dropId);
    if(e2) throw e2;
    const merged = [...new Set([...keep.aliases, drop.title, ...drop.aliases])].filter(a => a !== keep.title);
    const { error: e3 } = await sb.from('songs').update({ aliases: merged }).eq('id', keepId);
    if(e3) throw e3;
    const { error: e4 } = await sb.from('songs').delete().eq('id', dropId);
    if(e4) throw e4;
    await loadAll(); render();
    say(`「${esc(drop.title)}」을 「${esc(keep.title)}」에 합쳤습니다.\n콘티 기록과 악보가 함께 이동했습니다.`);
  } catch(e){
    say('합치지 못했습니다.\n' + friendlyError(e));
  }
}

/* ── 저장 (악보 파일) ───────────────────────────── */
/** 파일 저장소 경로는 영문·숫자만 받는다.
    한글이나 #, 공백이 들어가면 저장소가 거부한다(Invalid key). */
function safePath(s){
  return String(s || '').replace(/[^A-Za-z0-9._-]/g, '') || 'x';
}

const sheetUrlCache = {};
async function getSheetUrl(path){
  if(sheetUrlCache[path]) return sheetUrlCache[path];
  const { data, error } = await sb.storage.from('sheets').createSignedUrl(path, 3600);
  if(error) return null;
  sheetUrlCache[path] = data.signedUrl;
  return data.signedUrl;
}

/** 화면을 그린 뒤 악보 이미지를 실제로 채운다 (주소를 받아오는 데 시간이 걸리므로) */
async function hydrateSheets(){
  const nodes = [...document.querySelectorAll('[data-sheet]')];
  for(const el of nodes){
    const path = el.getAttribute('data-sheet');
    const type = el.getAttribute('data-type') || '';
    const url = await getSheetUrl(path);
    if(!url){ el.innerHTML = '<div class="sub">악보를 불러오지 못했습니다</div>'; continue; }
    el.innerHTML = type === 'pdf'
      ? `<iframe src="${url}#toolbar=0" class="sheet-frame" loading="lazy"></iframe>`
      : `<img src="${url}" class="sheet-img" loading="lazy" alt="악보">`;
    // 악보를 누르면 화면 가득 띄운다 (폰에서 작아서 잘 안 보이기 때문)
    if(el.getAttribute('data-nozoom') !== '1'){
      el.style.cursor = 'zoom-in';
      el.onclick = () => openBigSheet(path, type);
    }
  }
}

/** 사진은 화면에서 볼 만한 크기로 줄여 올린다. 저장 공간을 아끼려고. */
function shrinkImage(file, maxW = 1600, quality = 0.82){
  return new Promise(resolve => {
    if(!file.type.startsWith('image/')) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const scale = Math.min(1, maxW / img.width);
      if(scale === 1 && file.size < 600000) return resolve(file);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b || file), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function uploadSheet(songId, file, key, isOrigin){
  const song = S[songId];
  if(!song || !AUTH_USER) return null;
  try {
    const blob = await shrinkImage(file);
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const ext = isPdf ? 'pdf' : 'jpg';
    const keyTag = safePath((key || '').replace('#', 's'));
    const path = `${safePath(AUTH_USER.id)}/${safePath(songId)}/${Date.now()}_${keyTag || 'x'}.${ext}`;
    const { error: upErr } = await sb.storage.from('sheets')
      .upload(path, blob, { contentType: isPdf ? 'application/pdf' : 'image/jpeg', upsert: false });
    if(upErr) throw upErr;
    const { data: made, error } = await sb.from('sheets').insert({
      song_id: songId, sheet_key: key || null, is_origin: !!isOrigin,
      storage_path: path, file_type: isPdf ? 'pdf' : 'image',
      sort_order: (song.sheets.length || 0) + 1, uploaded_by: AUTH_USER.id,
    }).select('id').single();
    if(error) throw error;
    await loadAll(); render();
    say(`${esc(song.title)} 악보를 등록했습니다.${key ? ' (' + esc(key) + '키)' : ''}`);
    return made && made.id ? made.id : null;
  } catch(e){
    say('악보를 올리지 못했습니다.\n' + friendlyError(e));
    return null;
  }
}

/** 같은 악보를 더 좋은 화질로 갈아끼운다.
    한 파일을 여러 곡이 함께 쓰더라도 지금 고른 악보 행만 바꾼다. */
async function replaceSheet(sheetId, oldPath, file){
  if(!AUTH_USER) return null;
  try {
    const oldSheet = DATA.songs.flatMap(s => s.sheets || []).find(s => s.id === sheetId);
    if(!oldSheet || (!isAdmin() && oldSheet.uploadedBy !== AUTH_USER.id))
      throw new Error('직접 올린 악보만 교체할 수 있습니다. 기존 악보는 관리자에게 요청해 주세요.');
    const blob = await shrinkImage(file, 1800, 0.86);
    const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const ext = isPdf ? 'pdf' : 'jpg';
    const newPath = `${safePath(AUTH_USER.id)}/replace/${Date.now()}_new.${ext}`;
    const { error: upErr } = await sb.storage.from('sheets')
      .upload(newPath, blob, { contentType: isPdf ? 'application/pdf' : 'image/jpeg' });
    if(upErr) throw upErr;

    // 같은 원본을 공유하는 다른 곡은 그대로 두고 지금 고른 악보만 바꾼다.
    const { error } = await sb.from('sheets')
      .update({ storage_path: newPath, file_type: isPdf ? 'pdf' : 'image', uploaded_by: AUTH_USER.id })
      .eq('id', sheetId);
    if(error) throw error;

    const { data: still } = await sb.from('sheets').select('id')
      .eq('storage_path', oldPath).limit(1);
    if(!still || !still.length){
      await sb.storage.from('sheets').remove([oldPath]);
      delete sheetUrlCache[oldPath];
    }
    await loadAll(); render();
    say('악보를 새 파일로 교체했습니다.');
    return sheetId;
  } catch(e){
    say('교체하지 못했습니다.\n' + friendlyError(e));
    return null;
  }
}

async function deleteSheet(sheetId, path){
  if(!isAdmin()){ say('악보 삭제는 관리자만 사용할 수 있습니다.'); return; }
  const { error } = await sb.from('sheets').delete().eq('id', sheetId);
  if(error){ say('삭제하지 못했습니다.\n' + friendlyError(error)); return; }
  // 한 장의 악보에 여러 곡이 걸려 있을 수 있다.
  // 다른 곡이 아직 이 파일을 쓰고 있으면 파일 자체는 지우지 않는다.
  const { data: still } = await sb.from('sheets').select('id').eq('storage_path', path).limit(1);
  if(!still || !still.length){
    await sb.storage.from('sheets').remove([path]);
    delete sheetUrlCache[path];
  }
  await loadAll(); render();
  say('악보를 삭제했습니다.');
}

/* ── 오류를 사람 말로 ───────────────────────────── */
function friendlyError(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if(/duplicate key|already exists/i.test(m)) return '같은 것이 이미 있습니다.';
  if(/row-level security|violates row-level/i.test(m)) return '저장 권한이 맞지 않습니다. 다시 로그인해도 계속되면 앱 권한 설정을 확인해야 합니다.';
  if(/foreign key/i.test(m)) return '다른 기록이 이걸 쓰고 있어 지울 수 없습니다.';
  if(/Invalid login credentials/i.test(m)) return '전화번호나 비밀번호가 맞지 않습니다.';
  // 전화번호 계정은 메일함이 없다. 이 오류가 나면 저장소 설정을 손봐야 한다
  // (Supabase → Authentication → Sign In / Providers → Email → Confirm email 끄기).
  if(/Email not confirmed/i.test(m)) return '아직 열리지 않은 계정입니다. 담임목사님께 알려 주세요.';
  if(/User already registered/i.test(m)) return '이미 비밀번호를 정한 번호입니다. 「로그인」으로 들어오세요.';
  if(/Password should be/i.test(m)) return '비밀번호는 숫자 여섯 자리입니다.';
  if(/rate limit|too many requests/i.test(m)) return '잠시 뒤에 다시 시도해 주세요.';
  if(/Failed to fetch|NetworkError/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  return m;
}

/* ── 로그인 ─────────────────────────────────────────────────────────
   통합 행정 앱과 같은 「전화번호 + 숫자 여섯 자리」만 사용합니다.
   전환 전 이메일 로그인은 2026-08-22 폐기했습니다. */
const SAVED_LOGIN_ID_KEY = 'masisneun-conti-saved-login-id-v1';
function readSavedLoginId(){
  try {
    const saved = JSON.parse(localStorage.getItem(SAVED_LOGIN_ID_KEY) || 'null');
    const phone = phonePretty(saved?.phone || '');
    return phoneAuthEmail(phone) ? phone : '';
  } catch(_){ return ''; }
}
function forgetSavedLoginId(){
  try { localStorage.removeItem(SAVED_LOGIN_ID_KEY); } catch(_){}
  authState.rememberId = false;
}
function syncSavedLoginId(){
  if(!authState.rememberId){ forgetSavedLoginId(); return; }
  const phone = phonePretty(authState.phone || '');
  if(!phoneAuthEmail(phone)) return;
  try { localStorage.setItem(SAVED_LOGIN_ID_KEY, JSON.stringify({version:1,phone})); } catch(_){}
}

let authState = { mode: 'in', phone: initiallySavedPhone, pin: '', pin2: '',

async function doAuth(){
  // 전화번호 + 여섯 자리
  const authEmail = phoneAuthEmail(authState.phone);
  if(!authEmail){ authState.msg = '010으로 시작하는 전화번호를 확인해 주세요.'; render(); return; }
  if(!isSixDigits(authState.pin)){ authState.msg = '비밀번호 숫자 여섯 자리를 넣어 주세요.'; render(); return; }
  if(authState.mode === 'up' && authState.pin !== authState.pin2){
    authState.msg = '여섯 자리가 서로 다릅니다. 다시 넣어 주세요.'; render(); return; }

  authState.busy = true; authState.msg = ''; render();
  const fn = authState.mode === 'in' ? 'signInWithPassword' : 'signUp';
  const { data, error } = await sb.auth[fn]({ email: authEmail, password: authState.pin });
  authState.busy = false;
  if(error){ authState.msg = friendlyError(error); render(); return; }
  if(authState.mode === 'up' && !data.session){
    authState.msg = '비밀번호를 정했습니다. 이제 로그인해 주세요.';
    authState.mode = 'in'; authState.pin = ''; authState.pin2 = ''; render(); return;
  }
  if(authState.mode === 'in') syncSavedLoginId();
  authState.pin = ''; authState.pin2 = '';
  // 로그아웃 전에 어느 화면을 보고 있었든 로그인 뒤에는 늘 홈에서 시작한다.
  // 특히 관리자가 설정에서 로그아웃한 뒤 인도자가 로그인했을 때 설정 주소가 남지 않게 한다.
  location.hash = '#/home';
  await boot();
}

async function signOut(){
  if(typeof ADMIN_LEADER_PREVIEW !== 'undefined') ADMIN_LEADER_PREVIEW=false;
  // 읽기 전용 미리보기에는 개인 계정이 없다. 로그아웃을 눌러도
  // 가짜 세션을 끊지 않고 홈으로 되돌려 로그인 화면에 갇히지 않게 한다.
  if(READ_ONLY_PREVIEW){
    location.hash = '#/home';
    await boot();
    return;
  }
  await sb.auth.signOut();
  AUTH_USER = null; ME = null;
  DATA = { leaders: [], services: [], songs: [], setlists: [] };
  location.hash = '';
  render();
}

/* 열쇠(로그인 표) 문제로 첫 판에 실패하는 일이 있다.
   Supabase 쪽 두 서버의 시계가 몇 초 어긋나면
   「JWT issued at future」가 나면서 자료를 못 읽는다.
   사람 손을 빌리지 말고 잠깐 기다렸다 스스로 다시 해 본다. */
async function loadAllRetry(tries = 3){
  let last;
  for(let i = 0; i < tries; i++){
    try { await loadAll(); return; }
    catch(e){
      last = e;
      const m = String((e && (e.message || e.error_description)) || e);
      const canRetry = /jwt|issued at future|token|fetch|network|timeout|502|503|504/i.test(m);
      if(!canRetry || i === tries - 1) throw e;
      // 열쇠 문제라면 열쇠를 새로 받아 본다
      if(/jwt|issued at future|token/i.test(m)){
        try { await sb.auth.refreshSession(); } catch(_){}
      }
      await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
  throw last;
}

/* ── 시작 ───────────────────────────────────────── */
async function boot(){
  TODAY = todayStr();
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ AUTH_USER = null; ME = null; render(); return; }
  AUTH_USER = session.user;
  try {
    await loadAllRetry();
  } catch(e){
    document.getElementById('app').innerHTML =
      `<div class="empty">자료를 불러오지 못했습니다.<br>
        <span class="sub">${esc(friendlyError(e))}</span><br><br>
        <button class="btn pri" onclick="location.reload()">다시 시도</button>
        <button class="btn" onclick="signOut()">로그아웃하고 다시 로그인</button></div>`;
    return;
  }
  ME = ALL_LEADERS.find(l => l.authUserId === AUTH_USER.id) || null;
  // 아직 명단과 연결되지 않았다면 내 이메일로 연결할 자리가 있는지 확인한다.
  // (인도자가 먼저 가입하고 관리자가 나중에 이메일을 등록한 경우를 구제한다)
  if(!ME){
    try {
      const { data } = await sb.rpc('claim_leader');
      if(data){ await loadAll(); ME = ALL_LEADERS.find(l => l.authUserId === AUTH_USER.id) || null; }
    } catch(e){ /* 함수가 아직 없으면 그냥 넘어간다 */ }
  }
  render();
  autoBackupIfDue();   // 담임목사가 열 때 7일에 한 번 조용히 백업
}


/* ── 날짜 도우미 ──────────────────────────────── */
const d2 = n => String(n).padStart(2, '0');
function daysBetween(a, b){            // a→b 며칠
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function agoDate(days){                 // 오늘로부터 days일 전 날짜문자
  const t = new Date(TODAY); t.setDate(t.getDate() - days);
  return `${t.getFullYear()}-${d2(t.getMonth()+1)}-${d2(t.getDate())}`;
}
const WD = ['일','월','화','수','목','금','토'];
function fmtDate(s){
  const [y,m,d] = s.split('-');
  return `${y}. ${+m}. ${+d}. (${WD[new Date(s).getDay()]})`;
}
function fmtShort(s){ const [y,m,d]=s.split('-'); return `${y.slice(2)}.${+m}.${+d}`; }
function elapsedText(days){
  if(days < 30) return `${days}일 전`;
  if(days < 365) return `${Math.floor(days/30)}개월 전`;
  const y = Math.floor(days/365), m = Math.floor((days%365)/30);
  return m ? `${y}년 ${m}개월 전` : `${y}년 전`;
}

/* ── 곡 등장 이력 색인 (모든 통계의 토대) ───────── */
// appear[songId] = [{date, serviceId, leaderId, key, order, setlistId, statsKey, next}]
const appear = {};
function buildAppearIndex(){
Object.keys(appear).forEach(k => delete appear[k]);
DATA.songs.forEach(s => appear[s.id] = []);
DATA.setlists.forEach(st => {
  const sorted = [...st.items].sort((a,b) => a.order - b.order);
  // 같은 날 같은 인도자가 같은 곡 순서로 1·2부를 모두 인도한 경우에도
  // 콘티 기록은 둘 다 보존하되 곡 통계에서는 한 번만 센다.
  // 곡 하나라도 다르거나 순서가 다르면 별개의 콘티로 센다.
  const statsKey = [st.date, st.leaderId, sorted.map(it => it.songId).join('>')].join('|');
  sorted.forEach((it, i) => {
    appear[it.songId].push({
      date: st.date, serviceId: st.serviceId, leaderId: st.leaderId,
      key: it.key, order: it.order, setlistId: st.id, statsKey,
      next: sorted[i+1] ? sorted[i+1].songId : null,
      siblings: sorted.filter(x => x.songId !== it.songId).map(x => x.songId),
    });
  });
});
Object.values(appear).forEach(a => a.sort((x,y) => x.date < y.date ? 1 : -1));
}

const F = {};   // 필터 통과 검사
function pass(ap, f){
  if(f.since && ap.date < f.since) return false;
  if(f.leaderId && ap.leaderId !== f.leaderId) return false;
  if(f.serviceId && ap.serviceId !== f.serviceId) return false;
  if(f.serviceIds && !f.serviceIds.includes(ap.serviceId)) return false;
  return true;
}
/** 과거 자료 보정: 기록은 콘티 목록에 그대로 두고 추천·통계에서만 제외한다.
    김한슬 전도사가 다시 인도하면 2026-08-25 이후 기록은 정상 집계한다. */
const STATS_EXCLUDED_LEADER_HISTORY = [
  {name:'김한슬', through:'2026-08-24'},
];
function isStatsExcludedAppearance(ap){
  const name = L[ap?.leaderId]?.name || '';
  return STATS_EXCLUDED_LEADER_HISTORY.some(rule =>
    name === rule.name && (!rule.through || String(ap?.date || '') <= rule.through));
}
/** 필터를 먼저 적용한 뒤 같은 날·인도자·곡순서가 같은 콘티를 한 번으로 묶는다.
    그래서 1부 통계와 2부 통계는 각각 1회지만, 둘을 합친 통계도 1회다. */
function statisticalAppearances(rows){
  const seen = new Set();
  return (rows || []).filter(ap => {
    if(isStatsExcludedAppearance(ap)) return false;
    const key = ap.statsKey || ap.setlistId;
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function songAppearances(songId, f = {}){
  return statisticalAppearances((appear[songId] || []).filter(ap => pass(ap, f)));
}
/** 곡 도서관의 기존곡은 등록 전에 최소 한 번은 불렀던 곡으로 본다.
    날짜·인도자·예배를 알 수 없는 과거 1회이므로 전체 누적에서만 보정한다.
    최근 1년, 특정 인도자, 특정 예배 통계에는 이 기준값을 섞지 않는다. */
function isWholeChurchLifetimeFilter(f = {}){
  return !f.since && !f.leaderId && !f.serviceId && !(f.serviceIds && f.serviceIds.length);
}
function minimumSongCount(actual, f = {}, songId = null){
  const hasRecordedHistory = !!(songId && (appear[songId] || []).length);
  return actual > 0 ? actual : (isWholeChurchLifetimeFilter(f) && !hasRecordedHistory ? 1 : 0);
}
function countSong(songId, f = {}){
  return minimumSongCount(songAppearances(songId, f).length, f, songId);
}
function lastSung(songId, f = {}){
  const a = songAppearances(songId, f);
  return a.length ? a[0].date : null;
}
/** 순위: 기간·인도자·예배로 걸러 많이 부른 순
    봉헌·축도처럼 매주 같은 자리에 들어가는 곡은 순위에서 뺀다 (f.all 이면 그대로 둔다).
    「추천·통계 제외」 곡은 어떤 집계에서도 항상 뺀다. */
function topSongs(f = {}, limit = 10){
  const c = {};
  DATA.songs.forEach(s => {
    if(isAllStatsSkip(s.id)) return;
    if(!f.all && isRankSkip(s.id)) return;
    if(!f.all && junkReason(s.title)) return;   // 제목이 깨진 곡은 순위에서 뺀다
    const n = countSong(s.id, f); if(n) c[s.id] = n; });
  return Object.entries(c).sort((a,b) => b[1]-a[1] || S[a[0]].title.localeCompare(S[b[0]].title))
    .slice(0, limit).map(([id,n]) => ({song:S[id], n}));
}
/** 이 곡 바로 뒤에 부른 곡 */
function nextSongs(songId, f = {}, limit = 8){
  if(isAllStatsSkip(songId)) return [];
  const c = {};
  songAppearances(songId, f).forEach(ap => {
    if(ap.next && S[ap.next] && !isAllStatsSkip(ap.next) && !junkReason(S[ap.next].title))
      c[ap.next] = (c[ap.next]||0) + 1;
  });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([id,n])=>({song:S[id],n}));
}
/** 이 곡과 같은 콘티에서 함께 부른 곡 */
function coSongs(songId, f = {}, limit = 8){
  if(isAllStatsSkip(songId)) return [];
  const c = {};
  songAppearances(songId, f).forEach(ap => {
    ap.siblings.forEach(sid => {
      if(S[sid] && !isAllStatsSkip(sid) && !junkReason(S[sid].title)) c[sid] = (c[sid]||0) + 1; });
  });
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([id,n])=>({song:S[id],n}));
}
/** 잊혀진 곡: 예전에 3회 이상 불렀지만 기준일보다 오래 안 부른 곡 */
const FORGOTTEN_MIN_TOTAL = 3;
function forgottenSongs(thresholdDays, serviceId = null){
  const cut = agoDate(thresholdDays);
  const serviceIds = Array.isArray(serviceId) ? serviceId : null;
  const out = [];
  DATA.songs.forEach(s => {
    if(junkReason(s.title)) return;               // 제목이 깨진 곡은 목록에서 뺀다
    if(isAllStatsSkip(s.id)) return;              // 모든 추천·통계에서 제외한 곡
    if(isForgetSkip(s.id)) return;                // 담임목사가 「추천에서 빼기」로 뺀 곡
    const all = statisticalAppearances(appear[s.id].filter(ap => !serviceId ||
      (serviceIds ? serviceIds.includes(ap.serviceId) : ap.serviceId === serviceId)));
    if(all.length < FORGOTTEN_MIN_TOTAL) return;  // 한두 번 시도한 곡은 「많이 불렀던 곡」이 아님
    const last = all[0].date;
    if(last >= cut) return;
    out.push({song:s, last, days:daysBetween(last, TODAY), total:all.length});
  });
  return out.sort((a,b) => b.total - a.total || b.days - a.days
    || a.song.title.localeCompare(b.song.title, 'ko'));
}
/** 같은 조성 곡 */
function sameKeySongs(songId, limit = 8){
  if(isAllStatsSkip(songId)) return [];
  const k = S[songId].key;
  return DATA.songs.filter(s => s.key === k && s.id !== songId && !isAllStatsSkip(s.id))
    .map(s => ({song:s, n:countSong(s.id)}))
    .sort((a,b) => b.n - a.n).slice(0, limit);
}

function curatedTopicsFor(song){
  if(!song) return [];
  const names=[song.title,...(song.aliases||[])].map(norm);
  for(const name of names){
    const tags=CURATED_SONG_TOPICS.get(name);
    if(tags) return [...tags];
  }
  return [];
}

function songTopicTags(song, limit=3){
  if(!song) return [];
  const curated=curatedTopicsFor(song);
  const stored=[...(song.autoTags||[]),...(song.manualTags||[])]
    .filter(tag=>tag && !NON_TOPIC_TAGS.has(tag));
  return [...new Set([...curated,...stored])].slice(0,limit);
}

  DATA.songs.forEach(song => {

    if(topics.length) song.autoTags=[...new Set([...topics,...(song.autoTags||[])])];
  });

function applyKnownSongAliases(){
  KNOWN_SONG_ALIASES.forEach(rule => {
    const wanted = [rule.title, ...rule.aliases].map(norm);
    const song = DATA.songs.find(item => [item.title, ...(item.aliases || [])]
      .some(value => wanted.includes(norm(value))));
    if(!song) return;
    const priorTitle = song.title;
    song.title = rule.title;
    song.aliases = [...new Set([...(song.aliases || []), priorTitle, ...rule.aliases])]
      .filter(value => value && norm(value) !== norm(rule.title));
  });
}
function buildNormIndex(){
  Object.keys(NORM_INDEX).forEach(k => delete NORM_INDEX[k]);
  DATA.songs.forEach(s => {
    [s.title, ...s.aliases].forEach(t => { if(t) NORM_INDEX[norm(t)] = s.id; });
  });
}
/** 콘티 붙여넣기에서 맨 뒤의 조성과 키업 흐름을 제목과 분리한다.
    예: "예배합니다 E-F" → 제목 "예배합니다", 그날 키 "E-F"
        "주가 나타내시네 Gm" → 제목 "주가 나타내시네", 그날 키 "Gm" */
function splitContiTitleKey(raw){
  const numbered = String(raw || '').trim().replace(/^\s*[\d]+[.)\-]\s*/, '');
  const hit = numbered.match(/\s+([A-G](?:b|#)?m?(?:\s*[-→>]\s*[A-G](?:b|#)?m?)*)$/);
  if(!hit) return {title:numbered, key:''};
  return {
    title:numbered.slice(0, hit.index).trim(),
    key:hit[1].replace(/\s*[-→>]\s*/g, '-'),
  };
}
function matchTitle(raw){
  const parsed = splitContiTitleKey(raw);
  const t = parsed.title;
  if(!t) return null;
  const hit = NORM_INDEX[norm(t)];
  return {raw:t, key:parsed.key, songId:hit || null};
}
/** 제목·별칭·아티스트·태그에 더해 「가사」까지 뒤진다.
    가사로 곡을 찾는 건 목사님 요구의 핵심이라 빠뜨리면 안 된다. */
function searchSongs(q){
  if(!q.trim()) return DATA.songs.filter(s => !obviousPlaceholderTitle(s.title));
  const n = norm(q);
  return DATA.songs.filter(s => !obviousPlaceholderTitle(s.title) && (
    norm(s.title).includes(n) ||
    s.aliases.some(a => norm(a).includes(n)) ||
    norm(s.artist||'').includes(n) ||
    norm(s.lyrics||'').includes(n) ||
    s.autoTags.concat(s.manualTags).some(t => norm(t).includes(n))
  ));
}
/** 검색어가 가사에서 걸렸는지 알려준다 (검색 결과에 「가사에서 찾음」을 붙이려고) */
function matchedInLyrics(s, q){
  if(!q || !q.trim() || !s.lyrics) return false;
  const n = norm(q);
  return norm(s.lyrics).includes(n) && !norm(s.title).includes(n)
    && !s.aliases.some(a => norm(a).includes(n));
}

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const keyBadge = (k, base) => !k ? '' : `<span class="key${base && k!==base ? ' alt':''}" title="${base&&k!==base?'원키 '+base+'와 다른 키로 불렀습니다':''}">${esc(k)}</span>`;
function statsSongKeys(songId, f={}){
  const counts = new Map();
  songAppearances(songId, f).forEach(ap => {
    String(ap.key || '').split(/\s*[-→>]\s*/).map(x=>x.trim()).filter(Boolean)
      .forEach(k => counts.set(k, (counts.get(k) || 0) + 1));
  });
  return [...counts.keys()].sort((a,b)=>(counts.get(b)-counts.get(a)) || a.localeCompare(b));
}
function statsSongMeta(song, f={}){
  if(!leaderInterface() || !song) return '';
  const keys = statsSongKeys(song.id, f);
  const topics = songTopicTags(song, 3);
  if(!keys.length && !topics.length) return '';
  return `<span class="stats-song-meta">
    ${keys.length ? `<span class="stats-meta-keys">${keys.map(k=>keyBadge(k)).join('')}</span>` : ''}
    ${topics.map(t=>`<span class="stats-topic">${esc(t)}</span>`).join('')}
  </span>`;
}

function peekToggle(boxId, sheets, emptyMsg, head){

  if(!box) return;
  if(box.dataset.on === '1'){ box.style.display = 'none'; box.dataset.on = '0'; return; }

      ? `<div class="mg-imgs" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">

  }

/** 제목 고침 — 같은 이름의 곡이 이미 있으면 합칠지 먼저 물어본다 */
async function savePeekTitle(id, tag){
  const eid = 'pkt_' + tag + '_' + id;
  const s = S[id];
  const el = document.getElementById(eid);
  const msg = document.getElementById('msg_' + eid);
  if(!s || !el) return;
  if(!isAdmin()){ say('제목은 담임목사만 고칠 수 있습니다.'); return; }
  const t = el.value.trim();
  if(!t){ say('제목을 넣어 주세요.'); return; }
  if(t === s.title){ say('바뀐 것이 없습니다.'); return; }
  const dupId = NORM_INDEX[norm(t)];
  if(dupId && dupId !== id){
    const d = S[dupId];
    if(msg) msg.innerHTML = `<div class="info" style="margin:0 0 9px">
      <b>「${esc(d.title)}」</b>라는 곡이 이미 있습니다 (${countSong(dupId)}회 ·
      악보 ${(d.sheets||[]).length}장).<br>
      같은 곡이라면 <b>합치기</b>를 누르세요. 이 곡의 부른 기록
      ${countSong(id)}회와 악보 ${(s.sheets||[]).length}장이 그리로 옮겨지고
      횟수가 하나로 합쳐집니다.
      <div class="row" style="margin-top:9px">
        <button class="btn sm pri" onclick="doPeekMerge('${dupId}','${id}')"
          >「${esc(d.title)}」에 합치기</button>
        <button class="btn sm" onclick="document.getElementById('msg_${eid}').innerHTML=''"
          >그만두기</button>
      </div></div>`;
    return;
  }
  if(msg) msg.innerHTML = '';
  await updateSong(id, { title: t });
  if(typeof junkForget === 'function'){ junkForget(id, t); render(); }
  // 화면이 새로 그려지면서 접히므로 다시 펴 준다
  if(tag === 'junk') junkPeek(id); else peekSong(id, tag);
  say(`제목을 「${esc(t)}」으로 고쳤습니다.`);
}

/** 곡 상세에 저장된 가사를 서식 없는 텍스트로 바로 복사한다. */
async function copySongLyrics(id){
  const s = S[id];
  const lyrics = String(s && s.lyrics || '').trim();
  if(!lyrics){ say('저장된 가사가 없습니다.'); return; }
  try {
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(lyrics);
    } else {
      const ta = document.createElement('textarea');
      ta.value = lyrics; ta.setAttribute('readonly','');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      if(!document.execCommand('copy')) throw new Error('복사 명령을 지원하지 않습니다');
      ta.remove();
    }
    say(`「${s.title}」 가사를 복사했습니다.`);
  } catch(e){
    say('자동 복사를 지원하지 않는 브라우저입니다.\n가사 칸을 길게 눌러 복사해 주세요.');
  }
}

/* 한 곡에 악보가 키별로 여러 장 달립니다. 곡을 쪼개지 않습니다.
   (곡을 「은혜(G)」「은혜(A)」로 나누면 각각 10회가 되어 20회 부른 곡이 순위에서 사라집니다.) */
const shownSheet = {};      // 지금 어느 키 악보를 보고 있는지 (곡별)
/** 그날 부른 키에 맞는 악보를 고른다. 없으면 원키 악보를 띄우고 그 사실을 밝힌다. */
function pickSheet(song, sungKey){
  const list = song.sheets || [];
  if(!list.length) return {sheet:null, exact:false};
  const origin = list.find(x=>x.origin) || list[0];
  const want = shownSheet[song.id] || sungKey;
  if(!want) return {sheet:origin, exact:true};
  const hit = list.find(sh=>sh.key===want);
  return hit ? {sheet:hit, exact:true} : {sheet:origin, exact:false};
}
function pickSheetKey(songId, key){ shownSheet[songId] = key; render(); }

/** 콘티에서 여러 곡이 같은 악보 한 장을 함께 쓰는 경우,
    그 한 장을 한 번만 보여주고 어떤 곡들이 담겼는지 위에 적는다.
    (콘티 악보는 보통 한 장에 여러 곡이 나란히 인쇄돼 있다) */
function groupSheets(items){
  const groups = [];
  items.forEach(it => {
    const song = S[it.songId];
    if(!song) return;
    const { sheet } = pickSheet(song, it.key);
    const path = sheet ? sheet.path : null;
    const last = groups[groups.length - 1];
    if(last && path && last.path === path){ last.items.push({ it, song, sheet }); }
    else groups.push({ path, sheet, items: [{ it, song, sheet }] });
  });
  return groups;
}

function sheetGroupBlock(group){
  if(group.items.length === 1){
    const { it, song } = group.items[0];
    return sheetBlock(it.order, song, it.key);
  }
  // 여러 곡이 한 장을 공유하는 경우

/** 이 곡에 자료가 마지막으로 추가된 시각 (곡 등록 또는 악보 등록 중 더 나중) */
function songAddedAt(s){
  let t = s.createdAt || '';
  (s.sheets || []).forEach(sh => { if((sh.createdAt || '') > t) t = sh.createdAt; });
  return t;
}

/** 지금 여러 곡이 한 장을 함께 쓰고 있는 악보 경로 → 곡 수 */
function sharedPathMap(){
  const c = {};
  DATA.songs.forEach(s => (s.sheets || []).forEach(sh => {
    if(sh.path) c[sh.path] = (c[sh.path] || 0) + 1;
  }));
  return c;
}

/** 이 곡의 악보 중 아직 여러 곡이 함께 쓰고 있는 것 */
function needsCut(s, map){
  // ① 여러 곡이 한 장을 함께 쓰고 있는 경우
  const shared = (s.sheets || []).find(sh => (map[sh.path] || 0) > 1);
  if(shared) return shared;
  // ② 제목이 깨진 곡이 혼자 들고 있는 악보 — 콘티 한 장을 통째로 올린 것이라
  //    사실상 여러 곡이 들어 있다. 이것도 나눠야 할 악보로 본다.
  if(junkReason(s.title) && (s.sheets || []).length) return s.sheets[0];
  return null;
}

/** 콘티의 찬양 흐름 — 「꽃들도 (G) → 내 영혼이 은총 입어 (G)」 형태.
    그날 부른 조성을 함께 보여 준다. 기록이 없으면 곡의 원키를 쓴다. */
function flowText(items){
  return [...items].sort((a, b) => a.order - b.order).map(i => {
    const s = S[i.songId];
    if(!s) return '';
    const k = i.key || s.key || '';
    return esc(s.title) + (k ? ` <span class="fk">${esc(k)}</span>` : '');
  }).filter(Boolean).join(' <span class="fa">→</span> ');
}

/** 이 악보 파일을 함께 쓰고 있는 곡들 — 악보에 실린 순서대로 */
function sheetSharedBy(path){
  if(!path) return [];
  const out = [];
  DATA.songs.forEach(s => (s.sheets || []).forEach(sh => {
    if(sh.path !== path) return;
    const m = String(sh.note || '').match(/\((\d+)\s*\/\s*\d+\)/);
    out.push({ song: s, sheet: sh, pos: m ? +m[1] : 9999 });
  }));
  return out.sort((a, b) => a.pos - b.pos);
}

/** 가사에서 주제 태그를 뽑는다. 많이 걸린 순으로 최대 6개. */
function autoTagsFor(lyrics){
  if(!lyrics || !lyrics.trim()) return [];
  const t = lyrics.replace(/\s+/g, ' ');
  const hits = [];
  TAG_RULES.forEach(([tag, words]) => {
    let n = 0;
    words.forEach(w => {
      const clean = w.trim();
      if(!clean) return;
      let i = 0;
      while((i = t.indexOf(clean, i)) !== -1){ n++; i += clean.length; }
    });
    if(n) hits.push({ tag, n });
  });
  return hits.sort((a, b) => b.n - a.n).slice(0, 6).map(h => h.tag);
}

/** 한 곡의 자동 태그를 가사에서 다시 뽑아 저장한다 */
async function retagSong(id, quiet){
  const s = S[id];
  if(!s) return 0;
  if(!s.lyrics || !s.lyrics.trim()){
    if(!quiet) say('가사가 등록되지 않아 태그를 부여할 수 없습니다.\n가사를 먼저 입력해 주세요.');
    return 0;
  }
  const tags = autoTagsFor(s.lyrics);
  const { error } = await sb.from('songs').update({ auto_tags: tags }).eq('id', id);
  if(error){ if(!quiet) say('태그를 저장하지 못했습니다.\n' + friendlyError(error)); return 0; }
  if(!quiet){
    await loadAll(); render();
    say(tags.length ? `주제 태그 ${tags.length}개를 부여했습니다 — ${tags.join(' · ')}`
                    : '가사에서 주제를 찾지 못했습니다. 직접 입력해 주세요.');
  }
  return tags.length;
}

/** 가사가 있는 곡 전부를 한 번에 다시 태그한다 (담임목사) */
async function retagAll(){
  if(!isAdmin()){ say('전체 태그 작업은 관리자만 사용할 수 있습니다.'); return; }
  const targets = DATA.songs.filter(s => s.lyrics && s.lyrics.trim());
  if(!targets.length){ say('가사가 등록된 곡이 없습니다.'); return; }
  say(`${targets.length}곡의 가사를 분석하는 중입니다…`);
  let done = 0;
  for(const s of targets){ done += (await retagSong(s.id, true)) ? 1 : 0; }
  await loadAll(); render();
  say(`곡 ${targets.length}개를 분석해 ${done}곡에 주제 태그를 부여했습니다.`);
}

/* ── 곡 합치기 ──────────────────────────────────── */
let mergeState = { keepId: null, dropId: null, step: 0 };

/** 띄어쓰기·기호를 지웠을 때 같아지거나 아주 비슷한 곡 쌍을 찾는다 */
function duplicateCandidates(){
  const out = [], seen = {};
  // 사진에서 잘못 읽힌 제목끼리는 「2 2026 02 08 …」 처럼 서로 닮아 자꾸 짝으로 잡힌다.
  // 그것들은 「잘못 등록된 곡 정리」가 다루는 몫이므로 여기서는 아예 뺀다.
  const songs = DATA.songs.filter(s => !junkReason(s.title));
  songs.forEach(s => {
    const k = norm(s.title);
    if(seen[k] && seen[k] !== s.id){ out.push([S[seen[k]], s]); }
    else seen[k] = s.id;
  });
  // 앞 6글자가 같은 경우도 후보로 (한쪽이 부제를 달고 있는 경우)
  const byHead = {};
  songs.forEach(s => {
    const h = norm(s.title).slice(0, 6);
    if(h.length < 4) return;
    (byHead[h] = byHead[h] || []).push(s);
  });
  Object.values(byHead).forEach(list => {
    if(list.length < 2) return;
    for(let i = 0; i < list.length - 1; i++){
      for(let j = i + 1; j < list.length; j++){
        if(norm(list[i].title) === norm(list[j].title)) continue;
        if(out.some(([a, b]) => (a.id === list[i].id && b.id === list[j].id)
                             || (a.id === list[j].id && b.id === list[i].id))) continue;
        out.push([list[i], list[j]]);
      }
    }
  });
  return out.slice(0, 20);
}

function openMerge(keepId, dropId){

/** 합치기 창에 두 곡의 악보를 나란히 띄운다 — 눈으로 보고 판단하도록 */

function closeMerge(){ mergeState = { keepId: null, dropId: null, step: 0 }; render(); }

/* ── 가사 자동 인식 (OCR) ────────────────────────
   한글 악보는 음표·코드기호가 섞여 있어 인식 결과에 오타가 포함된다.
   인식 결과는 반드시 사람이 확인·수정한 뒤 저장하도록 만든다. */
let ocrState = { busy: false, progress: 0, songId: null, text: '' };

async function runOcr(songId){
  const s = S[songId];
  if(!s || !s.sheets.length){ say('악보를 먼저 등록해 주세요.'); return; }
  const sheet = s.sheets.find(x => x.fileType === 'image') || s.sheets[0];
  if(sheet.fileType === 'pdf'){
    say('PDF 악보는 가사 인식을 지원하지 않습니다.\n사진(JPG·PNG) 형식의 악보를 등록해 주세요.');
    return;
  }
  ocrState = { busy: true, progress: 0, songId, text: '' };
  render();
  try {
    if(!window.safeScoreTitleOcr) throw new Error('내장 OCR 모듈이 없습니다');
    await window.safeScoreTitleOcr.loadTesseract();
    const url = await getSheetUrl(sheet.path);
    if(!url) throw new Error('악보를 불러오지 못했습니다');
    const res = await window.Tesseract.recognize(url, 'kor', {
      ...window.safeScoreTitleOcr.tesseractRuntimePaths(),
      logger: m => {
        if(m.status === 'recognizing text'){
          ocrState.progress = Math.round(m.progress * 100);
          const el = document.getElementById('ocrPct');
          if(el) el.textContent = ocrState.progress + '%';
        }
      },
    });
    ocrState.text = cleanOcrText(res.data.text || '');
    ocrState.busy = false;
    render();
  } catch(e){
    ocrState = { busy: false, progress: 0, songId: null, text: '' };
    render();
    say('가사를 인식하지 못했습니다.\n' + friendlyError(e)
      + '\n\n곡 상세 화면에서 가사를 직접 입력할 수도 있습니다.');
  }
}

/** OCR 결과에서 음표·코드기호처럼 가사가 아닌 것을 걸러낸다 */
function cleanOcrText(raw){
  return raw.split('\n')
    .map(l => l.replace(/[|｜]/g, ' ').replace(/\s{2,}/g, ' ').trim())
    // 한글이 두 글자 미만인 줄은 코드·마디번호일 가능성이 크다
    .filter(l => (l.match(/[가-힣]/g) || []).length >= 2)
    .filter(l => !/^[A-G][#b]?(m|maj|min|sus|dim|aug|\d)*(\s+[A-G][#b]?\S*)*$/.test(l))
    .join('\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
