/* ══════════════════════════════════════════════════════════════════
   연습 도구 — 유튜브 연습 영상 · 구간 반복 · 재생 속도 · 메트로놈

   인도자들이 집에서 연습할 때 쓰는 자리입니다.
   곡마다 유튜브 영상 하나와 빠르기(BPM)를 적어 두면,
   앱 안에서 바로 듣고, 어려운 구간만 반복하고, 느리게 돌려 볼 수 있습니다.

   이 화면은 절대로 render() 를 부르지 않습니다.
   화면을 다시 그리면 영상이 처음부터 다시 시작되기 때문입니다.
   ══════════════════════════════════════════════════════════════════ */

/** songs 표에 연습 칸(youtube_url·bpm)이 만들어져 있는가 */
let PRACTICE_OK = false;
/** songs 표에 곡 흐름 칸(song_form)이 만들어져 있는가 — 연습 칸보다 나중에 생겼다 */
let FORM_OK = false;

/* ── 유튜브 주소에서 영상 번호만 꺼낸다 ───────────── */
function ytVideoId(url){
  const s = String(url || '').trim();
  if(!s) return '';
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

function mmss(sec){
  const t = Math.max(0, Math.round(sec || 0));
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
}
function parseMmss(v){
  const s = String(v || '').trim();
  if(!s) return null;
  if(/^\d+$/.test(s)) return +s;
  const m = s.match(/^(\d+)\s*[:분]\s*(\d{1,2})/);
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}

/* ── 유튜브 재생기 ───────────────────────────────── */
let ytPlayer = null;
let yt = { songId: null, a: null, b: null, loop: false, rate: 1, timer: null, ready: false };

/* 외부 실행 스크립트를 앱 권한으로 불러오지 않는다. YouTube 영상은
   youtube-nocookie iframe 안에서만 실행하고 postMessage로 제어한다. */
function makeYTFrame(box, videoId){
  const iframe = document.createElement('iframe');
  iframe.id = 'ytHere';
  iframe.title = '유튜브 연습 영상';
  iframe.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}?enablejsapi=1&playsinline=1&rel=0`;
  iframe.style.cssText = 'border:0;width:100%;height:100%';
  box.replaceChildren(iframe);

  const state = { currentTime:0, duration:0, playerState:-1, playbackRate:1 };
  const send = (func, args=[]) => {
    try { iframe.contentWindow?.postMessage(JSON.stringify({event:'command',func,args}), 'https://www.youtube-nocookie.com'); } catch(_){}
  };
  const onMessage = event => {
    if(event.source !== iframe.contentWindow || event.origin !== 'https://www.youtube-nocookie.com') return;
    let data = event.data;
    try { if(typeof data === 'string') data = JSON.parse(data); } catch(_){ return; }
    if(data?.event === 'infoDelivery' && data.info){
      for(const key of ['currentTime','duration','playerState','playbackRate']) if(Number.isFinite(data.info[key])) state[key] = data.info[key];
      paintYTBar();
    }
  };
  window.addEventListener('message', onMessage);
  const player = {
    iframe,
    destroy(){ window.removeEventListener('message', onMessage); iframe.remove(); },
    getCurrentTime(){ return state.currentTime; },
    getDuration(){ return state.duration; },
    getPlayerState(){ return state.playerState; },
    seekTo(t){ state.currentTime=Math.max(0,+t||0); send('seekTo',[state.currentTime,true]); },
    playVideo(){ state.playerState=1; send('playVideo'); },
    pauseVideo(){ state.playerState=2; send('pauseVideo'); },
    setPlaybackRate(r){ state.playbackRate=+r||1; send('setPlaybackRate',[state.playbackRate]); },
  };
  iframe.addEventListener('load', () => {
    yt.ready = true;
    send('addEventListener',['onStateChange']);
    send('addEventListener',['onReady']);
    send('getCurrentTime');
    send('getDuration');
    ytTick();
    paintYTBar();
  }, {once:true});
  return player;
}

function ytNote(msg){
  const el = document.getElementById('ytNote');
  if(el) el.innerHTML = msg;
}

/** 곡 화면에서 「연습 영상 열기」를 눌렀을 때 */
async function openYT(songId){
  const s = S[songId];
  if(!s) return;
  const vid = ytVideoId(s.youtube || '');
  if(!vid){ say('먼저 유튜브 주소를 넣어 주세요.'); return; }
  const box = document.getElementById('ytFrame');
  if(!box) return;
  closeYT(true);
  yt = { songId, a: null, b: null, loop: false, rate: 1, timer: null, ready: false };
  box.innerHTML = `<div class="sub" style="padding:20px">영상을 불러오는 중입니다…</div>`;
  ytPlayer = makeYTFrame(box, vid);
  clearInterval(yt.timer);
  yt.timer = setInterval(ytTick, 250);
  paintYTBar();
}

function closeYT(quiet){
  clearInterval(yt.timer);
  yt.timer = null;
  try { if(ytPlayer && ytPlayer.destroy) ytPlayer.destroy(); } catch(_){}
  ytPlayer = null;
  yt.ready = false;
  const box = document.getElementById('ytFrame');
  if(box && !quiet) box.innerHTML = '';
  if(!quiet) paintYTBar();
}

function ytNow(){
  try { return ytPlayer && ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0; }
  catch(_){ return 0; }
}
function ytSeek(t){ try { ytPlayer.seekTo(Math.max(0, t), true); } catch(_){} }

/** 0.25초마다 — 구간 반복을 지키고 시계를 갱신한다 */
function ytTick(){
  if(!ytPlayer || !yt.ready) return;
  const t = ytNow();
  if(yt.loop && yt.a != null && yt.b != null && yt.b > yt.a && t > yt.b) ytSeek(yt.a);
  const el = document.getElementById('ytClock');
  if(el) el.textContent = mmss(t);
}

function ytMark(which){
  if(!ytPlayer || !yt.ready){ say('영상을 먼저 열어 주세요.'); return; }
  const t = Math.round(ytNow());
  if(which === 'a'){ yt.a = t; if(yt.b != null && yt.b <= t) yt.b = null; }
  else { if(yt.a == null){ say('시작점(A)을 먼저 찍어 주세요.'); return; } yt.b = t; }
  if(yt.a != null && yt.b != null) yt.loop = true;
  paintYTBar();
  if(yt.loop) ytSeek(yt.a);
}
function ytClearLoop(){ yt.a = yt.b = null; yt.loop = false; paintYTBar(); }
function ytToggleLoop(){
  if(yt.a == null || yt.b == null){ say('먼저 A와 B를 찍어 주세요.'); return; }
  yt.loop = !yt.loop; paintYTBar();
  if(yt.loop) ytSeek(yt.a);
}
function ytStep(sec){ if(yt.ready) ytSeek(ytNow() + sec); }
function ytPlayPause(){
  if(!ytPlayer || !yt.ready) return;
  try {
    const st = ytPlayer.getPlayerState();
    if(st === 1) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
  } catch(_){}
  setTimeout(paintYTBar, 200);
}
function ytSetRate(r){
  yt.rate = r;
  try { if(ytPlayer && ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(r); } catch(_){}
  paintYTBar();
}

const YT_RATES = [0.5, 0.75, 1, 1.25, 1.5];

/** 재생기 아래 조작줄 — render() 없이 이 자리만 다시 그린다 */
function paintYTBar(){
  const el = document.getElementById('ytBar');
  if(!el) return;
  if(!ytPlayer){ el.innerHTML = ''; return; }
  let playing = false;
  try { playing = ytPlayer.getPlayerState && ytPlayer.getPlayerState() === 1; } catch(_){}
  el.innerHTML = `
    <div class="row" style="margin-top:10px">
      <button class="btn sm pri" onclick="ytPlayPause()">${playing ? '❚❚ 멈춤' : '▶ 재생'}</button>
      <button class="btn sm" onclick="ytStep(-5)">◀ 5초</button>
      <button class="btn sm" onclick="ytStep(5)">5초 ▶</button>
      <span class="sub" style="min-width:52px">지금 <b id="ytClock">${mmss(ytNow())}</b></span>
      <div class="spacer"></div>
      <button class="btn sm" onclick="closeYT()">영상 닫기</button>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="sub" style="font-weight:650">어려운 구간만 반복</span>
      <button class="btn sm ${yt.a != null ? 'gold' : ''}" onclick="ytMark('a')"
        >A ${yt.a != null ? mmss(yt.a) : '찍기'}</button>
      <button class="btn sm ${yt.b != null ? 'gold' : ''}" onclick="ytMark('b')"
        >B ${yt.b != null ? mmss(yt.b) : '찍기'}</button>
      <button class="btn sm ${yt.loop ? 'pri' : ''}" onclick="ytToggleLoop()"
        >${yt.loop ? '반복 중 ✓' : '반복'}</button>
      ${(yt.a != null || yt.b != null) ? `<button class="btn sm" onclick="ytClearLoop()">지우기</button>` : ''}
    </div>
    <div class="row" style="margin-top:8px">
      <span class="sub" style="font-weight:650">천천히 듣기</span>
      ${YT_RATES.map(r => `<button class="btn sm ${yt.rate === r ? 'pri' : ''}"
        onclick="ytSetRate(${r})">${r}배</button>`).join('')}
    </div>
    <div class="hint" style="margin-top:8px">
      어려운 곳이 나오면 <b>A 찍기</b> → 조금 뒤 <b>B 찍기</b>.
      그 사이만 계속 돌아갑니다. 손이 안 따라가면 <b>0.75배</b>로 늦춰 보세요.
    </div>`;
}

/* ── 곡 흐름 — 인트로·1절·후렴이 몇 분부터인가 ─────
   한 사람이 한 번 찍어 두면 인도자 여섯 명이 그대로 씁니다.
   구간을 누르면 그 자리로 건너뛰고, 「되풀이」는 다음 구간 앞까지만 돕니다.
   이 자리도 render() 를 부르지 않습니다 — 영상이 처음부터 다시 시작되기 때문입니다. */

const FORM_NAMES = ['인트로', '1절', '2절', '후렴', '브릿지', '간주', '엔딩'];

function formMissingMsg(){
  return '곡 흐름을 기억해 두려면 저장소에 칸을 한 번 만들어야 합니다.\n'
       + '설정 화면 맨 아래 안내를 봐 주세요.';
}

/** 이 곡의 영상이 지금 열려 있는가 */
function formLive(s){
  return !!(ytPlayer && yt.ready && yt.songId === s.id);
}

/** 저장한다. 곡은 앞에서 뒤로 흐르므로 시간 순서대로 세워 둔다. */
async function saveForm(songId){
  const s = S[songId];
  if(!s) return;
  if(!FORM_OK){ say(formMissingMsg()); return; }
  s.form = (s.form || []).slice().sort((a, b) => (+a.t || 0) - (+b.t || 0));
  const { error } = await sb.from('songs').update({ song_form: s.form }).eq('id', songId);
  if(error){ say('저장하지 못했습니다.\n' + friendlyError(error)); return; }
  paintForm();
}

/** 지금 듣고 있는 자리를 새 구간으로 찍는다 */
function formAdd(songId, name){
  const s = S[songId];
  if(!s) return;
  if(!FORM_OK){ say(formMissingMsg()); return; }
  const t = formLive(s) ? Math.round(ytNow()) : 0;
  s.form = (s.form || []).concat([{ n: name || '구간', t }]);
  saveForm(songId);
}

function formSetName(songId, i, v){
  const s = S[songId];
  if(!s || !s.form || !s.form[i]) return;
  s.form[i].n = String(v || '').trim() || '구간';
  saveForm(songId);
}

function formSetTime(songId, i, v){
  const s = S[songId];
  if(!s || !s.form || !s.form[i]) return;
  const t = parseMmss(v);
  if(t == null){ say('시간은 1:23 처럼 적어 주세요.'); paintForm(); return; }
  s.form[i].t = t;
  saveForm(songId);
}

function formDel(songId, i){
  const s = S[songId];
  if(!s || !s.form || !s.form[i]) return;
  s.form = s.form.filter((_, k) => k !== i);
  saveForm(songId);
}

/** 그 구간부터 듣는다 */
function formGo(songId, i){
  const s = S[songId];
  if(!s || !s.form || !s.form[i]) return;
  if(!formLive(s)){ say('먼저 「연습 영상 열기」를 눌러 주세요.'); return; }
  ytClearLoop();
  ytSeek(+s.form[i].t || 0);
  try { ytPlayer.playVideo(); } catch(_){}
  paintForm();
}

/** 그 구간만 되풀이해서 듣는다 — 다음 구간 앞까지 */
function formLoop(songId, i){
  const s = S[songId];
  if(!s || !s.form || !s.form[i]) return;
  if(!formLive(s)){ say('먼저 「연습 영상 열기」를 눌러 주세요.'); return; }
  const a = +s.form[i].t || 0;
  const next = s.form[i + 1];
  let b = next ? (+next.t || 0) : 0;
  if(!next || b <= a){
    // 마지막 구간은 영상 끝까지. 길이를 못 읽으면 30초만 잡는다.
    let dur = 0;
    try { dur = ytPlayer.getDuration ? ytPlayer.getDuration() : 0; } catch(_){}
    b = dur > a + 1 ? Math.round(dur) : a + 30;
  }
  yt.a = a; yt.b = b; yt.loop = true;
  ytSeek(a);
  try { ytPlayer.playVideo(); } catch(_){}
  paintYTBar();
  paintForm();
}

function formRowHtml(s, p, i){
  const t = +p.t || 0;
  const looping = formLive(s) && yt.loop && yt.a === t;
  return `
    <div class="row form-row">
      <button class="btn sm ${looping ? 'pri' : ''}" onclick="formGo('${s.id}',${i})"
        style="min-width:78px">▶ ${mmss(t)}</button>
      <input class="inp" style="width:126px" value="${esc(p.n || '')}"
        ${FORM_OK ? '' : 'disabled'} onchange="formSetName('${s.id}',${i},this.value)">
      <input class="inp" style="width:78px;text-align:center" value="${mmss(t)}"
        ${FORM_OK ? '' : 'disabled'} onchange="formSetTime('${s.id}',${i},this.value)">

let metro = { on: false, bpm: 90, beat: 4, ctx: null, next: 0, i: 0, timer: null, taps: [] };

function metroCtx(){
  if(!metro.ctx){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    metro.ctx = new C();
  }
  if(metro.ctx.state === 'suspended') metro.ctx.resume();
  return metro.ctx;
}
function metroClick(at, strong){
  const c = metro.ctx;
  const o = c.createOscillator(), g = c.createGain();
  o.frequency.value = strong ? 1600 : 1050;
  g.gain.setValueAtTime(strong ? 0.5 : 0.28, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
  o.connect(g); g.connect(c.destination);
  o.start(at); o.stop(at + 0.06);
}
function metroSchedule(){
  const c = metro.ctx;
  if(!c) return;
  const spb = 60 / metro.bpm;
  while(metro.next < c.currentTime + 0.15){
    metroClick(metro.next, metro.i % metro.beat === 0);
    const el = document.getElementById('metroDot');
    if(el) setTimeout(() => { el.textContent = (metro.i % metro.beat) + 1; },
      Math.max(0, (metro.next - c.currentTime) * 1000));
    metro.next += spb;
    metro.i++;
  }
}
function metroStart(){
  const c = metroCtx();
  if(!c){ say('이 브라우저에서는 메트로놈을 쓸 수 없습니다.'); return; }
  metro.on = true; metro.i = 0; metro.next = c.currentTime + 0.1;
  clearInterval(metro.timer);
  metro.timer = setInterval(metroSchedule, 25);
  paintMetro();
}
function metroStop(){
  metro.on = false;
  clearInterval(metro.timer); metro.timer = null;
  paintMetro();
}
function metroToggle(){ metro.on ? metroStop() : metroStart(); }
function metroSet(bpm){
  metro.bpm = Math.min(240, Math.max(30, Math.round(bpm || 0) || 90));
  if(metro.on){ metro.i = 0; metro.next = metro.ctx.currentTime + 0.05; }
  paintMetro();
}
function metroBeat(n){ metro.beat = n; metro.i = 0; paintMetro(); }
function metroTap(){
  const now = Date.now();
  metro.taps = metro.taps.filter(t => now - t < 3000).slice(-7);
  metro.taps.push(now);
  // 한 번 삐끗해도 흔들리지 않도록 가운뎃값을 쓴다
  const gaps = [];
  for(let i = 1; i < metro.taps.length; i++){
    const g = metro.taps[i] - metro.taps[i-1];
    if(g >= 200 && g <= 2000) gaps.push(g);
  }
  if(gaps.length){
    gaps.sort((a, b) => a - b);
    metroSet(60000 / gaps[Math.floor(gaps.length / 2)]);
  } else paintMetro();
}

function paintMetro(){
  const el = document.getElementById('metroBox');
  if(!el) return;
  el.innerHTML = `
    <div class="row">
      <button class="btn ${metro.on ? 'pri' : ''}" onclick="metroToggle()" style="min-width:104px"
        >${metro.on ? '■ 멈추기' : '▶ 메트로놈'}</button>
      <span class="key" id="metroDot" style="min-width:34px;font-size:15px">${metro.on ? '1' : '·'}</span>
      <button class="btn sm" onclick="metroSet(metro.bpm-5)">−5</button>
      <input class="inp" id="metroBpm" style="width:82px;text-align:center;font-weight:700"
        value="${metro.bpm}" inputmode="numeric"
        onchange="metroSet(+this.value)">
      <button class="btn sm" onclick="metroSet(metro.bpm+5)">＋5</button>
      <span class="sub">BPM</span>
      <button class="btn sm" onclick="metroTap()">눌러서 빠르기 맞추기</button>
      <div class="spacer"></div>
      <div class="seg">${[4,3,6,2].map(n => `<button class="${metro.beat===n?'on':''}"
        onclick="metroBeat(${n})">${n===6?'6/8':n+'/4'}</button>`).join('')}</div>
    </div>`;
}

/* ══════════════════════════════════════════════════════════════════
   콘티 원장 — 날짜·예배·인도자·곡·조성을 한 줄씩 쭉 적은 기록

   「언제 무슨 예배에서 누가 인도했고 무슨 곡을 무슨 키로 불렀는가」를
   표 하나로 볼 수 있게 합니다. 파일로 받아 두면 언제든 대조할 수 있고,
   저장소에 문제가 생겨도 이 표가 남습니다.

   더불어 「빠진 것」을 짚어 줍니다.
     · 조성이 안 적힌 곡        · 곡이 한두 개뿐인 콘티(일부만 남은 것)
     · 인도자가 비어 있는 콘티  · 제목이 곡 이름 같지 않은 곡
   ══════════════════════════════════════════════════════════════════ */

/** 원장 한 줄 = 그날 그 예배의 곡 하나 */
function ledgerRows(){
  const out = [];
  [...DATA.setlists].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0)
    .forEach(st => {
      const 예배 = (SV[st.serviceId] || {}).name || '';
      const 인도자 = (L[st.leaderId] || {}).name || '';
      const items = [...st.items].sort((a, b) => a.order - b.order);
      if(!items.length){
        out.push({ 날짜: st.date, 예배, 인도자, 순서: '', 곡: '(곡이 없음)', 조성: '', 원키: '' });
        return;
      }
      items.forEach(i => {
        const s = S[i.songId];
        out.push({ 날짜: st.date, 예배, 인도자, 순서: i.order,
                   곡: s ? s.title : '(지워진 곡)',
                   조성: i.key || '', 원키: s ? (s.key || '') : '' });
      });
    });
  return out;
}

/** 손봐야 할 곳을 모은다 */
function ledgerIssues(){
  const 조성없음 = [], 곡적음 = [], 인도자없음 = [], 제목이상 = [];
  DATA.setlists.forEach(st => {
    const 예배 = (SV[st.serviceId] || {}).name || '';
    const 이름 = fmtShort(st.date) + ' ' + 예배;
    if(!st.leaderId || !L[st.leaderId]) 인도자없음.push({ id: st.id, 이름 });
    if(st.items.length <= 2) 곡적음.push({ id: st.id, 이름, n: st.items.length });
    st.items.forEach(i => {
      const s = S[i.songId];
      if(!i.key && !(s && s.key)) 조성없음.push({ id: st.id, 이름, 곡: s ? s.title : '(지워진 곡)' });
    });
  });
  DATA.songs.forEach(s => { if(junkReason(s.title)) 제목이상.push({ id: s.id, 제목: s.title }); });
  return { 조성없음, 곡적음, 인도자없음, 제목이상 };
}

/** 엑셀에서 바로 열리도록 BOM 을 붙인 CSV 로 내려받는다 */
function downloadLedger(){
  const rows = ledgerRows();
  const 머리 = ['날짜', '예배', '인도자', '순서', '곡', '부른 키', '원키'];
  const 칸 = v => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const 글 = '﻿' + [머리.join(',')].concat(
    rows.map(r => [r.날짜, r.예배, r.인도자, r.순서, r.곡, r.조성, r.원키].map(칸).join(','))
  ).join('\r\n');
  const blob = new Blob([글], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `콘티원장_${TODAY}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  say(`콘티 원장을 내려받았습니다.\n${rows.length}줄 · 콘티 ${DATA.setlists.length}개\n엑셀에서 바로 열립니다.`);
}

  return `

/**

const DEFAULTS = Object.freeze({ maxAnalysisSide:1000, darkThreshold:210, redMin:105, redDelta:45, maxCandidates:8 });
const clamp=(v,lo=0,hi=1)=>Math.max(lo,Math.min(hi,v));
const mean=(a,s=0,e=a.length)=>{let t=0,n=Math.max(0,e-s);for(let i=s;i<e;i++)t+=a[i];return n?t/n:0};

function mergeRuns(items,maxGap){const out=[];for(const item of items){const p=out.at(-1);if(p&&item.start-p.end<=maxGap){p.end=item.end;p.width=p.end-p.start}else out.push({...item})}return out}

function buildVisualMap(imageData,options={}){

  const step=Math.max(1,Math.ceil(Math.max(width,height)/cfg.maxAnalysisSide)),w=Math.ceil(width/step),h=Math.ceil(height/step);
  const darkRows=new Float64Array(h),darkCols=new Float64Array(w),redRows=new Float64Array(h),redCols=new Float64Array(w),darkMask=new Uint8Array(w*h),redMask=new Uint8Array(w*h);
  for(let sy=0,y=0;sy<height;sy+=step,y++)for(let sx=0,x=0;sx<width;sx+=step,x++){
    const i=(sy*width+sx)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];if(a<32)continue;
    if(r*.299+g*.587+b*.114<cfg.darkThreshold){darkRows[y]++;darkCols[x]++;darkMask[y*w+x]=1}
    if(r>cfg.redMin&&r-g>cfg.redDelta&&r-b>cfg.redDelta){redRows[y]++;redCols[x]++;redMask[y*w+x]=1}
  }

}

function verticalValleys(map){const p=map.darkCols,w=map.w,base=Math.max(.0025,quantile(p,.25)*1.35);return runs(p,(v,x)=>x>w*.12&&x<w*.88&&v<=base,Math.max(3,Math.round(w*.008))).map(r=>{const center=(r.start+r.end)/2,wing=Math.max(3,Math.round(w*.035)),left=mean(p,Math.max(0,r.start-wing),r.start),right=mean(p,r.end,Math.min(w,r.end+wing)),valley=mean(p,r.start,r.end),wingInk=Math.min(left,right),contrast=Math.max(0,(wingInk-valley)/Math.max(.004,wingInk)),widthScore=clamp(r.width/(w*.035));return{...r,center,ratio:center/w,contrast,strength:wingInk<.003?0:clamp(contrast*.7+widthScore*.3)}}).filter(r=>r.strength>=.16)}

function redTitleAnchors(map,x0,x1){const a=Math.max(0,Math.floor(x0*map.w)),b=Math.min(map.w,Math.ceil(x1*map.w)),colW=Math.max(1,b-a),counts=new Float64Array(map.h);

    const y=(run.start+run.end)/2;if(y<map.h*.015||y>map.h*.97)continue;const above=mean(map.darkRows,Math.max(0,run.start-Math.round(map.h*.018)),run.start),local=mean(map.darkRows,Math.max(0,run.start-1),Math.min(map.h,run.end+2)),redWidth=maxX>=minX?(maxX-minX+1)/colW:0;if(redWidth>.42&&run.width<map.h*.008)continue;
    const q=clamp(.28+clamp((.11-above)/.11)*.28+clamp(redPixels/Math.max(5,colW*map.h*.00018))*.25+clamp((.028-run.width/map.h)/.026)*.19);if(q<.38||local<.001)continue;anchors.push({y:y/map.h,quality:q,redPixels,aboveInk:above,redWidth});}
  anchors.sort((x,y)=>x.y-y.y);const out=[];for(const a of anchors){const p=out.at(-1);if(p&&a.y-p.y<.20){if(a.quality>p.quality)out[out.length-1]=a}else out.push(a)}return out;}

function horizontalBoundaries(map){const profile=map.darkRows,[a,b]=activeRange(profile,.003),threshold=Math.max(.006,quantile([...profile].slice(a,b),.18)*1.4);return runs(profile,(v,y)=>y>a+map.h*.08&&y<b-map.h*.08&&v<=threshold,Math.max(5,Math.round(map.h*.025))).map(r=>({y:((r.start+r.end)/2)/map.h,width:r.width/map.h,strength:clamp(r.width/(map.h*.07))})).filter(r=>r.strength>=.4)}
function makeBoxes(map,columns){const edges=[0,...columns.cuts,1],boxes=[],signals=[];let totalRed=0,unresolvedColumns=0;
  for(let c=0;c<edges.length-1;c++){const x0=edges[c],x1=edges[c+1],red=redTitleAnchors(map,x0,x1),gaps=horizontalBoundaries(map);totalRed+=red.length;let starts,source;

    starts=starts.filter((v,i,a)=>i===0||v-a[i-1]>=.12).slice(0,5);const firstTop=red.length&&red[0].y>.035?clamp(red[0].y-.016):0,boundaries=[firstTop];for(let i=1;i<starts.length;i++)boundaries.push(clamp(starts[i]-.012));boundaries.push(1);
    for(let i=0;i<boundaries.length-1;i++){const bbox=[clamp(x0-(c?.004:0)),boundaries[i],clamp(x1+(c<edges.length-2?.004:0)),boundaries[i+1]];if(bbox[3]-bbox[1]<.11)continue;const redQuality=red[i]?.quality??0,confidence=clamp(.18+columns.confidence*.26+redQuality*.46+(source==='column_only'?.05:.1),.05,.88);boxes.push({bbox,confidence,reasons:[columns.reason,source==='red_key_title_position'?'빨간 조성 표기와 제목 줄로 보이는 시작점':source==='horizontal_whitespace_only'?'큰 가로 여백으로 추정한 경계(제목 미확정)':'단 배치만 확인되어 단 전체를 후보로 둠'],signals:{column:c+1,title_position_signal:Boolean(red[i]),red_quality:redQuality||null,boundary_source:source}})}

function mixedGridFromSolidSeparator(map){

function safeReviewDefaultBoxes(count){
  const n=Math.max(1,Math.min(SAFE_REVIEW_MAX_PARTS,Math.floor(Number(count)||1)));
  if(n===1)return [[0,0,1,1]];
  if(n===2)return [[0,0,.5,1],[.5,0,1,1]];
  if(n===3)return [[0,0,1/3,1],[1/3,0,2/3,1],[2/3,0,1,1]];
  if(n===4)return [[0,0,.5,.5],[.5,0,1,.5],[0,.5,.5,1],[.5,.5,1,1]];

  for(let row=0;row<rows;row++)for(let col=0;col<cols&&boxes.length<n;col++)boxes.push([col/cols,row/rows,(col+1)/cols,(row+1)/rows]);

}
function safeReviewConfirmCount(count){

  const currentMatches=safeReview.boxes.length===wanted;
  let boxes=currentMatches?safeReview.boxes.map(box=>box.slice()):null,selected=safeReview.selectedHypothesisId;
  if(!boxes&&matching.length){const picked=matching[0];boxes=picked.boxes.map(item=>(item.bbox||item).slice());selected=picked.id;}
  if(!boxes){boxes=safeReviewDefaultBoxes(wanted);selected='';}
  const changed=JSON.stringify(boxes)!==JSON.stringify(safeReview.boxes);
  safeReview.boxes=boxes;safeReview.selectedHypothesisId=selected;
  if(changed||safeReview.rows.length!==wanted){
    const previous=safeReview.rows.map(row=>({...row}));
    safeReview.rows=boxes.map((_,index)=>previous[index]
      ?{...previous[index],titleConfirmed:false,keyConfirmed:false,onlyOne:false}
      :safeReviewEmptyRow());
  }
  safeReview.declaredCount=wanted;safeReview.countConfirmed=true;
  safeReview.message=`이 사진은 ${wanted}곡으로 확정했습니다. 같은 ${wanted}곡 안에서 선 모양을 고치고 제목·키를 확인해 주세요.`;
  render();safeReviewPrefillVisualTitles();setTimeout(()=>safeReviewRecognizeTitles(safeReview.sourceFingerprint),0);return true;
}

function safeReviewKnownTitleNorm(value){
  return String(value||'').normalize('NFKC').toLocaleLowerCase('ko-KR').replace(/[\s\p{P}\p{S}]+/gu,'');
}
function safeReviewKnownSong(title){
  const wanted=safeReviewKnownTitleNorm(title);
  if(!wanted)return null;
  const matches=(DATA.songs||[]).filter(song=>[song.title,...(song.aliases||[])].some(value=>safeReviewKnownTitleNorm(value)===wanted));
  const unique=[...new Map(matches.map(song=>[song.id,song])).values()];
  return unique.length===1?unique[0]:null;
}
function safeReviewTitleSuggestions(index){
  const row=typeof index==='number'?safeReview.rows[index]:null,text=String(row?.typedTitle||row?.title||index||'').trim();
  if(!text)return [];
  const api=window.safeScoreTitleOcr,matched=api?.matchTitleLines?api.matchTitleLines([{text,confidence:1}],DATA.songs||[]):null;
  const candidates=[matched?.best,...(matched?.alternatives||[])].filter(Boolean),out=[];
  for(const candidate of candidates){const song=safeReviewSongById(candidate.songId);if(!song||out.some(item=>item.id===song.id))continue;out.push({...song,_matchScore:candidate.score,_matchSource:candidate.source,_matchExact:candidate.exact});}
  const exact=safeReviewKnownSong(text);if(exact&&!out.some(item=>item.id===exact.id))out.unshift({...exact,_matchScore:1,_matchSource:'title',_matchExact:true});
  return out.slice(0,3);
}
function safeReviewSuggestionHtml(index){
  const row=safeReview.rows[index]||{},suggestions=safeReviewTitleSuggestions(index);
  if(row.songId){const song=safeReviewSongById(row.songId);return song?`<div class="matched">✓ 기존 곡 「${esc(song.title)}」에 연결됩니다</div>`:'';}
  if(!String(row.title||'').trim())return '<span class="sub">제목을 쓰면 띄어쓰기·별칭·첫 가사를 비교해 기존 곡을 추천합니다.</span>';
  if(!suggestions.length)return '<span class="sub">비슷한 기존 곡을 찾지 못했습니다.</span>';

}

function safeReviewPrefillVisualTitles(){

      if(result?.status!=='prefill'||!result.title)return;

async function safeReviewRecognizeTitles(expectedFingerprint=safeReview.sourceFingerprint){
  if(window.__FAKE_DB__&&!window.__ENABLE_SAFE_TITLE_OCR_TEST__)return {status:'test_skipped'};
  if(!window.safeScoreTitleOcr||!safeReview.analysisCanvas||!safeReview.boxes.length)return {status:'unavailable'};
  if(expectedFingerprint!==safeReview.sourceFingerprint||safeReview.detector?.recognition_source==='verified_exact_sha256')return {status:'stale_or_known'};
  await safeReviewStopTitleOcr();
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),45000);
  const expectedRevision=safeReview.layoutRevision;
  const boxes=safeReview.boxes.map(box=>box.slice());
  safeReviewOcrAbort=controller;
  const adapter=typeof window.__SAFE_TITLE_OCR_FACTORY__==='function'?window.__SAFE_TITLE_OCR_FACTORY__():window.safeScoreTitleOcr.createTesseractAdapter();
  safeReviewOcrAdapter=adapter;
  safeReview.titleOcr={busy:true,done:0,total:boxes.length,prefilled:0,failed:0};
  safeReview.message=`제목 띠만 읽는 중입니다 · 0/${boxes.length}`;render();
  try{
    for(let index=0;index<boxes.length;index++){
      if(controller.signal.aborted||expectedFingerprint!==safeReview.sourceFingerprint||expectedRevision!==safeReview.layoutRevision)break;
      const existingRow=safeReview.rows[index];
      if(existingRow&&(existingRow.songId||String(existingRow.title||'').trim())){
        safeReview.titleOcr.done=index+1;
        continue;
      }
      const result=await window.safeScoreTitleOcr.recognizeTitleBands({
        source:safeReview.analysisCanvas,bbox:boxes[index],songs:DATA.songs||[],adapter,signal:controller.signal,timeoutMs:12000,
        onProgress:progress=>{const el=document.getElementById('safeReviewOcrProgress');if(el)el.textContent=`제목 읽기 ${index+1}/${boxes.length} · ${Math.round((progress.progress||0)*100)}%`;}
      });
      if(expectedFingerprint!==safeReview.sourceFingerprint||expectedRevision!==safeReview.layoutRevision)break;
      const row=safeReview.rows[index];
      if(result.status==='prefill'&&result.prefill&&row&&!row.songId&&!String(row.title||'').trim()){
        const song=safeReviewSongById(result.prefill.songId);
        if(song){row.songId=song.id;row.title=song.title;row.typedTitle=song.title;row.titleConfirmed=false;row.key=SAFE_REVIEW_KEYS.includes(result.prefill.key)?result.prefill.key:(SAFE_REVIEW_KEYS.includes(song.key)?song.key:'');row.keyConfirmed=false;row.recognition=`ocr_${result.prefill.matchedBy}`;safeReview.titleOcr.prefilled++;}
      }else if(result.suggestion&&row&&!row.songId&&!String(row.title||'').trim()){
        const song=safeReviewSongById(result.suggestion.songId);
        if(song){row.title=song.title;row.typedTitle=song.title;row.recognition='ocr_first_lyric_suggestion';}
      }else if(result.status!=='manual_required')safeReview.titleOcr.failed++;
      if(row&&!row.key&&SAFE_REVIEW_KEYS.includes(result.detectedKey)){row.key=result.detectedKey;row.keyConfirmed=false;}
      safeReview.titleOcr.done=index+1;
      safeReview.message=`제목 띠 인식 ${safeReview.titleOcr.done}/${safeReview.titleOcr.total} · 정확히 연결 ${safeReview.titleOcr.prefilled}곡`;
    }
  }catch(_){safeReview.titleOcr.failed++;}
  finally{
    clearTimeout(timeout);safeReview.titleOcr.busy=false;
    if(safeReviewOcrAbort===controller)safeReviewOcrAbort=null;
    if(safeReviewOcrAdapter===adapter)safeReviewOcrAdapter=null;
    if(adapter&&typeof adapter.dispose==='function')try{await adapter.dispose();}catch(_){}
  }
  if(expectedFingerprint!==safeReview.sourceFingerprint||expectedRevision!==safeReview.layoutRevision)return {status:'stale'};
  safeReview.message=safeReview.titleOcr.prefilled
    ?`제목 ${safeReview.titleOcr.prefilled}곡을 교회 곡 목록에서 찾았습니다. 경계·곡·키를 눈으로 확인해 주세요.`
    :'제목을 확실하게 읽지 못했습니다. 곡을 직접 선택해 주세요.';
  render();
  return {status:'complete',...safeReview.titleOcr};
}

async function safeReviewLoadFile(file){
  if(!file || !SAFE_REVIEW_FILE_TYPES.has(String(file.type||'').toLowerCase())){ say('JPG, PNG, WebP 이미지만 넣어 주세요. SVG와 GIF는 사용할 수 없습니다.'); return false; }
  if(!Number.isFinite(file.size)||file.size<1||file.size>SAFE_REVIEW_ORIGINAL_MAX_BYTES){ say('원본 이미지는 1바이트 이상 25MB 이하여야 합니다.'); return false; }
  if(safeReview.saving||safeReview.lockHeld||['rpc_unknown','cleanup_unknown'].includes(safeReview.status)){say('현재 저장 또는 복구를 먼저 끝내 주세요. 그동안 다른 이미지를 열 수 없습니다.');return false;}

/* ==================================================================
   Web score search - authenticated Edge Functions + browser review

   This fragment deliberately never downloads an arbitrary URL. The search
   function returns a short-lived token and the fetch function accepts only
   that token. The fetched Blob is inspected in Canvas before it is offered.
   ================================================================== */

/* 이 조각은 KEYS 선언보다 먼저 합쳐질 수 있다. const의 TDZ를 건드리지 않도록
   화면에서 쓰는 12개 조성은 여기서 독립적으로 고정한다. */
const WEB_SCORE_KEYS = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B',
                        'Cm','Dbm','Dm','Ebm','Em','Fm','Gbm','Gm','Abm','Am','Bbm','Bm'];

let webScoreState = null;

function webScoreButton(songId, context, label){
  const sid = encodeURIComponent(String(songId || ''));
  const ctx = encodeURIComponent(String(context || 'song'));
  return `<button class="btn sm" type="button"
    onclick="webScoreOpen(decodeURIComponent('${sid}'),decodeURIComponent('${ctx}'))">
    🔎 ${esc(label || '웹에서 악보 찾기')}
  </button>`;
}

function webScoreOpen(songId, context, options){
  const song = S[songId];
  if(!song){ say('곡을 먼저 선택해 주세요.'); return; }
  const replaceMatch = String(context || '').match(/:replace:([^:]+)$/);
  const replacing = replaceMatch && (song.sheets || []).find(x=>x.id===replaceMatch[1]);
  webScoreDisposePreview();
  webScoreState = {
    open: true, songId, context: context || 'song',
    query: String(options&&options.query || `${song.title} 악보`),
    key: String(options&&options.key || (replacing&&replacing.key) || song.key || ''),
    loading: false, saving: false, message: '', error: '',
    candidates: [], cursor: 0, candidate: null,
    previewUrl: '', previewBlob: null, metrics: null,
    rejected: 0, large: false,
  };
  render();
  webScoreRunSearch();
}

function webScoreClose(){
  webScoreDisposePreview();
  webScoreState = null;
  render();
}

function webScoreDisposePreview(){
  if(webScoreState && webScoreState.previewUrl){
    URL.revokeObjectURL(webScoreState.previewUrl);
    webScoreState.previewUrl = '';
  }
}

function webScoreSetKey(key){
  if(!webScoreState || !WEB_SCORE_KEYS.includes(key)) return;
  webScoreState.key = key;
  render();
}

function webScoreToggleBig(){
  if(!webScoreState) return;
  webScoreState.large = !webScoreState.large;
  render();
}

async function webScoreRunSearch(){
  const st = webScoreState;
  if(!st || st.loading) return;
  const query = String(st.query || '').trim();
  if(query.length < 2){ say('검색할 곡 제목을 두 글자 이상 적어 주세요.'); return; }
  st.loading = true; st.error = ''; st.message = '선명한 오선 악보를 찾는 중…';
  st.candidates = []; st.cursor = 0; st.candidate = null; st.rejected = 0;
  webScoreDisposePreview();
  render();
  try {
    const { data, error } = await sb.functions.invoke('score-image-search', {
      body: { query }
    });
    if(error) throw error;
    st.candidates = Array.isArray(data && data.results) ? data.results : [];
    if(!st.candidates.length) throw new Error('공개 사용이 가능한 악보 이미지를 찾지 못했습니다.');
    st.message = `${st.candidates.length}개 후보에서 오선 악보를 확인하는 중…`;
    render();
    await webScoreUseNext(true);
  } catch(e){
    st.error = friendlyError(e);
    st.message = '';
  } finally {
    st.loading = false;
    render();
  }
}

async function webScoreUseNext(automatic){
  const st = webScoreState;
  if(!st || (!automatic && st.loading)) return;
  if(!automatic){ st.loading = true; st.error = ''; st.message = '다른 악보를 확인하는 중…'; render(); }
  webScoreDisposePreview();
  st.previewBlob = null; st.candidate = null; st.metrics = null; st.large = false;
  let lastError = null;
  while(st.cursor < st.candidates.length){
    const candidate = st.candidates[st.cursor++];
    try {
      const { data, error } = await sb.functions.invoke('score-image-fetch-v2', {
        body: { token: candidate.token }
      });
      if(error) throw error;
      const blob = await webScoreAsBlob(data);
      if(!blob || !String(blob.type || '').startsWith('image/')) throw new Error('이미지 응답이 아닙니다.');
      const metrics = await webScoreAnalyzeBlob(blob);
      if(!metrics.looksLikeSheet){ st.rejected++; continue; }
      st.previewBlob = blob;
      st.previewUrl = URL.createObjectURL(blob);
      st.candidate = candidate;
      st.metrics = metrics;
      st.message = '';
      break;
    } catch(e){ lastError = e; st.rejected++; }
  }
  if(!st.previewBlob){
    st.message = '';
    st.error = lastError ? friendlyError(lastError) : '선명한 오선 악보 후보를 더 찾지 못했습니다.';
  }
  if(!automatic){ st.loading = false; render(); }
}

async function webScoreAsBlob(data){
  let blob = null;
  if(data instanceof Blob) blob = data;
  else if(data instanceof ArrayBuffer) blob = new Blob([data]);
  else if(data && data.blob instanceof Blob) blob = data.blob;
  if(data && typeof data.arrayBuffer === 'function'){
    const ab = await data.arrayBuffer();
    blob = new Blob([ab], { type: data.type || '' });
  }
  if(!blob) return null;
  if(String(blob.type || '').startsWith('image/')) return blob;
  const head = new Uint8Array(await blob.slice(0, 16).arrayBuffer());
  let type = '';
  if(head.length >= 3 && head[0]===0xff && head[1]===0xd8 && head[2]===0xff) type='image/jpeg';
  else if(head.length >= 8 && head[0]===0x89 && head[1]===0x50 && head[2]===0x4e && head[3]===0x47) type='image/png';
  else if(head.length >= 12 && String.fromCharCode(...head.slice(0,4))==='RIFF'
    && String.fromCharCode(...head.slice(8,12))==='WEBP') type='image/webp';
  return type ? new Blob([blob], { type }) : null;
}

async function webScoreBitmap(blob){
  if(typeof createImageBitmap === 'function') return createImageBitmap(blob);
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다.')); };
    img.src = url;
  });
}

/** A forgiving staff detector: enough long dark rows, five-line groups and
    white background. The person still confirms the final preview. */
async function webScoreAnalyzeBlob(blob){
  const dimensions = await webScoreImageDimensions(blob);
  if(!dimensions || dimensions.width > 12000 || dimensions.height > 12000
    || dimensions.width * dimensions.height > 40000000)
    throw new Error('이미지 해상도가 지나치게 큽니다. 다른 이미지를 골라 주세요.');
  const img = await webScoreBitmap(blob);
  const originalWidth = img.width;
  const originalHeight = img.height;
  const scale = Math.min(1, 520 / img.width, 760 / img.height);
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  if(typeof img.close === 'function') img.close();
  const px = ctx.getImageData(0, 0, w, h).data;
  const rows = new Uint32Array(h);
  let white = 0, dark = 0, edges = 0;
  let prior = new Uint8Array(w);
  for(let y = 0; y < h; y++){
    let left = 255;
    for(let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      const lum = Math.round(px[i] * .299 + px[i+1] * .587 + px[i+2] * .114);
      if(lum > 222) white++;
      if(lum < 142){ dark++; rows[y]++; }
      if(x && Math.abs(lum - left) > 75) edges++;
      if(y && Math.abs(lum - prior[x]) > 75) edges++;
      left = lum; prior[x] = lum;
    }
  }
  const strong = [];
  for(let y = 0; y < h; y++) if(rows[y] / w >= .13) strong.push(y);
  const centers = [];
  for(let i = 0; i < strong.length;){
    let j = i, sum = strong[i];
    while(j + 1 < strong.length && strong[j+1] <= strong[j] + 1){ j++; sum += strong[j]; }
    centers.push(sum / (j - i + 1)); i = j + 1;
  }
  let groups = 0;
  for(let i = 0; i + 4 < centers.length; i++){
    const gaps = [1,2,3,4].map(k => centers[i+k] - centers[i+k-1]);
    const avg = gaps.reduce((a,b) => a+b, 0) / 4;
    if(avg >= 1.7 && avg <= 16 && Math.max(...gaps) - Math.min(...gaps) <= Math.max(2.2, avg * .48)){
      groups++; i += 3;
    }
  }
  const total = w * h;
  const whiteRatio = white / total, darkRatio = dark / total;
  const edgeRatio = edges / Math.max(1, total * 2);
  const looksLikeSheet = whiteRatio >= .43 && darkRatio >= .004 && darkRatio <= .43
    && edgeRatio >= .008 && (groups >= 1 || centers.length >= 9);
  return { width: originalWidth || w, height: originalHeight || h, whiteRatio, darkRatio,
    edgeRatio, longRows: centers.length, staffGroups: groups, looksLikeSheet };
}

/** 압축된 이미지의 가로·세로를 먼저 읽어 거대한 이미지가 Canvas를 점유하지 못하게 한다. */
async function webScoreImageDimensions(blob){
  const b = new Uint8Array(await blob.slice(0, 262144).arrayBuffer());
  if(b.length>24&&b[0]===0x89&&b[1]===0x50&&b[2]===0x4e&&b[3]===0x47){
    const v=new DataView(b.buffer,b.byteOffset); return {width:v.getUint32(16),height:v.getUint32(20)};
  }
  if(b.length>12&&b[0]===0xff&&b[1]===0xd8){
    for(let i=2;i+9<b.length;){
      if(b[i]!==0xff){i++;continue;}
      const m=b[i+1],len=(b[i+2]<<8)|b[i+3];
      if([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(m))
        return {height:(b[i+5]<<8)|b[i+6],width:(b[i+7]<<8)|b[i+8]};
      if(len<2) break; i+=2+len;
    }
  }
  if(b.length>30&&String.fromCharCode(...b.slice(0,4))==='RIFF'&&String.fromCharCode(...b.slice(8,12))==='WEBP'){
    const t=String.fromCharCode(...b.slice(12,16));
    if(t==='VP8X') return {width:1+b[24]+(b[25]<<8)+(b[26]<<16),height:1+b[27]+(b[28]<<8)+(b[29]<<16)};
    if(t==='VP8 ') return {width:(b[26]|b[27]<<8)&0x3fff,height:(b[28]|b[29]<<8)&0x3fff};
  }
  return null;
}

async function webScoreJpegBlob(blob){
  const img = await webScoreBitmap(blob);
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
  if(typeof img.close === 'function') img.close();
  return new Promise((resolve, reject) => canvas.toBlob(
    b => b ? resolve(b) : reject(new Error('악보 이미지를 변환하지 못했습니다.')),
    'image/jpeg', .9));
}

async function webScoreSave(){
  const st = webScoreState;
  if(!st || !st.previewBlob || !st.candidate || st.saving) return;
  if(!st.key){ say('이 악보의 코드를 먼저 골라 주세요.'); return; }
  st.saving = true; st.error = ''; st.message = '악보를 저장하는 중…'; render();
  try {
    const song = S[st.songId];
    if(!song) throw new Error('곡을 찾지 못했습니다.');
    const replaceMatch = String(st.context || '').match(/:replace:([^:]+)$/);
    const { data, error } = await sb.functions.invoke('score-image-commit', {
      body: { token: st.candidate.token, songId: st.songId, sheetKey: st.key,
        replaceSheetId: replaceMatch ? replaceMatch[1] : null }
    });
    if(error || !data || !data.sheetId) throw error || new Error('악보 저장 결과를 확인하지 못했습니다.');
    await loadAll();
    webScoreDisposePreview();
    webScoreState = null;
    if(typeof sheetAuditRefreshAfterSheet==='function') sheetAuditRefreshAfterSheet();
    else render();
    say(`${esc(song.title)} 웹 악보와 출처를 ${replaceMatch ? '교체했습니다.' : '저장했습니다.'}`);
  } catch(e){
    st.error = friendlyError(e); st.message = '';
  } finally {
    if(webScoreState){ webScoreState.saving = false; render(); }
  }
}

const HOME_RECOMMENDATION_KEY_ORDER = new Map([
  ['C',0],['C#',1],['Db',1],['D',2],['D#',3],['Eb',3],['E',4],['F',5],
  ['F#',6],['Gb',6],['G',7],['G#',8],['Ab',8],['A',9],['A#',10],['Bb',10],['B',11],

function homeRecommendationCodes(song, kind){
  if(kind === 'sung') return homeRecommendationObservedCodes(song);
  const found = new Set();
  const raw = String(song.key || '').replace(/♭/g,'b').replace(/♯/g,'#');
  for(const match of raw.matchAll(/[A-G](?:#|b)?m?/g)) found.add(match[0]);
  return [...found].sort((a,b) => homeRecommendationKeyOrder(a) - homeRecommendationKeyOrder(b)
    || a.localeCompare(b));
}
function homeRecommendationObservedCodes(song){
  if(!song || song.recommendationVirtual) return [];

  DATA.songs.filter(candidate => [candidate.title, ...(candidate.aliases || [])]
    .map(norm).some(name => names.has(name)))
    .forEach(candidate => leaderSongObservedKeys(candidate.id).forEach(code => found.add(code)));
  return [...found].sort((a,b) => homeRecommendationKeyOrder(a) - homeRecommendationKeyOrder(b)
    || a.localeCompare(b));

/* 인도자 홈: 우리 교회가 실제로 한 번이라도 부른 곡 전체 */
const LEADER_SONG_ALPHA_GROUPS = ['전체','가','나','다','라','마','바','사','아','자','차','카','타','파','하','기타'];
const LEADER_SONG_KEY_GROUPS = ['전체','C','D','E','F','G','A','B','기타'];
let leaderChurchSongView = {mode:'alpha', group:'전체', query:''};
function leaderSongAlphaGroup(title){
  const ch = String(title || '').trim()[0] || '';
  const code = ch.charCodeAt(0);
  if(code < 0xAC00 || code > 0xD7A3) return '기타';
  const initial = Math.floor((code - 0xAC00) / 588);
  return ['가','가','나','다','다','라','마','바','바','사','사','아','자','자','차','카','타','파','하'][initial] || '기타';
}
function leaderSongKeyGroups(songId){
  const groups = new Set();
  const naturalKeys = ['C','D','E','F','G','A','B'];
  songAppearances(songId).forEach(ap => {
    const key = String(ap.key || '').replace(/♭/g,'b').replace(/♯/g,'#');
    const matches = [...key.matchAll(/([A-G])([#b]?)(?=[m0-9+\-/,\s()]|$)/gi)];
    matches.forEach(match => {
      const letter = match[1].toUpperCase();
      groups.add(letter);
      if(match[2]) groups.add(naturalKeys[(naturalKeys.indexOf(letter) + 1) % naturalKeys.length]);
    });
  });
  return groups.size ? [...groups] : ['기타'];
}
function leaderSongObservedKeys(songId){
  const found = new Set();
  songAppearances(songId).forEach(ap => {
    const raw = String(ap.key || '').replace(/♭/g,'b').replace(/♯/g,'#');
    for(const match of raw.matchAll(/[A-G](?:#|b)?m?/g)) found.add(match[0]);
  });
  const chromatic = ['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'];
  return [...found].sort((a,b) => {
    const ai = chromatic.indexOf(a.replace(/m$/,''));
    const bi = chromatic.indexOf(b.replace(/m$/,''));
    return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi) || Number(a.endsWith('m')) - Number(b.endsWith('m'));
  });
}
function leaderChurchSongRows(){
  return DATA.songs.map(song => {
    const appearances = songAppearances(song.id);
    return {song, count:appearances.length, alpha:leaderSongAlphaGroup(song.title),
      keys:leaderSongKeyGroups(song.id), codes:leaderSongObservedKeys(song.id)};
  }).filter(row => row.count > 0 && !isAllStatsSkip(row.song.id) && !junkReason(row.song.title))
    .sort((a,b) => String(a.song.title).localeCompare(String(b.song.title), 'ko', {numeric:true}));
}
function leaderChurchSongSearchScore(song, rawQuery){
  const query = norm(rawQuery);
  if(!query) return 1;
  return Math.max(...[song.title, ...(song.aliases || [])].filter(Boolean).map(value => {
    const candidate = norm(value);
    if(candidate === query) return 1;
    if(candidate.includes(query) || query.includes(candidate))
      return .9 + .09 * Math.min(candidate.length, query.length) / Math.max(candidate.length, query.length);
    return contiTitleSimilarity(query, candidate);
  }));
}
function leaderChurchSongFilteredRows(){
  const mode = leaderChurchSongView.mode;
  const group = leaderChurchSongView.group;
  const query = norm(leaderChurchSongView.query);
  return leaderChurchSongRows().map(row => ({...row, searchScore:leaderChurchSongSearchScore(row.song, query)}))
    .filter(row => {
    /* 이름을 입력하면 현재 가나다/코드 칸과 무관하게 교회 전체에서 찾는다. */
    if(!query && group !== '전체'){
      if(mode === 'alpha' && row.alpha !== group) return false;
      if(mode === 'key' && !row.keys.includes(group)) return false;
    }
    if(!query) return true;
    const threshold = query.length <= 1 ? .9 : query.length === 2 ? .5 : .32;
    return row.searchScore >= threshold;
  }).sort((a,b) => query ? b.searchScore-a.searchScore
    || String(a.song.title).localeCompare(String(b.song.title), 'ko', {numeric:true}) : 0)
    .slice(0, query ? 20 : undefined);
}
function leaderChurchSongResultsHtml(){
  const rows = leaderChurchSongFilteredRows();
  const searching = !!leaderChurchSongView.query.trim();
  return `<div class="leader-church-song-result-h" aria-live="polite">
      <span>${searching ? '비슷한 제목 순 · 직접 확인' : '표시 중'}</span><b>${rows.length}곡</b>

          onclick="leaderChurchSongOpen('${row.song.id}')" aria-label="${esc(row.song.title)} 악보 미리보기">${esc(row.song.title)}</button>
        <span class="leader-church-song-meta">${row.codes.length
          ? `<i aria-label="부른 코드 ${esc(row.codes.join(', '))}">${esc(row.codes.join(' · '))}</i>` : ''}<b>${row.count}회</b></span></div>
        ${peekHtml('pk_leader_church_'+row.song.id)}</li>`).join('')}</ol>`

}

  }

  const found = searchSongs(text).slice(0,6);
  return `${found.length ? `<div class="stack" style="gap:6px">${found.map(s=>{
      const inList = inputState.picked.some(p=>p.songId===s.id);
      return `<div class="row" style="border:1px solid var(--line);padding:8px 11px;border-radius:8px;flex-wrap:wrap">
        <b>${esc(s.title)}</b>${keyBadge(s.key)}

function addUnifiedSong(songId, sungKey){
  const sg = S[songId];
  if(!sg || inputState.picked.some(p=>p.songId===songId)) return;
  inputState.picked.push({songId, key:sungKey || sg.key || '', note:''});

function addUnifiedMatched(){
  const lines = inputState.pasted.split('\n').map(matchTitle).filter(Boolean);
  const existing = new Set(inputState.picked.map(p=>p.songId));
  const found = [];
  lines.forEach(l=>{
    if(l.songId && !existing.has(l.songId)){
      found.push(l);
      existing.add(l.songId);
    }
  });
  found.forEach(l=>{
    const sg = S[l.songId];
    inputState.picked.push({songId:l.songId, key:l.key || (sg&&sg.key)||'', note:''});
  });
  inputState.pasted = lines.filter(l=>!l.songId).map(l=>l.raw).join('\n');
  render();
  if(typeof say === 'function') say(found.length ? `${found.length}곡을 담았습니다.` : '새로 담을 곡이 없습니다.');
}

/** 정확히 못 찾은 여러 줄에도 기존 곡 후보를 먼저 보여 중복 생성을 막는다. */
function contiTitleSimilarity(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return 0;
  if(a.includes(b)||b.includes(a)) return Math.min(a.length,b.length)/Math.max(a.length,b.length);
  const grams=s=>{const out=[];for(let i=0;i<Math.max(1,s.length-1);i++)out.push(s.slice(i,i+2));return out;};
  const aa=grams(a), bb=grams(b), used=new Set(); let same=0;
  aa.forEach((g,i)=>{const j=bb.findIndex((x,k)=>x===g&&!used.has(k));if(j>=0){used.add(j);same++;}});
  return (2*same)/(aa.length+bb.length);
}
function similarContiSongs(raw,limit=3){
  return DATA.songs.map(s=>({s,score:Math.max(...[s.title,...s.aliases].map(v=>contiTitleSimilarity(raw,v))) }))
    .filter(x=>x.score>=.28).sort((a,b)=>b.score-a.score||a.s.title.localeCompare(b.s.title,'ko'))
    .slice(0,limit).map(x=>x.s);
}
function useUnifiedSuggestion(raw,songId){
  const sg=S[songId]; if(!sg) return;
  if(!inputState.picked.some(p=>p.songId===songId))
    inputState.picked.push({songId,key:sg.key||'',note:''});
  const target=norm(raw);
  inputState.pasted=inputState.pasted.split('\n')
    .filter(line=>norm(line.replace(/^\s*[\d]+[.)\-]\s*/,''))!==target).join('\n');
  render();
}
function matchBox(lines){
  if(!lines.length) return '';
  return `<div class="stack" style="gap:6px">${lines.map(l=>{
    if(l.songId){
      const s = S[l.songId];
      // 입력한 글자가 대표 제목과 조금이라도 다르면 무엇을 무엇으로 알아봤는지 밝힌다
      const differs = s.title !== l.raw;
      return `<div class="row" style="background:#F2F7F3;padding:7px 11px;border-radius:8px;font-size:13.5px">
        <span class="matched">✓</span><b>${esc(s.title)}</b>${keyBadge(l.key || s.key)}
        ${differs?`<span class="sub">입력 「${esc(l.raw)}」 → 같은 곡으로 인식</span>`:''}</div>`;
    }
    const suggestions=similarContiSongs(l.raw);
    return `<div style="background:#FBF1F0;padding:8px 11px;border-radius:8px;font-size:13.5px">
      <div class="row" style="flex-wrap:wrap"><span class="nomatch">?</span><b>${esc(l.raw)}</b>
        <span class="sub">등록된 곡에 없습니다</span><div class="spacer"></div>

const LIB_PAGE_SIZE = 40;
let libPage = 1;

function libPageRows(rows){
  const pages=Math.max(1,Math.ceil(rows.length/LIB_PAGE_SIZE));
  libPage=Math.min(Math.max(1,libPage),pages);
  return rows.slice((libPage-1)*LIB_PAGE_SIZE,libPage*LIB_PAGE_SIZE);
}
function libPagerHtml(total){
  const pages=Math.max(1,Math.ceil(total/LIB_PAGE_SIZE));
  if(pages<=1) return '';
  return `<div class="row" style="padding:12px;justify-content:center">
    <button class="btn sm" ${libPage<=1?'disabled':''} onclick="libPage--;renderLibRows()">이전</button>
    <span class="sub"><b>${libPage}</b> / ${pages}쪽</span>
    <button class="btn sm" ${libPage>=pages?'disabled':''} onclick="libPage++;renderLibRows()">다음</button>
  </div>`;
}

/* ── 곡 도서관 악보 검수 ─────────────────────────
   최근에 실제로 부른 곡부터 한 곡씩 확인한다. 「확인하고 다음」을 누를 때마다
   그 곡만 바로 저장하므로 중간에 그만두어도 앞에서 확인한 내용은 남는다. */
let sheetAudit = {
  chooser:false, active:false, period:'', label:'', ids:[], index:0,
  draft:null, saving:false, completed:0,
};

function sheetAuditCurrent(){
  return sheetAudit.active ? S[sheetAudit.ids[sheetAudit.index]] || null : null;
}
function sheetAuditDefaultSheet(song){
  return song ? ((song.sheets||[]).find(sh=>sh.origin) || (song.sheets||[])[0] || null) : null;
}
function sheetAuditEnsureDraft(){
  const song=sheetAuditCurrent();
  if(!song) return null;
  if(!sheetAudit.draft || sheetAudit.draft.songId!==song.id){
    const sh=sheetAuditDefaultSheet(song);
    sheetAudit.draft={songId:song.id,title:song.title||'',artist:song.artist||'',key:song.key||'',
      sheetId:sh?sh.id:null,sheetKey:sh?(sh.key||song.key||''):(song.key||'')};
  } else if(!sheetAudit.draft.sheetId && (song.sheets||[]).length){
    const sh=sheetAuditDefaultSheet(song);
    sheetAudit.draft.sheetId=sh.id;
    if(!sheetAudit.draft.sheetKey) sheetAudit.draft.sheetKey=sh.key||sheetAudit.draft.key||'';
  }
  return sheetAudit.draft;
}
function sheetAuditRefreshAfterSheet(){
  if(!sheetAudit.active){ render(); return; }
  sheetAuditEnsureDraft();
  render();
}
function sheetAuditPeriodHtml(){
  return `<div class="audit-periods" role="group" aria-label="악보 검수 기간">
    <b>최근 부른 기간</b>
    ${[['1개월',30],['3개월',90],['6개월',180],['1년',365],['전곡',0]].map(([label,days])=>
      `<button class="btn sm" type="button" onclick="sheetAuditStart('${label}',${days})">${label}</button>`).join('')}
    <span class="sub">기간 안에 한 번이라도 부른 곡을 최근 순으로 봅니다.</span>
  </div>`;
}
function sheetAuditProgressKey(period){return `conti-sheet-audit:${period}`;}
function sheetAuditReadProgress(period,ids){
  try{
    const saved=JSON.parse(localStorage.getItem(sheetAuditProgressKey(period))||'null');
    if(!saved||!Array.isArray(saved.ids)||saved.ids.join('|')!==ids.join('|'))return null;
    if(!(saved.index>0&&saved.index<ids.length))return null;
    return saved;
  }catch(_){return null;}
}
function sheetAuditRemember(){
  if(!sheetAudit.active)return;
  try{localStorage.setItem(sheetAuditProgressKey(sheetAudit.period),JSON.stringify({ids:sheetAudit.ids,index:sheetAudit.index,completed:sheetAudit.completed,updatedAt:new Date().toISOString()}));}catch(_){}
}
function sheetAuditForget(period){try{localStorage.removeItem(sheetAuditProgressKey(period));}catch(_){}}
function sheetAuditStart(label,days){
  if(!isAdmin()){ say('악보 검수는 담임목사만 사용할 수 있습니다.'); return; }
  const since=days?agoDate(days):'';
  let songs=days
    ? DATA.songs.filter(song=>(appear[song.id]||[]).some(item=>item.date>=since))
    : [...DATA.songs];
  if(days) songs.sort((a,b)=>((appear[b.id]||[])[0]?.date||'').localeCompare((appear[a.id]||[])[0]?.date||'') || a.title.localeCompare(b.title));
  else songs.sort((a,b)=>a.title.localeCompare(b.title));
  if(!songs.length){ say(`${label} 안에 부른 곡이 없습니다.`); return; }
  const ids=songs.map(s=>s.id),period=String(days||'all'),saved=sheetAuditReadProgress(period,ids);
  sheetAudit={chooser:false,active:true,period,label,ids,index:saved?saved.index:0,draft:null,saving:false,completed:saved?saved.completed:0};
  render(); window.scrollTo(0,0);
  if(saved)say(`지난번에 저장한 ${saved.completed}곡 다음부터 이어서 검수합니다.`);
}
function sheetAuditStop(){
  const saved=sheetAudit.completed;
  sheetAudit={chooser:false,active:false,period:'',label:'',ids:[],index:0,draft:null,saving:false,completed:0};
  render(); window.scrollTo(0,0);
  say(saved?`${saved}곡은 이미 저장했습니다. 다음에 같은 기간을 누르면 이어서 시작합니다.`:'악보 검수를 닫았습니다.');
}
function sheetAuditPickSheet(sheetId){
  const song=sheetAuditCurrent(),sh=song&&(song.sheets||[]).find(item=>item.id===sheetId);
  if(!sh) return;
  const draft=sheetAuditEnsureDraft(); draft.sheetId=sh.id; draft.sheetKey=sh.key||draft.key||''; render();
}
function sheetAuditSetKey(kind,key){
  if(!WEB_SCORE_KEYS.includes(key)) return;
  const draft=sheetAuditEnsureDraft(); if(!draft)return;
  if(kind==='song')draft.key=key;else draft.sheetKey=key; render();
}
function sheetAuditFindAnother(){
  const song=sheetAuditCurrent(),draft=sheetAuditEnsureDraft();
  if(!song||!draft||typeof webScoreOpen!=='function') return;
  const context=draft.sheetId?`audit:${song.id}:replace:${draft.sheetId}`:`audit:${song.id}:add`;

async function sheetAuditUseFile(file){
  if(!sheetAudit.active||sheetAudit.saving||!file) return false;
  if(!String(file.type||'').startsWith('image/')&&file.type!=='application/pdf'){
    say('악보 이미지나 PDF 파일을 넣어 주세요.'); return false;
  }
  const song=sheetAuditCurrent(),draft=sheetAuditEnsureDraft(); if(!song||!draft)return false;
  sheetAudit.saving=true;render();
  try{
    const sh=(song.sheets||[]).find(item=>item.id===draft.sheetId);
    const id=sh ? await replaceSheet(sh.id,sh.path,file)
      : await uploadSheet(song.id,file,draft.sheetKey||draft.key||song.key||'',true);
    if(!id) return false;
    sheetAudit.saving=false;sheetAuditRefreshAfterSheet();
    return true;
  } finally { if(sheetAudit.active){sheetAudit.saving=false;render();} }
}
function sheetAuditFileChanged(input){
  const file=input&&input.files&&input.files[0];if(input)input.value='';

function sheetAuditHandlePaste(file){

async function sheetAuditConfirmNext(){
  if(sheetAudit.saving)return;
  const song=sheetAuditCurrent(),draft=sheetAuditEnsureDraft(); if(!song||!draft)return;
  const title=String(draft.title||'').trim();
  if(!title){say('곡 제목을 확인해 주세요.');return;}
  if(typeof junkReason==='function'&&junkReason(title)){say('날짜나 예배명은 곡 제목으로 저장할 수 없습니다. 제목을 바로잡아 주세요.');return;}
  if(!WEB_SCORE_KEYS.includes(draft.key)){say('곡의 원키를 골라 주세요.');return;}
  const sh=(song.sheets||[]).find(item=>item.id===draft.sheetId);
  if(!sh){say('악보가 없습니다. 「다른 악보 찾기」나 붙여넣기로 먼저 넣어 주세요.');return;}
  if(!WEB_SCORE_KEYS.includes(draft.sheetKey)){say('지금 보이는 악보의 코드를 골라 주세요.');return;}
  sheetAudit.saving=true;render();
  try{
    const [songResult,sheetResult]=await Promise.all([
      sb.from('songs').update({title,artist:String(draft.artist||'').trim()||null,origin_key:draft.key}).eq('id',song.id),
      sb.from('sheets').update({sheet_key:draft.sheetKey}).eq('id',sh.id),
    ]);
    if(songResult.error)throw songResult.error;if(sheetResult.error)throw sheetResult.error;
    sheetAudit.completed++;sheetAudit.index++;sheetAudit.draft=null;sheetAuditRemember();
    await loadAll();
    if(sheetAudit.index>=sheetAudit.ids.length){
      const done=sheetAudit.completed,label=sheetAudit.label;
      sheetAuditForget(sheetAudit.period);
      sheetAudit={chooser:false,active:false,period:'',label:'',ids:[],index:0,draft:null,saving:false,completed:0};
      render();window.scrollTo(0,0);say(`${label} 악보 검수 ${done}곡을 모두 마쳤습니다.`);return;
    }
    sheetAudit.saving=false;render();window.scrollTo(0,0);
  }catch(e){sheetAudit.saving=false;render();say('저장하지 못했습니다.\n'+friendlyError(e));}
}

/** 조건에 맞는 곡을 추려 정렬한다 */
function libRows(){
  const map = sharedPathMap();
  let list = searchSongs(libF.q);
  if(libF.key) list = list.filter(s=>s.key===libF.key);
  if(libF.cat) list = list.filter(s=>s.category===libF.cat);
  if(libF.tag) list = list.filter(s=>s.autoTags.concat(s.manualTags).includes(libF.tag));
  if(libF.cutOnly) list = list.filter(s=>needsCut(s, map));
  const rows = list.map(s=>({s, n:countSong(s.id), last:lastSung(s.id),
                             added:songAddedAt(s), cut:needsCut(s, map), map}));
  if(libF.sort==='count') rows.sort((a,b)=>b.n-a.n);
  if(libF.sort==='recent') rows.sort((a,b)=>(b.last||'').localeCompare(a.last||''));
  if(libF.sort==='title') rows.sort((a,b)=>a.s.title.localeCompare(b.s.title));
  if(libF.sort==='old') rows.sort((a,b)=>(a.last||'9999').localeCompare(b.last||'9999'));
  if(libF.sort==='new') rows.sort((a,b)=>(b.added||'').localeCompare(a.added||''));
  return rows;
}

function movePicked(i, dir){
  const a = inputState.picked, j = i + dir;
  if(j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  render();
}

/** 붙여넣은 줄 중 찾아낸 곡을 한 번에 담는다 */
function addMatchedToPicked(){
  const lines = inputState.pasted.split('\n').map(matchTitle).filter(Boolean);
  const found = lines.filter(l => l.songId);
  if(!found.length){ say('붙여넣은 줄에서 등록된 곡을 찾지 못했습니다.'); return; }
  found.forEach(l => {
    const sg = S[l.songId];
    inputState.picked.push({ songId: l.songId, key: l.key || (sg ? sg.key : ''), note: '' });
  });
  const missing = lines.length - found.length;
  inputState.pasted = '';
  render();
  say(`${found.length}곡을 담았습니다.` + (missing ? ` 인식되지 않은 ${missing}줄은 그대로 남겨 두었습니다.` : ''));
}

/** 목록에 없던 제목을 새 곡으로 만들고 바로 담는다.
    같은 단추를 연속으로 눌러도 한 번만 생성한다. */
const quickCreatePending = new Map();
async function quickCreateSong(title, sungKey){
  const clean = String(title || '').trim();
  if(!clean) return;
  const k = norm(clean);
  const owner = !quickCreatePending.has(k);
  if(owner){
    quickCreatePending.set(k, (async()=>{
      const already = NORM_INDEX[k];
      if(already) return {id:already, created:false};
      // 같은 이벤트 틱에서 들어온 두 번째 요청이 잠금에 합류할 시간을 준 뒤 다시 확인한다.
      await Promise.resolve();
      const finalHit = NORM_INDEX[k];
      if(finalHit) return {id:finalHit, created:false};
      const id = await createSong(clean, {key:sungKey || ''});
      return {id, created:!!id};
    })());
  }
  let result;
  try { result = await quickCreatePending.get(k); }
  finally { if(owner) quickCreatePending.delete(k); }
  const id = result && result.id;
  if(!id) return;
  if(!inputState.picked.some(p=>p.songId===id))
    inputState.picked.push({ songId: id, key: sungKey || (S[id]&&S[id].key)||'', note: '' });
  inputState.pasted = inputState.pasted.split('\n')
    .filter(l => norm(l.trim().replace(/^\s*[\d]+[.)\-]\s*/, '')) !== k).join('\n');
  render();
  say(result.created
    ? `「${esc(clean)}」을 새 곡으로 등록하고 콘티에 담았습니다.\n이 화면에서 악보를 바로 찾아 확인할 수 있습니다.`
    : `기존 곡 「${esc(S[id] ? S[id].title : clean)}」으로 확인해 콘티에 담았습니다.`);
  if(owner && result.created && typeof webScoreOpen === 'function') webScoreOpen(id, 'conti:new');
}

/** 파일 이름에서 곡 제목과 조성을 읽어낸다 */
function titleFromFile(name){
  const base = String(name).replace(/\.[^.]+$/, '');
  const m = base.match(/^(.*?)\s*[（(\[]?\s*([A-Ga-g][b#♭♯]?)\s*[키)）\]]?\s*$/);
  return { title: (m ? m[1] : base).trim(), key: m ? tidyKey(m[2]) : '' };
}

/** 악보 등록 화면에서 여러 장을 한꺼번에 고른 경우
    폰에서 찍은 사진은 이름이 IMG_1234 라서 그대로 곡을 만들면 안 됩니다.
    그런 경우에는 「어떤 곡이 담겼는지」 물어보는 창을 대신 띄웁니다. */
async function onBulkSheetPick(ev){
  const files = [...(ev.target.files || [])];
  ev.target.value = '';
  if(!files.length) return;

  const named = [], unnamed = [];
  files.forEach(f => {
    const t = titleFromFile(f.name);
    (NORM_INDEX[norm(t.title)] || !junkReason(t.title) ? named : unnamed).push({ f, ...t });
  });

  // 제목을 알 수 없는 사진은 「곡 적어 넣기」 창으로 보낸다
  if(unnamed.length && !named.length){
    openPasteSheet(unnamed[0].f);
    say(unnamed.length > 1
      ? `사진 ${unnamed.length}장을 골랐습니다. 파일 이름으로 곡을 알 수 없어\n한 장씩 곡을 적어 등록합니다. 먼저 첫 장입니다.`
      : `파일 이름으로 곡을 알 수 없습니다.\n이 악보에 담긴 곡을 한 줄에 하나씩 적어 주세요.`);
    return;
  }

  let made = 0, attached = 0;
  for(const { f, title, key } of named){
    let hit = NORM_INDEX[norm(title)];
    if(!hit){ hit = await createSong(title, { key }); if(hit) made++; }
    if(!hit) continue;
    await uploadSheet(hit, f, key, !(S[hit] && S[hit].sheets.length));
    attached++;
  }
  await loadAll(); render();
  say(`악보 ${attached}장을 등록했습니다.` + (made ? ` 새 곡 ${made}개가 생성되었습니다.` : '')
      + (unnamed.length ? `\n이름으로 곡을 알 수 없는 사진 ${unnamed.length}장은 등록하지 않았습니다.` : '')
      + '\n파일 이름을 「곡제목 (G).pdf」 형식으로 두면 곡과 조성이 자동으로 인식됩니다.');
}

/* ── 화면 전환 ──────────────────────────────────── */
function render(){
  const app = document.getElementById('app');
  const bar = document.getElementById('topbar');
  if(!app) return;

  if(!AUTH_USER){ bar.style.display = 'none'; app.innerHTML = vLogin(); return; }
  if(!ME){ bar.style.display = 'none'; app.innerHTML = vNoAccess(); return; }
  bar.style.display = '';

  if(!inputState.serviceId && DATA.services.length) inputState = newInputState();

  const h = (location.hash || '#/home').replace(/^#\//, '');
  const [k, arg] = h.split('/');
  let html, navKey = k;

  // 설정과 자료 가져오기는 관리자 전용이다. 메뉴를 숨기는 데서 끝내지 않고,
  // 인도자가 주소를 직접 입력하거나 예전 즐겨찾기로 들어와도 홈으로 돌려보낸다.
  if((k === 'settings' || k === 'import') && !isAdmin()){
    location.hash = '#/home';
    return;
  }
  try {
    switch(k){
      case 'home':      html = vHome(); break;
      case 'setlists':  html = vSetlists(); break;
      case 'setlist':   html = vSetlist(arg); navKey = 'setlists'; break;
      case 'new':       html = READ_ONLY_PREVIEW
                          ? `<div class="empty">실제자료 읽기 전용 미리보기에서는 저장할 수 없습니다.</div>`
                          : vNew(); break;
      case 'leaders':   html = vLeaders(); break;
      case 'leader':    html = vLeader(arg); navKey = 'leaders'; break;
      case 'services':  html = vServices(); break;
      case 'service':   html = vService(arg); navKey = 'services'; break;
      case 'library':   html = vLibrary(); break;
      case 'song':      html = vSong(arg); navKey = 'library'; break;
      case 'sheets':    html = READ_ONLY_PREVIEW
                          ? `<div class="empty">실제자료 읽기 전용 미리보기에서는 악보를 등록할 수 없습니다.</div>`
                          : vSheets(); break;
      case 'conti-sheet': html = vContiSheet(arg); navKey = 'setlists'; break;
      case 'import':    html = vImport(); navKey = 'settings'; break;
      case 'settings':  html = vSettings(); break;
      default:          html = vHome(); navKey = 'home';
    }
  } catch(e){
    html = `<div class="empty">화면을 표시하는 중 오류가 발생했습니다.<br>
      <span class="sub">${esc(e.message || e)}</span><br><br>
      <button class="btn" onclick="location.hash='#/home';location.reload()">홈으로</button></div>`;
    console.error(e);
  }

  const previewBanner = READ_ONLY_PREVIEW
    ? `<div class="info no-print" style="margin-bottom:12px;border-left:4px solid #B46A18"><b>실제자료 읽기 전용</b> · 2026-08-01 백업 콘티 186개와 검수 악보 826개를 연결한 운영 준비 화면입니다. 이 화면에서는 추가·수정·삭제가 되지 않습니다.</div>`
    : '';
  app.innerHTML = previewBanner + html + vSheetPickModal() + vMergeModal() + vOcrModal()
                  + vPasteModal() + vReplaceModal() + vCutModal();
  renderNav(navKey);
  renderWho();
  hydrateSheets();
  paintCutMan();
  paintPracticeParts();
}

function renderNav(cur){
  const nav = document.getElementById('nav');
  if(!nav) return;
  const items = leaderInterface() ? LEADER_NAV : NAV;
  nav.innerHTML = items.filter(([k]) => {
      if(READ_ONLY_PREVIEW && (k === 'new' || k === 'sheets' || k === 'settings')) return false;
      return k !== 'settings' || isAdmin();
    })
    .map(([k, n]) => `<a href="#/${k}" class="${cur === k ? 'on' : ''}">${n}</a>`).join('');
}

function renderWho(){
  const chip = document.getElementById('cartChip');
  if(chip) chip.innerHTML = leaderInterface() ? '' : cartChipHtml();
  const el = document.getElementById('whoami');
  if(!el) return;
  el.innerHTML = ME
    ? `<b>${esc(ME.name)}</b> <span class="who-role" style="opacity:.6">${esc(ME.role)}</span>
       ${isAdmin() ? `<button class="admin-preview-toggle" type="button" onclick="setAdminLeaderPreview(${ADMIN_LEADER_PREVIEW?'false':'true'})">
         <span class="preview-wide">${ADMIN_LEADER_PREVIEW?'← 관리자 화면으로 돌아가기':'인도자 버전 보기'}</span>
         <span class="preview-short">${ADMIN_LEADER_PREVIEW?'← 관리자 화면':'인도자 화면'}</span></button>` : ''}
       ${READ_ONLY_PREVIEW ? '' : `<span class="lnk" style="color:#C6D2E8;margin-left:9px" onclick="signOut()">로그아웃</span>`}`
    : '';
}

window.addEventListener('hashchange', () => {
  closeYT(true);
  Object.keys(shownSheet).forEach(k => delete shownSheet[k]);
  confirmState.pending = null;
  render();
  window.scrollTo(0, 0);
});

/* 다른 기기에서 로그아웃하거나 로그인 상태가 바뀌면 따라간다 */
sb.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT'){ AUTH_USER = null; ME = null; render(); }
});

initPaste();   // 어디서든 Ctrl+V 로 악보 이미지를 붙여넣을 수 있게
boot();

/* ── 백업 내려받기 ──────────────────────────────── */
function downloadBackup(){
  const dump = {
    만든날: new Date().toISOString(),
    설명: '맛있는교회 찬양 콘티 앱 백업. 인도자·예배·곡·콘티 전체입니다. 악보 그림은 들어있지 않습니다.',
    인도자: ALL_LEADERS, 예배: DATA.services, 곡: DATA.songs, 콘티: DATA.setlists,
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `맛있는교회_콘티백업_${TODAY}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  say(`콘티 ${DATA.setlists.length}개를 파일로 내려받았습니다.\n클라우드 저장소에 보관해 주세요.`);
}

/* ── 휴지통 ─────────────────────────────────────── */
let TRASH = null;
async function loadTrash(){
  const { data, error } = await sb.from('setlists').select('*')
    .not('deleted_at', 'is', null).order('deleted_at', { ascending: false });
  if(error){ say('휴지통을 열지 못했습니다.\n' + friendlyError(error)); return; }
  TRASH = data || [];
  render();
  say(TRASH.length ? `삭제된 콘티 ${TRASH.length}개가 있습니다.` : '휴지통이 비어 있습니다.');
}
async function restoreSetlist(id){
  const { error } = await sb.from('setlists').update({ deleted_at: null }).eq('id', id);
  if(error){ say('되살리지 못했습니다.\n' + friendlyError(error)); return; }
  TRASH = TRASH.filter(t => t.id !== id);
  await loadAll(); render();
  say('콘티를 복구했습니다.');
}
